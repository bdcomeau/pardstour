<!DOCTYPE html>
<html lang="en">
<!-- pards-live-v1.0 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pards Live</title>
<style>
:root { --gold:#c9a84c; --bg:#0b0d10; --card:#14181d; --line:rgba(201,168,76,.16); --txt:#e9edf2; --dim:rgba(233,237,242,.45); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
body { padding:0 0 40px; }
.wrap { max-width:820px; margin:0 auto; padding:0 12px; }
.top { position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#0b0d10 72%,rgba(11,13,16,0));
  padding:14px 0 10px; }
.brand { font-size:11px; letter-spacing:2.4px; text-transform:uppercase; color:var(--gold); font-weight:800; }
.evName { font-size:19px; font-weight:800; margin-top:3px; line-height:1.25; }
.evMeta { font-size:12px; color:var(--dim); margin-top:3px; }
.chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800;
  text-transform:uppercase; letter-spacing:.6px; border:1px solid var(--line); color:var(--gold); }
.chip.live { color:#7bd88f; border-color:rgba(123,216,143,.4); background:rgba(123,216,143,.08); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; }
.rowsHd,.row { display:grid; grid-template-columns:30px 1fr 46px 56px; gap:8px; align-items:center; }
.rowsHd { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
  padding:0 2px 7px; border-bottom:1px solid var(--line); font-weight:700; }
.row { padding:9px 2px; border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer; }
.row:last-child { border-bottom:0; }
.pos { font-size:12px; color:var(--dim); font-weight:700; text-align:center; }
.nm { font-size:14px; font-weight:650; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.thru { font-size:11.5px; color:var(--dim); text-align:right; }
.sc { font-size:16px; font-weight:800; text-align:right; color:var(--gold); }
.grid { display:grid; grid-template-columns:repeat(9,1fr); gap:3px; margin-top:8px; }
.cellHd { font-size:9px; color:var(--dim); text-align:center; padding-bottom:2px; }
.cell { text-align:center; font-size:12.5px; font-weight:700; padding:5px 0; border-radius:5px;
  background:rgba(255,255,255,.04); }
.eag { background:rgba(255,205,60,.24); color:#ffd83c; }
.bird { background:rgba(123,216,143,.2); color:#7bd88f; }
.bog { background:rgba(255,255,255,.06); color:rgba(255,255,255,.55); }
.dbl { background:rgba(255,110,110,.16); color:#ff8f8f; }
.det { display:none; padding:4px 2px 12px; border-bottom:1px solid rgba(255,255,255,.05); }
.det.on { display:block; }
.detMeta { font-size:11px; color:var(--dim); margin-top:7px; }
.msg { border-radius:10px; padding:9px 11px; margin-top:8px; font-size:12.5px; line-height:1.45;
  border:1px solid var(--line); background:rgba(201,168,76,.06); }
.msg.danger { border-color:rgba(255,110,110,.35); background:rgba(255,110,110,.08); color:#ffb3b3; }
.msg.sponsor { border-color:rgba(123,216,143,.3); background:rgba(123,216,143,.07); }
.msgHole { font-size:9.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--gold);
  font-weight:800; margin-bottom:3px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tab { padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:transparent;
  color:var(--dim); font-size:11.5px; font-weight:700; cursor:pointer; }
.tab.on { background:rgba(201,168,76,.14); color:var(--gold); border-color:rgba(201,168,76,.45); }
input { width:100%; padding:13px; font-size:17px; text-align:center; letter-spacing:5px; border-radius:10px;
  border:1px solid var(--line); background:#0f1216; color:var(--txt); font-weight:700; }
button.go { width:100%; margin-top:9px; padding:13px; font-size:14px; font-weight:800; border-radius:10px;
  border:1px solid rgba(201,168,76,.5); background:rgba(201,168,76,.16); color:var(--gold); cursor:pointer; }
.note { font-size:11.5px; color:var(--dim); margin-top:12px; line-height:1.5; text-align:center; }
.err { color:#ff8f8f; font-size:13px; margin-top:10px; text-align:center; }
.foot { text-align:center; font-size:10px; color:rgba(233,237,242,.25); margin-top:22px; letter-spacing:.5px; }
</style>
</head>

function gid(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

/* Lite's _ptJson lesson (trap 110): read text() and parse, so an HTML error
   page from the edge does not throw a bare SyntaxError with no message. */
function jget(url, opts) {
  return fetch(url, opts || {}).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (_) {}
      if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
      return d;
    });
  });
}

/* ── THE DOOR ────────────────────────────────────────────────── */
function askCode(errMsg) {
  gid('hdr').innerHTML = '';
  gid('app').innerHTML =
    '<div class="card" style="margin-top:26px">'
    + '<div style="font-size:13px;color:rgba(233,237,242,.7);text-align:center;margin-bottom:11px">'
    + 'Enter the 6-digit code from your organizer</div>'
    + '<input id="cd" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">'
    + '<button class="go" id="goBtn">Watch</button>'
    + (errMsg ? '<div class="err">' + esc(errMsg) + '</div>' : '')
    + '<div class="note">Live scores only &mdash; nothing here can be edited.</div>'
    + '</div>';
  gid('goBtn').onclick = function () {
    var v = (gid('cd').value || '').trim();
    if (v.length < 4) return;
    history.replaceState(null, '', '?code=' + encodeURIComponent(v));
    boot();
  };
  gid('cd').onkeydown = function (e) { if (e.key === 'Enter') gid('goBtn').click(); };
  gid('cd').focus();
}

/* ── EVENT FLAVOUR ───────────────────────────────────────────── */
function loadEvent(code) {
  return jget(API + '/api/events/watch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    // ⭐⭐⭐ public:true — the whole reason worker v3.36.0 exists. Sending it
    // swaps the full event config for a six-key display whitelist. ⛔ Never
    // drop this flag to "get more data": the extra data is exactly what
    // ruling 1 keeps off this page.
    body: JSON.stringify({ event_code: code, public: true })
  }).then(function (d) {
    S.ev = d.event || null;
    S.cfg = null;
    try { S.cfg = d.event && d.event.config ? JSON.parse(d.event.config) : null; } catch (_) {}
    S.roundId = d.round ? d.round.id : null;
    return jget(API + '/api/events/' + S.ev.id + '/rounds').catch(function () { return { rounds: [] }; });
  }).then(function (r) {
    // Draft rounds have nothing to watch — B-82's viewer rule, same reasoning.
    S.rounds = (r.rounds || []).filter(function (x) { return x.status !== 'draft'; });
    if (!S.roundId && S.rounds.length) S.roundId = S.rounds[S.rounds.length - 1].id;
    paintHeader();
    return refresh();
  });
}

function paintHeader() {
  var e = S.ev || {};
  var live = String(e.status || '').toLowerCase() === 'active';
  var bits = [];
  if (e.course_name) bits.push(esc(e.course_name));
  if (e.date) bits.push(esc(e.date));
  var lg = S.cfg && S.cfg.league ? S.cfg.league.name : null;
  gid('hdr').innerHTML =
    '<div class="evName">' + esc(e.name || 'Live') + '</div>'
    + '<div class="evMeta">' + bits.join(' &middot; ')
    + (lg ? ' &middot; ' + esc(lg) : '')
    + ' &nbsp;<span class="chip' + (live ? ' live' : '') + '">' + (live ? 'Live' : esc(e.status || '')) + '</span></div>';
}

function refresh() {
  if (!S.ev || !S.roundId) { gid('app').innerHTML = '<div class="card"><div class="note">No round is open for scoring yet.</div></div>'; return Promise.resolve(); }
  return jget(API + '/api/events/' + S.ev.id + '/rounds/' + S.roundId + '/leaderboard')
    .then(function (d) { paintBoard(d); })
    .catch(function (e) { gid('app').innerHTML = '<div class="err">' + esc(e.message || 'Could not load') + '</div>'; });
}

/* Which column IS the score depends on the round's format — the same three
   families the worker sorts by. Stableford ranks on points (high wins), the
   low-net and low-gross families on strokes (low wins). */
function scoreKey(fmt) {
  var f = String(fmt || '');
  if (f.indexOf('stableford') >= 0) return 'points';
  if (f.indexOf('low_net') >= 0 || f.indexOf('_net') >= 0) return 'net';
  return 'gross';
}
function scoreLabel(k) { return k === 'points' ? 'Pts' : k === 'net' ? 'Net' : 'Gross'; }

function paintBoard(d) {
  var round = d.round || {};
  var key = scoreKey(round.format);
  var rows = (d.standings || []);
  var h = '';

  if (S.rounds.length > 1) {
    h += '<div class="tabs">';
    S.rounds.forEach(function (r) {
      h += '<button class="tab' + (r.id === S.roundId ? ' on' : '') + '" onclick="pickRound(' + r.id + ')">Round ' + r.round_number + '</button>';
    });
    h += '</div>';
  }

  h += holeMsgs(round);

  h += '<div class="card">';
  if (d.unavailable) {
    h += '<div class="note">' + esc(d.unavailable) + '</div>';
  } else if (!rows.length) {
    h += '<div class="note">No scores posted yet.<br>This page refreshes itself every 30 seconds.</div>';
  } else {
    h += '<div class="rowsHd"><div style="text-align:center">#</div><div>Player</div><div style="text-align:right">Thru</div><div style="text-align:right">' + scoreLabel(key) + '</div></div>';
    rows.forEach(function (r, i) {
      var v = r[key];
      var id = 'd' + i;
      h += '<div class="row" onclick="tog(\'' + id + '\')">'
        + '<div class="pos">' + (i + 1) + '</div>'
        + '<div class="nm">' + esc(r.name) + '</div>'
        + '<div class="thru">' + (r.holes_played === 18 ? 'F' : (r.holes_played || 0)) + '</div>'
        + '<div class="sc">' + (v == null ? '&ndash;' : v) + '</div>'
        + '</div>'
        + '<div class="det" id="' + id + '">' + card(r) + '</div>';
    });
  }
  h += '</div>';
  h += '<div class="note">Updated ' + (rows.length && rows[0].updated_at ? esc(rows[0].updated_at) + ' UTC' : 'just now') + '</div>';
  gid('app').innerHTML = h;
  Object.keys(S.open).forEach(function (k) { var el = gid(k); if (el && S.open[k]) el.className = 'det on'; });
}

/* The hole-by-hole card. The row's own `data` blob carries scores_by_hole and
   the course id; par comes from the SAME baked table Lite uses, so a course
   Lite knows, this page knows. Unknown course -> plain numbers, no colour, and
   no guessing. */
function card(r) {
  var d = r.data || {};
  var by = d.scores_by_hole || {};
  var pars = (d.course_id && PARS[d.course_id]) ? PARS[d.course_id] : null;
  if (!Object.keys(by).length) return '<div class="detMeta">No holes posted yet.</div>';
  var out = '';
  [[1, 9], [10, 18]].forEach(function (seg) {
    out += '<div class="grid">';
    for (var i = seg[0]; i <= seg[1]; i++) out += '<div class="cellHd">' + i + '</div>';
    out += '</div><div class="grid">';
    for (var j = seg[0]; j <= seg[1]; j++) {
      var v = by[j] != null ? by[j] : by[String(j)];
      var cls = 'cell';
      if (v != null && pars) {
        var diff = v - pars[j - 1];
        cls = diff <= -2 ? 'cell eag' : diff === -1 ? 'cell bird' : diff === 1 ? 'cell bog' : diff >= 2 ? 'cell dbl' : 'cell';
      }
      out += '<div class="' + cls + '">' + (v == null ? '&middot;' : v) + '</div>';
    }
    out += '</div>';
  });
  var meta = [];
  if (d.tee) meta.push('Tee ' + esc(d.tee));
  if (d.playing_handicap != null) meta.push('Playing hcp ' + d.playing_handicap);
  if (r.gross != null) meta.push('Gross ' + r.gross);
  if (r.net != null) meta.push('Net ' + r.net);
  if (r.points != null) meta.push('Points ' + r.points);
  out += '<div class="detMeta">' + meta.join(' &middot; ') + '</div>';
  return out;
}

/* hole_msgs is one of the six whitelisted config keys — the notices, hazards
   and sponsor lines Bruce writes for the players. Alerts ride the round;
   per-hole notes are labelled with their hole. */
function holeMsgs(round) {
  var hm = S.cfg && S.cfg.hole_msgs && S.cfg.hole_msgs.rounds ? S.cfg.hole_msgs.rounds : null;
  if (!hm) return '';
  var blk = hm[round.round_number] || hm[String(round.round_number)] || null;
  if (!blk) return '';
  var out = '';
  (blk.alerts || []).forEach(function (a) {
    if (!a || !a.text) return;
    out += '<div class="msg ' + esc(a.tone || '') + '">' + esc(a.text) + '</div>';
  });
  var holes = blk.holes || {};
  Object.keys(holes).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (k) {
    var m = holes[k];
    if (!m || !m.text) return;
    out += '<div class="msg ' + esc(m.tone || '') + '"><div class="msgHole">Hole ' + esc(k) + '</div>' + esc(m.text) + '</div>';
  });
  return out;
}

/* ── TRIP FLAVOUR ────────────────────────────────────────────── */
/* The trip door already existed and needed nothing built: the trip
   leaderboard route takes viewer_pin (or the trip code) and its payload was
   measured clean at s243 — points, gross, net, handicaps, nothing else. */
function loadTrip(tripId, pin) {
  return jget(API + '/api/trips/' + tripId + '/leaderboard?pin=' + encodeURIComponent(pin))
    .then(function (d) {
      S.trip = d.trip || {};
      gid('hdr').innerHTML = '<div class="evName">' + esc(S.trip.name || 'Trip') + '</div>'
        + '<div class="evMeta">' + esc(S.trip.destination || '') + '</div>';
      var rows = d.standings || [];
      var h = '<div class="card"><div class="rowsHd"><div style="text-align:center">#</div><div>Player</div><div style="text-align:right">Thru</div><div style="text-align:right">Pts</div></div>';
      rows.forEach(function (r, i) {
        var holes = (r.rounds || []).reduce(function (a, x) { return a + (x.holes || 0); }, 0);
        h += '<div class="row"><div class="pos">' + (i + 1) + '</div>'
          + '<div class="nm">' + esc(r.name) + '</div>'
          + '<div class="thru">' + holes + '</div>'
          + '<div class="sc">' + (r.total_pts == null ? '&ndash;' : r.total_pts) + '</div></div>';
      });
      if (!rows.length) h += '<div class="note">No scores posted yet.</div>';
      gid('app').innerHTML = h + '</div>';
    });
}

/* ── PLUMBING ────────────────────────────────────────────────── */
window.tog = function (id) {
  var el = gid(id); if (!el) return;
  var on = el.className.indexOf('on') < 0;
  el.className = on ? 'det on' : 'det';
  S.open[id] = on;
};
window.pickRound = function (id) { S.roundId = id; S.open = {}; refresh(); };

function boot() {
  var q = new URLSearchParams(location.search);
  var code = (q.get('code') || q.get('c') || '').trim();
  var trip = (q.get('trip') || '').trim();
  var pin  = (q.get('pin') || '').trim();
  gid('foot').textContent = 'Pards Live · ' + LIVE_VERSION.replace('live-', '');
  if (S.timer) { clearInterval(S.timer); S.timer = null; }

  if (trip && pin) {
    loadTrip(trip, pin).catch(function (e) {
      gid('app').innerHTML = '<div class="err">' + esc(e.message || 'Could not open that trip') + '</div>';
    });
    S.timer = setInterval(function () { loadTrip(trip, pin).catch(function () {}); }, 30000);
    return;
  }
  if (!code) { askCode(''); return; }
  gid('app').innerHTML = '<div class="note" style="margin-top:30px">Loading&hellip;</div>';
  loadEvent(code).then(function () {
    S.timer = setInterval(function () { refresh(); }, 30000);
  }).catch(function (e) {
    askCode(e && /404|not found/i.test(e.message || '') ? 'No event with that code.' : (e.message || 'Could not load'));
  });
}
boot();
</script>
