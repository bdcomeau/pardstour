<!DOCTYPE html>
<html lang="en">
<!-- pards-live-v1.32 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pards Live</title>
<!-- ⭐⭐ v1.21 (Bruce, s282) — PARDS LIVE BECOMES INSTALLABLE.
     Lite has had a home-screen icon since v1.0; Live never did, so the board people
     actually watch all day lived in a browser tab. Same shape as pards-lite.webmanifest,
     its own copper icon set. theme_color matches --bg (#0b0d10) so the status bar and
     the splash do not flash a different colour on open.
     ⛔ NOT a service worker. There is still no offline mode anywhere in Pards Tour. -->
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="pards-live.webmanifest">
<link rel="apple-touch-icon" href="live-apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="live-icon-192.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pards Live">
<style>
:root { --gold:#c9a84c; --bg:#0b0d10; --card:#14181d; --line:rgba(201,168,76,.16); --txt:#e9edf2; --dim:rgba(233,237,242,.78); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
body { padding:0 0 calc(84px + env(safe-area-inset-bottom)); }   /* B-256 (v1.22) */   /* v1.14 (s274) — clear the fixed bottom ticker */
.wrap { max-width:820px; margin:0 auto; padding:0 12px; }
.top { position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#0b0d10 72%,rgba(11,13,16,0));
  padding:calc(14px + env(safe-area-inset-top)) 0 10px; }   /* B-256 (v1.22) — viewport-fit=cover draws under the iPhone status bar; pad back out of it */
.brand { font-size:11px; letter-spacing:2.4px; text-transform:uppercase; color:var(--gold); font-weight:800; }
.evName { font-size:19px; font-weight:800; margin-top:3px; line-height:1.25; }
.evMeta { font-size:12px; color:var(--dim); margin-top:3px; }
.chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800;
  text-transform:uppercase; letter-spacing:.6px; border:1px solid var(--line); color:var(--gold); }
.chip.live { color:#7bd88f; border-color:rgba(123,216,143,.4); background:rgba(123,216,143,.08); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; }
.rowsHd,.row { display:grid; grid-template-columns:30px 1fr 46px 56px; gap:8px; align-items:center; }
/* v1.12 (Bruce, s273): "this view should also include plus and minus to par".
   ⛔ .rowsHd/.row are shared with the trip board below, so the fifth column
   rides a MODIFIER used by the event board only. */
.rowsHd.tp,.row.tp { grid-template-columns:30px 1fr 40px 46px 52px; }
/* v1.26 (FR-286) — the trip/league board: # · Player · Thru · Gross · Net · Pts */
.rowsHd.lg,.row.lg { grid-template-columns:26px 1fr 32px 44px 44px 40px; gap:6px; }
.rowsHd.lg.ch,.row.lg.ch { grid-template-columns:26px 1fr 32px 44px 44px 40px 14px; }   /* v1.27 — the expander chevron */
/* ⭐⭐ v1.14 (Bruce, s274): "it is not obvious the players are selectable to see
   scorecard". Every event row gets a ▼ that flips when it opens. ⛔ .rowsHd/.row are
   SHARED with the trip board, so the extra column rides a MODIFIER (.ch) exactly the
   way the to-par column rides .tp — the trip board's grid does not move. */
.rowsHd.ch,.row.ch { grid-template-columns:30px 1fr 46px 56px 14px; }
.rowsHd.tp.ch,.row.tp.ch { grid-template-columns:30px 1fr 40px 46px 52px 14px; }
.chev { font-size:9px; color:rgba(201,168,76,.6); text-align:right; line-height:1;
  transition:transform .16s ease; }
.chev.up { transform:rotate(180deg); }
/* One card per round inside an open row (v1.14). */
.cardR { margin-top:12px; }
.cardR.first { margin-top:2px; }
.cardRH { display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  font-size:10px; text-transform:uppercase; letter-spacing:.9px; color:var(--gold);
  font-weight:800; padding-bottom:4px; margin-bottom:5px;
  border-bottom:1px solid rgba(201,168,76,.22); }
.cardRH span { color:var(--dim); font-weight:700; letter-spacing:.3px; text-transform:none; font-size:11px; }
.tpar { font-size:13px; font-weight:800; text-align:right; }
.rowsHd { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
  padding:0 2px 7px; border-bottom:1px solid var(--line); font-weight:700; }
.row { padding:9px 2px; border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer; }
.row:last-child { border-bottom:0; }
.pos { font-size:12px; color:var(--dim); font-weight:700; text-align:center; }
.nm { font-size:14px; font-weight:650; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.thru { font-size:11.5px; color:var(--dim); text-align:right; }
.sc { font-size:16px; font-weight:800; text-align:right; color:var(--gold); }
.grid { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin-top:8px; }
.cellHd { font-size:10px; font-weight:700; color:var(--dim); text-align:center; padding-bottom:2px; }
.cell { text-align:center; font-size:13.5px; font-weight:800; padding:6px 0; border-radius:5px;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); }
/* s269 — the client's ONE score palette (_ptScoreCellColor), verbatim.
   Bruce: "yes all the same". Empty cells keep the flat wash. */
.ace { background:#8e44ad; color:#fff; border-color:transparent; }
.eag { background:#e67e22; color:#fff; border-color:transparent; }
.bird { background:#e74c3c; color:#fff; border-color:transparent; }
.par { background:#2563eb; color:#fff; border-color:transparent; }
.bog { background:#dde0e3; color:#1a1a1a; border-color:transparent; }
.dbl { background:#1a1a1a; color:#fff; }
.trip { background:#1a1a1a; color:#c9a84c; }
.det { display:none; padding:4px 2px 12px; border-bottom:1px solid rgba(255,255,255,.05); }
.det.on { display:block; }
.detMeta { font-size:12px; color:var(--dim); margin-top:7px; }
/* ⭐⭐⭐ s268 STANDING RULE — Bruce: "whenever there is a scoreboard or display
   or printout for an individual round ALWAYS include Gross Score TOTALs after
   front 9 and back nine and total". OUT/IN ride the score grid as a 10th
   column; the total gets its own strip because it is the number people look
   for from across a patio. */
.cellTot { text-align:center; font-size:13.5px; font-weight:800; padding:6px 0; border-radius:5px;
  background:rgba(201,168,76,.22); border:1px solid rgba(201,168,76,.5); color:var(--gold); }
.cellTotHd { font-size:10px; font-weight:800; color:var(--gold); text-align:center; padding-bottom:2px; letter-spacing:.5px; }
.grossBar { display:flex; align-items:baseline; justify-content:center; gap:8px; margin-top:9px;
  padding:7px 10px; border-radius:8px; background:rgba(201,168,76,.14); border:1px solid rgba(201,168,76,.42); }
.grossBar b { font-size:19px; font-weight:900; color:var(--gold); letter-spacing:1px; }
.grossBar span { font-size:10.5px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:.8px; }
.msg { border-radius:10px; padding:9px 11px; margin-top:8px; font-size:12.5px; line-height:1.45;
  border:1px solid var(--line); background:rgba(201,168,76,.06); }
.msg.danger { border-color:rgba(255,110,110,.35); background:rgba(255,110,110,.08); color:#ffb3b3; }
.msg.sponsor { border-color:rgba(123,216,143,.3); background:rgba(123,216,143,.07); }
.msgHole { font-size:9.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--gold);
  font-weight:800; margin-bottom:3px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tab { padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:transparent;
  color:var(--dim); font-size:11.5px; font-weight:700; cursor:pointer; }
.tab.on { background:rgba(201,168,76,.14); color:var(--gold); border-color:rgba(201,168,76,.45); }
/* FR-330b (v1.28, s315) — THE WIRE tab: the round as it happened, newest first, off GET /api/wire/:CODE */
.wireHd { display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:800; padding-bottom:8px; border-bottom:1px solid var(--line); }
.wireHd span { color:var(--dim); letter-spacing:.3px; text-transform:none; font-size:11px; font-weight:700; }
.wireRow { display:flex; align-items:baseline; gap:10px; padding:9px 2px 9px 6px; border-bottom:1px solid rgba(255,255,255,.05); border-left:3px solid transparent; }
.wireRow.new { border-left-color:var(--gold); background:rgba(201,168,76,.06); }
.wireAt { flex:none; width:64px; font-size:12px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
.wireTx { font-size:14px; font-weight:650; line-height:1.3; min-width:0; }
.wireTx.lead,.wireTx.in { color:#f5e6b8; } .wireTx.good { color:#7fbf7f; } .wireTx.moose { color:#c9a84c; } .wireTx.card { color:#8fd0ff; } .wireTx.turn { color:rgba(255,255,255,.8); } .wireTx.bad { color:rgba(255,170,160,.95); }
/* ⭐ FR-188 (v1.23, s288, Bruce): "on the pards live screen - if it is listing
   individual scores - allow user to select to see Gross , Net or Par Point scores".
   Reuses .tab so the picker reads as one family with the round strip above it. */
.skBar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:10px 0 -2px; }
.skLbl { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); font-weight:800; }
/* B-233 (v1.15, s276): "there is no exit button to go back and enter a new code".
   A small pill in the top-right of the sticky header (so it stays reachable while the
   board scrolls). Reuses .tab; the id only positions it. Sits under the ticker (z 250). */
/* B-256 (v1.22) — top-right where it has always been, but clear of the status bar.
   ⛔ Do not move this to its own row: the header layout is his and a taller header
   costs a board row on the small screens.
   ⛔⛔⛔ s288 — THE "← PARDS TOUR" BUTTON THAT LIVED BESIDE ✕ EXIT IS GONE.
   Bruce, off the live Lauber board: "can you please remove this reference to going
   back to pards tour on the pards live board - I am not sure why it was added?"
   The honest answer is that it should never have shipped. Its gate,
   _b256CameFromTour(), FAILED OPEN — its last test was `history.length > 1`, true in
   almost any normal browser tab — so the button showed to nearly every SPECTATOR,
   people who arrived with a view code and have no Pards Tour to go back to.
   ⛔ NEVER RE-ADD IT. Pards Live is a public board, not a room inside the app.
   ⭐ What B-256 got RIGHT and KEEPS: viewport-fit=cover demands env(safe-area-inset-*),
   and ✕ Exit must sit clear of the iPhone status bar. That half stays. */
#topBtns { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:0; z-index:6;
  display:flex; gap:6px; align-items:flex-start; }
#exitBtn { position:static; margin:0; padding:5px 10px; font-size:11px; white-space:nowrap; }
#exitBtn[hidden] { display:none; }

/* ── FR-158 THE OVERALL BOARD (v1.13, s274) ──────────────────────
   Bruce, s273: "where is the overall here ? 727930 pards live".
   ⛔⛔ RANKING HAPPENS INSIDE A FLIGHT (s272). A section is a bracket, and no
   section is ever compared to another — "overall" means across ROUNDS.
   ⛔ The column count moves with the round count, so the grid template is set
   INLINE per row; the class carries everything that does not move. */
.oSec { margin-top:16px; }
.oSec.first { margin-top:2px; }
.oSecH { display:flex; align-items:baseline; gap:8px; padding:0 2px 6px;
  border-bottom:1px solid rgba(201,168,76,.3); }
.oSecName { font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold); font-weight:800; }
.oSecN { font-size:10.5px; color:var(--dim); font-weight:700; }
.oHd,.orow { display:grid; gap:5px; align-items:center; }
.oHd { font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim);
  padding:8px 2px 6px; font-weight:700; }
.orow { padding:8px 2px; border-bottom:1px solid rgba(255,255,255,.05); }
.orow:last-child { border-bottom:0; }
/* s273 — "Magnus goes to the bottom of Championship, greyed, no medal". */
.orow.out { opacity:.42; }
.onm { display:flex; align-items:center; gap:5px; min-width:0; }
.onmN { font-size:14px; font-weight:650; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.oR { font-size:12.5px; font-weight:700; text-align:right; color:var(--dim); }
.oR.live { font-weight:800; }
.oTot { font-size:13.5px; font-weight:800; text-align:right; }
.oTp { font-size:15px; font-weight:900; text-align:right; }
/* The band marker. A man who has played fewer rounds than his flight is NOT
   ranked against it (trap 207) — he bands below, and the chip says why. */
.oTag { flex:0 0 auto; padding:1px 5px; border-radius:999px; font-size:8.5px; font-weight:800;
  letter-spacing:.6px; text-transform:uppercase; border:1px solid rgba(255,255,255,.22); color:var(--dim); }
@media (min-width:520px) { .oHd,.orow { gap:9px; } .oR { font-size:13.5px; } .onmN { font-size:14.5px; } }
/* FR-154 (v1.9) — recent events under the code door */
.recent { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
.recentH { font-size:9.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); font-weight:800; margin-bottom:6px; }
.rc { display:flex; align-items:center; gap:8px; width:100%; margin-top:6px; padding:9px 10px; border-radius:10px;
  border:1px solid var(--line); background:rgba(201,168,76,.06); color:var(--txt); text-align:left; cursor:pointer; }
.rc .rcName { flex:1; font-size:13px; font-weight:800; color:var(--gold); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rc .rcCode { font-size:11px; color:var(--dim); letter-spacing:1.5px; font-weight:700; }
.rc .rcX { border:none; background:transparent; color:var(--dim); font-size:15px; font-weight:800; padding:0 2px 0 6px; cursor:pointer; line-height:1; }
input { width:100%; padding:13px; font-size:17px; text-align:center; letter-spacing:5px; border-radius:10px;
  border:1px solid var(--line); background:#0f1216; color:var(--txt); font-weight:700; }
button.go { width:100%; margin-top:9px; padding:13px; font-size:14px; font-weight:800; border-radius:10px;
  border:1px solid rgba(201,168,76,.5); background:rgba(201,168,76,.16); color:var(--gold); cursor:pointer; }
.note { font-size:11.5px; color:var(--dim); margin-top:12px; line-height:1.5; text-align:center; }
.err { color:#ff8f8f; font-size:13px; margin-top:10px; text-align:center; }
.foot { text-align:center; font-size:10px; color:rgba(233,237,242,.25); margin-top:22px; letter-spacing:.5px; }

/* ── FR-126 DRAFT BOARD (v1.1, s249) ── */
.dHd { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.dTitle { font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); font-weight:800; }
.dClock { margin-top:9px; padding:10px 12px; border-radius:10px; border:1px solid rgba(123,216,143,.35);
  background:rgba(123,216,143,.07); }
.dClockTop { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); font-weight:700; }
.dClockName { font-size:17px; font-weight:800; margin-top:2px; }
.dClockNeeds { font-size:11.5px; color:var(--dim); margin-top:3px; }
.dProg { font-size:11px; color:var(--dim); margin-top:9px; }
.dBar { height:4px; border-radius:3px; background:rgba(255,255,255,.07); margin-top:5px; overflow:hidden; }
.dBar i { display:block; height:100%; background:var(--gold); }
.teams { display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:9px; margin-top:11px; }
/* ⭐ FR-131 (v1.2, s251) — HIS ASK: on a COMPUTER SCREEN the draft board used a
   820 px column on a 16:9 monitor and ran 30 teams down ten rows of three.
   The page opens up to 1700 px and the team grid auto-fills, so a wide screen
   gets six or seven columns instead of three. ⛔ PHONES ARE UNTOUCHED — the
   whole change lives behind min-width:1200px, and it is scoped to the DRAFT
   BOARD by the .wideDraft class so the leaderboard keeps its reading width. */
@media (min-width:1200px) {
  .wrap.wideDraft { max-width:1700px; }
  .wrap.wideDraft .teams { grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
}
.team { border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:rgba(255,255,255,.02); }
.team.onclock { border-color:rgba(123,216,143,.45); background:rgba(123,216,143,.05); }
.teamNm { font-size:13px; font-weight:800; }
.teamNm .ord { color:var(--dim); font-weight:700; font-size:11px; margin-right:5px; }
.slot { display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:center; padding:5px 0;
  border-top:1px solid rgba(255,255,255,.05); font-size:12.5px; }
.slot:first-of-type { border-top:0; }
.slotK { font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); font-weight:800; }
.slotV { font-weight:650; }
.slotV.empty { color:rgba(233,237,242,.25); font-weight:600; font-style:italic; }
.pool { margin-top:12px; }
.poolHd { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); font-weight:800;
  padding-bottom:6px; border-bottom:1px solid var(--line); }
.poolGrp { margin-top:9px; }
.poolK { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--gold); font-weight:800; }
.poolNames { font-size:12.5px; color:rgba(233,237,242,.78); line-height:1.7; margin-top:2px; }
.card.done { border-color:rgba(201,168,76,.4); }

/* ── FR-134 THE TICKER (v1.4, s255) ──────────────────────────────
   Built for the big screen on Sept 26. Two copies of the same run scroll past
   and the loop wraps at -50%, so there is no visible seam and no JS timer —
   the browser owns the animation. ⭐ The duration is set in JS from the length
   of the text, because a fixed duration reads as a crawl on a short night and
   a blur on a busy one. */
/* ⭐⭐⭐ v1.14 (Bruce, s274): "the Ticker looks nothing like the client app pards
   live -ticker - its boring and it should be bottom of the screen".
   ⭐ The skin is COPIED, not invented — read straight off #ptTickerStrip in client
   v655.0: #0f2417, a gold top hairline at .35, #e8dcb8 text, 32px on a phone.
   ⭐ It is FIXED to the viewport. #tickHost sits inside .top, which is position:sticky
   — and sticky does NOT make a containing block for a fixed child, so the strip spans
   the whole window and ignores .wrap's 820px. body's bottom padding clears it. */
.tick { position:fixed; left:0; right:0; bottom:0; z-index:250; height:32px; line-height:32px;
  overflow:hidden; white-space:nowrap;
  background:#0f2417; border-top:1px solid rgba(201,168,76,.35);
  box-shadow:0 -6px 18px rgba(0,0,0,.45); }
.tickIn { display:inline-block; animation:tickmove 40s linear infinite; will-change:transform; }
.tickRun { font-size:13px; font-weight:700; letter-spacing:.3px; color:#e8dcb8; }
.tickRun b { color:var(--gold); font-weight:800; }
@keyframes tickmove { from { transform:translateX(0); } to { transform:translateX(-50%); } }
/* The big screen it was built for. */
@media (min-width:1200px) { .tick { height:48px; line-height:48px; } .tickRun { font-size:23px; } }
/* ⛔ Somebody watching on a phone with reduced motion gets the notes, standing
   still, rather than nothing. */
@media (prefers-reduced-motion:reduce) {
  .tickIn { animation:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Pards Live</div>
    <div id="topBtns">
      <button class="tab" id="exitBtn" type="button" title="Exit and enter a new code" hidden>&#x2715; Exit</button>
    </div>
    <div id="hdr"></div>
  </div>
  <!-- FR-134 (v1.4) — the ticker lives OUTSIDE #app on purpose: paintBoard
       replaces #app wholesale every 30 seconds, and a crawl that restarts twice
       a minute on a big screen is worse than no crawl at all. -->
  <div id="tickHost"></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/* ============================================================
   PARDS LIVE — the read-only spectator page. FR-116, v1.0, s243.

   Bruce's three s225 rulings, which this file exists to obey:
     1. NO PRIZE FUND ANYWHERE. Absent, not hidden — this page must never
        FETCH a prize-fund payload, so there is nothing here to leak even if
        somebody reads the source. That is why the watch call sends
        public:true (worker v3.36.0): without it the watch route hands back
        the whole event config, and that blob is where every prize-fund block
        lives on live events today. The worker's v3.36.0 header names them.
     2. A NEW small static page on the Lite pattern — own version line, own
        file, no service worker, no cache marker, nothing shared with the
        9 MB app. This file is independent of both.
     3. Scope is everything: tournaments, league nights, and trips.

   ⛔ READ-ONLY. The only POST is /api/events/watch, which writes nothing.
   ⛔ No PIN is invented here. A 6-digit event_code is already the public
      watch credential; trips use their existing viewer_pin, unchanged.
   ============================================================ */
'use strict';

function gid(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

/* Lite's _ptJson lesson (trap 110): read text() and parse, so an HTML error
   page from the edge does not throw a bare SyntaxError with no message. */
function jget(url, opts) {
  return fetch(url, opts || {}).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (_) {}
      if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
      return d;
    });
  });
}

/* ── THE DOOR ────────────────────────────────────────────────── */
function askCode(errMsg) {
  gid('hdr').innerHTML = '';
  gid('exitBtn').hidden = true;   /* B-233 (v1.15) — no board, no exit */
  gid('app').innerHTML =
    '<div class="card" style="margin-top:26px">'
    + '<div style="font-size:13px;color:rgba(233,237,242,.7);text-align:center;margin-bottom:11px">'
    + 'Enter the 6-digit code from your organizer</div>'
    + '<input id="cd" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">'
    + '<button class="go" id="goBtn">Watch</button>'
    + (errMsg ? '<div class="err">' + esc(errMsg) + '</div>' : '')
    + '<div class="note">Live scores only &mdash; nothing here can be edited.</div>'
    + recentHtml()
    + '</div>';
  wireRecent();
  gid('goBtn').onclick = function () {
    var v = (gid('cd').value || '').trim();
    if (v.length < 4) return;
    history.replaceState(null, '', '?code=' + encodeURIComponent(v));
    boot();
  };
  gid('cd').onkeydown = function (e) { if (e.key === 'Enter') gid('goBtn').click(); };
  gid('cd').focus();
}

/* ── FR-154 (v1.9) — THE LAST FIVE EVENTS YOU WATCHED ─────────────────────
   Bruce, s267/s271: "save the last 4-5 codes entered and display event name".
   Written on SUCCESSFUL load only (a typo never gets saved), newest first, deduped by
   code, capped at 5, {code, name, at}. Tapping a chip re-boots with ?code=, exactly what
   the Watch button does. × forgets one. Events only — the trip door is its own path.
   localStorage is fine on this origin; every read/write is try/catch'd (Safari private
   mode throws) so the door still opens when storage is unavailable. No service worker;
   this is not offline support. */
var RECENT_KEY = 'pl_recent', RECENT_MAX = 5;
function recentGet() { try { var a = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (_) { return []; } }
function recentPut(code, name) {
  try {
    var c = String(code || '').trim(); if (!c) return;
    var a = recentGet().filter(function (x) { return x && x.code !== c; });
    a.unshift({ code: c, name: String(name || '').slice(0, 80), at: Date.now() });
    localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0, RECENT_MAX)));
  } catch (_) {}
}
function recentDrop(code) { try { localStorage.setItem(RECENT_KEY, JSON.stringify(recentGet().filter(function (x) { return x && x.code !== code; }))); } catch (_) {} }
function recentHtml() {
  var a = recentGet(); if (!a.length) return '';
  return '<div class="recent"><div class="recentH">Recent events</div>'
    + a.map(function (x, i) {
        return '<div class="rc" data-i="' + i + '"><span class="rcName">' + esc(x.name || 'Event ' + x.code) + '</span>'
          + '<span class="rcCode">' + esc(x.code) + '</span><button class="rcX" data-x="' + i + '" title="Forget">&times;</button></div>';
      }).join('') + '</div>';
}
function wireRecent() {
  var a = recentGet();
  Array.prototype.forEach.call(document.querySelectorAll('.rc'), function (el) {
    el.onclick = function (e) {
      if (e.target && e.target.classList.contains('rcX')) { var j = +e.target.getAttribute('data-x'); if (a[j]) recentDrop(a[j].code); askCode(''); return; }
      var x = a[+el.getAttribute('data-i')]; if (!x) return;
      history.replaceState(null, '', '?code=' + encodeURIComponent(x.code));
      boot();
    };
  });
}

/* ── EVENT FLAVOUR ───────────────────────────────────────────── */
function loadEvent(code) {
  S.code = code;   /* v1.10 (s273) — the two public DNF reads are keyed by event CODE, not id */
  S.view = 'round'; S.overall = null;   /* v1.13 (s274) — a new code always lands on a round */
  return jget(API + '/api/events/watch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    // ⭐⭐⭐ public:true — the whole reason worker v3.36.0 exists. Sending it
    // swaps the full event config for a six-key display whitelist. ⛔ Never
    // drop this flag to "get more data": the extra data is exactly what
    // ruling 1 keeps off this page.
    body: JSON.stringify({ event_code: code, public: true })
  }).then(function (d) {
    S.ev = d.event || null;
    S.cfg = null;
    try { S.cfg = d.event && d.event.config ? JSON.parse(d.event.config) : null; } catch (_) {}
    S.roundId = d.round ? d.round.id : null;
    if (S.ev && S.ev.name) recentPut(code, S.ev.name);   /* FR-154 (v1.9) — remembered only once the event answered */
    return jget(API + '/api/events/' + S.ev.id + '/rounds').catch(function () { return { rounds: [] }; });
  }).then(function (r) {
    // Draft rounds have nothing to watch — B-82's viewer rule, same reasoning.
    S.rounds = (r.rounds || []).filter(function (x) { return x.status !== 'draft'; });
    if (!S.roundId && S.rounds.length) S.roundId = S.rounds[S.rounds.length - 1].id;
    paintHeader();
    return refresh();
  });
}

function paintHeader() {
  var e = S.ev || {};
  var live = String(e.status || '').toLowerCase() === 'active';
  var bits = [];
  if (e.course_name) bits.push(esc(e.course_name));
  if (e.date) bits.push(esc(e.date));
  var lg = S.cfg && S.cfg.league ? S.cfg.league.name : null;
  gid('hdr').innerHTML =
    '<div class="evName">' + esc(e.name || 'Live') + '</div>'

     and roster_id appears nowhere in it. v1.10 struck men off the sheet by roster_id,
     struck nobody off, and printed the ENTIRE FIELD as DNFs beneath their own scores.

     _ptLbIndex has always used (byName, trimmed and lower-cased). The roster_id test
     stays for the day the worker does send one. */

function b351FairSort(items, k) {

/* ⭐⭐ v1.12 (s273) — TO PAR off the row's OWN card. Par is summed over the holes

function toPar(r) {

/* ═══════════════════════════════════════════

   → one unheaded section → byte-for-byte the v1.18 board. */

function fltIndex() {

function fltSections(items, keyOf) {

     organizer's order, then any hand-assigned name alphabetically, then
     Unflighted last and unnamed when it is the only section. */

/* hole_msgs is one of the six whitelisted config keys — the notices, hazards

  var hm = S.cfg && S.cfg.hole_msgs && S.cfg.hole_msgs.rounds ? S.cfg.hole_msgs.rounds : null;
  if (!hm || !round) return '';
  var blk = hm[round.round_number] || hm[String(round.round_number)] || null;
  if (!blk) return '';
  var reached = reachedHoles(d);
  var out = '';
  (blk.alerts || []).forEach(function (a) {
    if (!a || !a.text) return;
    out += '<div class="msg ' + esc(a.tone || '') + '">' + esc(a.text) + '</div>';
  });
  var holes = blk.holes || {};
  Object.keys(holes).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (k) {
    var m = holes[k];
    if (!m || !m.text) return;
    if (!reached[String(Number(k))]) return;   /* ruling 3 — nobody is there yet */
    out += '<div class="msg ' + esc(m.tone || '') + '"><div class="msgHole">Hole ' + esc(k) + '</div>' + esc(m.text) + '</div>';
  });
  return out;
}

/* ══ FR-126 — THE REMOTE DRAFT BOARD (v1.1, s249) ══════════════

   `draft` is the SEVENTH key on the FR-116 allow-list (worker v3.38.0) and the
   only one this file's existence added. The record is written by the client's
   draft module on EVERY pick, so this page needs no new route and no polling
   of its own — the 30-second refresh already running picks it up.

   ⛔ READ-ONLY, like everything else here. ⛔ No money is in the record and
   none is derived from it: it is four bucket lists, a captain order, the picks
   and a roster_id→name map.

   Bruce's s249 rulings, which this code obeys:
     1. While the draft runs, the board sits ABOVE the leaderboard.
     2. The undrafted men are shown BY NAME — "yes of course".
     3. When it is done the Final teams card stays, below the leaderboard.
   ═════════════════════════════════════════════ */
var DBK = [['captain', 'Captain'], ['second', 'Second'], ['third', 'Third'], ['anchor', 'Anchor']];
var DNEED = { second: 'a Second', third: 'a Third', anchor: 'an Anchor' };

/* WHICH record: the watched round's, by id. A one-record event answers even if
   the round tab has moved (a draft night event usually has one round). An event
   carrying several drafts never guesses — it shows nothing rather than the
   wrong night's teams. */
function draftRec() {
  var all = (S.cfg && S.cfg.draft) || null;
  if (!all || typeof all !== 'object') return null;
  var r = all[String(S.roundId)];
  if (r && typeof r === 'object') return r;
  var ks = Object.keys(all);
  return (ks.length === 1 && all[ks[0]] && typeof all[ks[0]] === 'object') ? all[ks[0]] : null;
}

/* A record written before client v605.0 has no names map. Say "Player 412"
   rather than nothing — the board still tells you the shape of the night. */
function dName(rec, rid) {
  var n = (rec.names || {})[String(rid)];
  return (n == null || n === '') ? ('Player ' + rid) : String(n);
}

/* The snake, the client's ptDraftTurn verbatim: pick n (0-based) among C
   captains → the ORDER INDEX of the captain. Forward on even rounds, reversed
   on odd. Four lines of wire format, not a second engine. */
function dTurn(n, C) {
  var r = Math.floor(n / C), i = n % C;
  return (r % 2 === 0) ? i : (C - 1 - i);
}

function draftCard(rec) {
  var order = rec.order || [];
  var picks = rec.picks || [];
  var C = order.length;
  if (!C) return '';                                  // buckets picked, order not set — nothing to watch yet
  var total = C * 3;                                  // every captain calls a Second, a Third and an Anchor
  var done = !!rec.done || picks.length >= total;

  var seats = {};
  order.forEach(function (c) { seats[String(c)] = { captain: c }; });
  picks.forEach(function (p) { var t = p && seats[String(p.c)]; if (t) t[p.b] = p.rid; });

  var onClock = null, needs = [];
  if (!done) {
    onClock = order[dTurn(picks.length, C)];
    var has = {};
    picks.forEach(function (p) { if (p && String(p.c) === String(onClock)) has[p.b] = 1; });
    needs = ['second', 'third', 'anchor'].filter(function (b) { return !has[b]; });
  }

  /* FR-131 — tell the page it is showing the draft board; the CSS above does
     the rest, and only above 1200 px. Harmless if the element is not there.
     ⭐⭐ B-216 (v1.3, s252) — HIS RULING: "wide only while the draft is
     running, leaderboard back to reading width once it's Final."
     v1.2 called .add() unconditionally, so the Final teams card — which
     renders BELOW the leaderboard for the rest of the event — left the whole
     page at 1700 px on every computer for the whole of scoring day. That
     contradicted FR-131's own comment two screens up. It is now a TOGGLE on
     `done`, so the class comes OFF the moment the draft is Final, on the very
     next 30-second repaint, with nobody touching anything.
     ⛔ Phones are still untouched: the CSS is behind min-width:1200px. */
  try { var _w = document.querySelector('.wrap'); if (_w) _w.classList.toggle('wideDraft', !done); } catch (e) {}

  var h = '<div class="card' + (done ? ' done' : '') + '">'
    + '<div class="dHd"><div class="dTitle">Draft Night</div>'
    + '<span class="chip' + (done ? '' : ' live') + '">' + (done ? 'Final' : 'On the clock') + '</span></div>';

  if (done) {
    h += '<div class="dProg" style="margin-top:8px">' + C + ' team' + (C === 1 ? '' : 's')
      + (rec.at ? ' &middot; drafted ' + esc(String(rec.at).slice(0, 10)) : '') + '</div>';
  } else {
    h += '<div class="dClock">'
      + '<div class="dClockTop">Pick ' + (picks.length + 1) + ' of ' + total
      + ' &middot; Round ' + (Math.floor(picks.length / C) + 1) + ' of 3</div>'
      + '<div class="dClockName">' + esc(dName(rec, onClock)) + ' is on the clock</div>'
      + '<div class="dClockNeeds">Still needs '
      + needs.map(function (b) { return DNEED[b]; }).join(', ').replace(/, ([^,]*)$/, ' or $1')
      + '</div></div>'
      + '<div class="dProg">' + picks.length + ' of ' + total + ' picked</div>'
      + '<div class="dBar"><i style="width:' + Math.round(picks.length / total * 100) + '%"></i></div>';
  }

  h += '<div class="teams">';
  order.forEach(function (c, i) {
    var t = seats[String(c)] || {};
    h += '<div class="team' + (!done && String(c) === String(onClock) ? ' onclock' : '') + '">'
      + '<div class="teamNm"><span class="ord">' + (i + 1) + '</span>Team ' + esc(dName(rec, c)) + '</div>';
    DBK.forEach(function (b) {
      var rid = t[b[0]];
      h += '<div class="slot"><div class="slotK">' + b[1] + '</div>'
        + '<div class="slotV' + (rid == null ? ' empty' : '') + '">'
        + (rid == null ? '&mdash;' : esc(dName(rec, rid))) + '</div></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  /* His ruling 2: the men still on the board, BY NAME. Gone once it is Final —
     there is nobody left to name. */
  if (!done) {
    var taken = {};
    picks.forEach(function (p) { if (p) taken[String(p.rid)] = 1; });
    var bk = rec.buckets || {};
    var left = 0, body = '';
    [['second', 'Seconds'], ['third', 'Thirds'], ['anchor', 'Anchors']].forEach(function (b) {
      var men = (bk[b[0]] || []).filter(function (rid) { return !taken[String(rid)]; });
      if (!men.length) return;
      left += men.length;
      body += '<div class="poolGrp"><div class="poolK">' + b[1] + ' &middot; ' + men.length + ' left</div>'
        + '<div class="poolNames">'
        + men.map(function (rid) { return esc(dName(rec, rid)); }).join(' &middot; ')
        + '</div></div>';
    });
    if (left) h += '<div class="pool"><div class="poolHd">Still on the board &mdash; ' + left + ' left</div>' + body + '</div>';
  }

  return h + '</div>';
}

/* ══ FR-134 — THE TICKER (v1.4, s255) ═══════════════════════════
   Bruce, s255: "yes want a ticker" — leaders, birdies, eagles, blow-ups, the
   same notes the client's TV crawl runs. Wanted for the big screen on Sept 26.

   ⭐⭐ WHY THIS IS NOT B-192's ENGINE, AND WHY THAT IS NOT DRIFT.
   B-192's rule is FOUR CONTEXTS, ONE ENGINE — never a fifth renderer — and it
   governs the LEAGUE ticker inside the 9 MB client, which is built off
   ptBuildMdIndividual's computed state. This file cannot reach that state: it is
   a standalone page by Bruce's own s225 ruling 2, sharing nothing with the app,
   and it already derives its own board (paintBoard) and its own hole card
   (card()) the same way. So this reads the leaderboard payload THIS PAGE HAS
   ALREADY FETCHED. ⛔ No new route, no new poll, no new permission.

   ⛔⛔ NO MONEY, EVER. Ruling 1 stands: this page must never carry a prize
   fund, and a ticker is exactly where one would sneak in. Nothing below reads
   or derives a dollar.
   ⭐ NO PAR TABLE ⇒ NO CLAIM. A course this file does not know produces
   leaders only — a guessed birdie on a guessed par is worse than silence. */
/* ══ v1.16 (s276) — CONTEXT + THE FUNNY LINES ═══════════════════════════════
   Bruce, s276, verbatim: "pards live ticker URL needs to be context aware - you cant
   ticker a round 1 score after 3 rounds - and where are the funny tickers ? they are
   there on the full client app and they are great".

   ⭐ CONTEXT. A round tab on screen narrates THAT round (refresh() already hands
   paintTicker the round it painted). The Overall tab narrates the LATEST round with
   any scores — tickerRoundId() — highest round_number whose cached board has a man
   with holes. A finished earlier round never speaks once a later one has scores.

   ⭐ THE FUNNY LINES are the client's trip/individual moments engine (_T_TMPL /
   _tDetectMoments / _momentSpan, client v655.0 §v266.0/v289.0), ported with the SAME
   templates and the SAME triggers: hole sets are DIFFED between polls, the first poll
   of a round SEEDS SILENTLY (a spectator arriving mid-round is not flooded with old
   birdies), one moment per player+hole+kind, deterministic template pick
   (id*7+hole)%len, and lifetimes by kind — the client counts ~60s polls
   (birdie 5 · eagle 15 · albatross 25 · ace all round); this page polls every 30s,
   so the counts are DOUBLED to keep the same wall-clock life. ⛔ NO PAR TABLE ⇒ NO
   CLAIM (same rule as tickerNotes). ⛔ Nothing here reads or derives a dollar. */
var M_TMPL = {
  birdie: [
    ' a big birdie on the {h} to go to {tp}',
    ' rolls in a birdie at the {h} — {tp} for the day',
    ' birdie on the {h}! now {tp}',
    ' picks one up at the {h} — {tp}'
  ],
  eagle: [
    ' just eagled the {h} — {tp} for the day!',
    ' 🦅 EAGLE on the {h}! {tp}',
    ' makes eagle at the {h} — {tp}!'
  ],
  albatross: [' ALBATROSS on the {h}!! {tp} — someone frame that scorecard'],
  ace: [' 🎯 ACE on the {h}!! A hole-in-one!', ' HOLE-IN-ONE at the {h}!!']
};
var MOMENT_LIFE = { birdie: 10, eagle: 30, albatross: 50, ace: Infinity };   /* client 5/15/25/∞ at 60s → ×2 at 30s */
var _mm = { key: null, prev: null, list: [], seen: {}, cycle: 0 };
function mOrd(n) {
  var v = n % 100, sfx = (v >= 11 && v <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'})[n % 10] || 'th';
  return n + sfx;
}
function mFmtTp(n) { return n === null ? '—' : (n === 0 ? 'E' : (n < 0 ? '−' + Math.abs(n) : '+' + n)); }   /* the client's _fmtToPar, U+2212 minus */
function mRowKey(r) { return String(r.entry_key || ('n:' + String(r.name || '').trim().toLowerCase())); }
function mRowNum(r) {
  var pid = (r.data || {}).player_id;
  if (pid != null && isFinite(Number(pid))) return Number(pid);
  var s = mRowKey(r), h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100003;
  return h;
}
/* The client's _momentSpan: louder the rarer — an ace screams, eagles glow. */
function mSpan(m) {
  var pre = m.kind === 'ace' ? '🚨🏌️ ' : (m.kind === 'eagle' || m.kind === 'albatross') ? '🦅 ' : '🔥 ';
  var stl = m.kind === 'ace'
    ? 'color:#ffd700;font-weight:900;text-shadow:0 0 8px rgba(255,215,0,.55);'
    : (m.kind === 'eagle' || m.kind === 'albatross')
      ? 'color:#ffe08a;font-weight:800;text-shadow:0 0 6px rgba(255,200,80,.35);'
      : 'color:#f5d97a;';
  return '<span style="' + stl + '">' + pre + m.text + '</span>';
}
/* Highest round_number whose cached board has anyone with holes; null when nobody has scored. */
function tickerRoundId() {
  var best = null, bestN = -1;
  (S.rounds || []).forEach(function (r) {
    var lb = S.lb[r.id]; if (!lb) return;
    var any = (lb.standings || []).some(function (x) { return (x.holes_played || 0) > 0; });
    if (any && Number(r.round_number || 0) > bestN) { bestN = Number(r.round_number || 0); best = r.id; }
  });
  return best;
}
/* Diff this poll's hole sets against the last one for the SAME round; returns
   { html:[...crawl items...], cover:{ rowKey:hole → 1 } } — cover lets tickerNotes
   stand down its plain EAGLE/ALBATROSS line while the funny one is riding. */
function tickerMoments(d) {
  var rows = (d && d.standings) || [];
  var rid = d && d.round ? d.round.id : null;
  var out = { html: [], cover: {} };
  if (rid == null) { _mm = { key: null, prev: null, list: [], seen: {}, cycle: 0 }; return out; }
  var cur = {}, i;
  for (i = 0; i < rows.length; i++) cur[mRowKey(rows[i])] = ((rows[i].data || {}).scores_by_hole) || {};
  if (_mm.key !== rid) { _mm = { key: rid, prev: cur, list: [], seen: {}, cycle: 0 }; return out; }
  _mm.cycle++;
  for (i = 0; i < rows.length; i++) {
    var r = rows[i], dd = r.data || {}, by = dd.scores_by_hole || {};
    var pars = (dd.course_id && PARS[dd.course_id]) ? PARS[dd.course_id] : null;
    if (!pars) continue;
    var k = mRowKey(r), prev = (_mm.prev && _mm.prev[k]) || {};
    var tp = toPar(r);
    Object.keys(by).forEach(function (hk) {
      var h = Number(hk);
      if (!(h >= 1 && h <= 18)) return;
      if (prev[h] != null || prev[String(h)] != null) return;
      var gross = Number(by[hk]); if (!(gross > 0)) return;
      var df = gross - pars[h - 1];
      var kind = gross === 1 ? 'ace' : (df <= -3 ? 'albatross' : df === -2 ? 'eagle' : df === -1 ? 'birdie' : null);
      if (!kind) return;
      var mk = k + ':' + h + ':' + kind;
      if (_mm.seen[mk]) return;
      _mm.seen[mk] = 1;
      var tl = M_TMPL[kind];
      var txt = tl[(mRowNum(r) * 7 + h) % tl.length].replace('{h}', mOrd(h)).replace('{tp}', mFmtTp(tp == null ? null : tp));
      _mm.list.push({ key: mk, row: k, hole: h, kind: kind, text: esc(r.name) + esc(txt), cycle: _mm.cycle });
    });
  }
  _mm.prev = cur;
  var keep = [];
  for (i = 0; i < _mm.list.length; i++)
    if (_mm.cycle - _mm.list[i].cycle < (MOMENT_LIFE[_mm.list[i].kind] || 10)) keep.push(_mm.list[i]);
  _mm.list = keep;
  for (i = 0; i < keep.length; i++) { out.html.push(mSpan(keep[i])); out.cover[keep[i].row + ':' + keep[i].hole] = 1; }
  return out;
}

function tickerNotes(d, cover) {
  var rows = (d && d.standings) || [];
  if (!rows.length) return [];
  var notes = [];

  /* ⭐⭐⭐ B-241 (v1.20, s280) — THE STRIP'S "LEADING" IS THE OVERALL BOARD'S LEAD.
     Bruce, off the live board: "This is not accurate. It should be overall
     leader. Thats curt." He was right. This note used to read d.standings — the
     ROUND leaderboard — rows 0..2, printing r[scoreKey(format)], which on a low
     gross round is the RUNNING GROSS of an unfinished round. That is why it said
     "Gavin Braithwaite 17 · Mark Curley 20": those are strokes so far, so the man
     who has played the FEWEST HOLES sorted first, directly under a board whose
     right column says OVERALL TO PAR and whose top line is Curt at -1.
     Same fault as B-238 on the TV: a second producer contradicting the board.
     ⛔ ONE PRODUCER — overallSections() + rankFlight(), the exact pair the Overall
     tab paints with. No sort of its own, no mutation (trap 9).
     ⛔ s272 — RANKING HAPPENS INSIDE A FLIGHT. Reads the FIRST section only (the
     organizer's first bracket, the one the board leads with) and names it when
     there is more than one. It never ranks a man against another flight.
     ⛔ trap 207 — BAND 0 ONLY. rankFlight bands a man with fewer rounds below the
     field; he is not leading and is never promoted into this note.
     ⛔ No overall payload yet → NO NOTE AT ALL. Silence beats a false leader. */
  var _oLead = [], _oSec = null;
  if (S.overall && S.overall.players && S.overall.players.length) {
    var _oSecs = overallSections(S.overall);
    if (_oSecs.length) {
      _oSec = _oSecs.length > 1 ? _oSecs[0].name : null;
      _oLead = rankFlight(_oSecs[0].players)
        .filter(function (x) { return x.band === 0 && x.p && x.p.total_topar != null; })
        .slice(0, 3)
        .map(function (x) { return { name: x.p.name, v: fmtTp(x.p.total_topar) }; });
    }
  }
  if (_oLead.length) {
    notes.push('LEADING' + (_oSec ? ' &middot; ' + esc(String(_oSec).toUpperCase()) : '') + ' &middot; '
      + _oLead.map(function (r, i) {
          return (i + 1) + '. <b>' + esc(r.name) + '</b> ' + esc(r.v);
        }).join('&nbsp; &nbsp;'));
  }

  var eagles = [], birds = {}, blows = [];
  rows.forEach(function (r) {
    var dd = r.data || {};
    var by = dd.scores_by_hole || {};
    var pars = (dd.course_id && PARS[dd.course_id]) ? PARS[dd.course_id] : null;
    if (!pars) return;
    for (var hl = 1; hl <= 18; hl++) {
      var v = by[hl] != null ? by[hl] : by[String(hl)];
      if (v == null) continue;
      var diff = Number(v) - pars[hl - 1];
      var covered = cover && cover[mRowKey(r) + ':' + hl];   /* v1.16 — the funny line is already saying it */
      if (diff <= -3) { if (!covered) eagles.push('ALBATROSS &middot; <b>' + esc(r.name) + '</b> on ' + hl); }
      else if (diff === -2) { if (!covered) eagles.push('EAGLE &middot; <b>' + esc(r.name) + '</b> on ' + hl); }
      else if (diff === -1) { birds[r.name] = (birds[r.name] || 0) + 1; }
      else if (diff >= 3) { blows.push('<b>' + esc(r.name) + '</b> took a ' + esc(String(v)) + ' on ' + hl); }
    }
  });

  eagles.forEach(function (tx) { notes.push(tx); });

  var bn = Object.keys(birds).sort(function (a, b) { return birds[b] - birds[a]; }).slice(0, 5);
  if (bn.length) {
    notes.push('BIRDIES &middot; ' + bn.map(function (n) {
      return '<b>' + esc(n) + '</b> ' + birds[n];
    }).join('&nbsp; &nbsp;'));
  }

  /* Triple or worse. A double is a Tuesday; this is the one people shout about. */
  blows.slice(0, 4).forEach(function (tx) { notes.push('BLOW-UP &middot; ' + tx); });

  return notes;
}

/* ══ FR-153 — THE HOLE MESSAGES ON THE CRAWL (v1.5, s267) ═══════
   Bruce, s267, orange pen on the four sponsor cards: "I thought these hole
   things were suppose to be on a ticker?" They never were. The cards are
   holeMsgs(); the crawl is tickerNotes(); the two had never met.

   ⭐⭐ ONE SOURCE, SO THEY CANNOT DRIFT. This reads the SAME block holeMsgs()
   reads — S.cfg.hole_msgs.rounds[round_number] — so a config change moves the
   card and the crawl together. ⛔ No new route, no new poll, no new key: the
   six-key display whitelist already carries hole_msgs.

   ⭐⭐⭐ RULING 2, same session: "the hole tickers should not appear until the
   scorers reach that hole the first time - in theory - if that is not possible
   per scorecard - that is fine." It is not possible per scorecard and he said
   that is fine, so REACHED IS THE WHOLE FIELD, NOT ONE PLAYER: a hole is live
   on the crawl the moment ANY player in the round has a posted score on it.
   ⭐ Reading scores_by_hole rather than `thru` is deliberate — a shotgun group
   that opens on 10 has genuinely reached 10, and a thru-count would say 1.
   ⛔ THE ALERTS ARE NOT GATED. They belong to the whole round, carry no hole,
   and are the only thing on the band before the first putt drops.
   ✅ THE CARDS ARE GATED TOO, since v1.6 — both read reachedHoles(d) — he ruled the ticker, not the cards, and
   a spectator scrolling the page should still be able to read hole 14.

   ⛔⛔ NO MONEY, EVER — ruling 1 stands. These are Bruce's own config lines and
   nothing below reads or derives a dollar. */
function tickerHoleNotes(d) {
  var round = d && d.round;
  var hm = S.cfg && S.cfg.hole_msgs && S.cfg.hole_msgs.rounds ? S.cfg.hole_msgs.rounds : null;
  if (!hm || !round) return [];
  var blk = hm[round.round_number] || hm[String(round.round_number)] || null;
  if (!blk) return [];
  var notes = [];
  /* Alerts ride the whole round and carry no hole label — same rule as the card. */
  (blk.alerts || []).forEach(function (a) {
    if (!a || !a.text) return;
    notes.push('<b>' + esc(a.text) + '</b>');
  });
  var reached = reachedHoles(d);
  var holes = blk.holes || {};
  Object.keys(holes).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (k) {
    var m = holes[k];
    if (!m || !m.text) return;
    if (!reached[String(Number(k))]) return;   /* nobody is there yet — stay quiet */
    /* Gold label, white body — .tickRun is gold and .tickRun b is --txt, which
       is the same read as the card's gold .msgHole over white text. */
    notes.push('HOLE ' + esc(k) + ' &middot; <b>' + esc(m.text) + '</b>');
  });
  return notes;
}

var _tickLast = null;
function paintTicker(d) {
  var host = gid('tickHost');
  if (!host) return;
  /* FR-153 — scoring first because it moves; then the round alert, then the
     paid hole lines the field has actually reached (ruling 2). */
  var mo = tickerMoments(d);   /* v1.16 — the client's moments ride FIRST, exactly as the client orders them */
  var notes = mo.html.concat(tickerNotes(d, mo.cover)).concat(tickerHoleNotes(d));
  var joined = notes.join('&nbsp; &nbsp;&bull;&nbsp; &nbsp;');
  /* ⭐⭐ A 30-second repaint must NOT restart the crawl. Only rebuild when the
     text actually changed — otherwise the big screen jumps back to the start
     twice a minute all afternoon. */
  if (joined === _tickLast) return;
  _tickLast = joined;
  if (!notes.length) { host.innerHTML = ''; return; }
  var run = '<span class="tickRun">' + joined + '&nbsp; &nbsp;&bull;&nbsp; &nbsp;</span>';
  host.innerHTML = '<div class="tick"><div class="tickIn" id="tickIn">' + run + run + '</div></div>';
  /* Duration from length: roughly a readable pace at any size of night. */
  /* ⭐ v1.14 (s274) — the CLIENT'S calibration, lifted from _calibrate() in
     client v655.0: normalise to ~42px/s off the measured track width, clamped
     14..90s. ⛔ A width of 0 means "not laid out yet" — refuse to guess and fall
     back to the old character estimate rather than pinning the crawl at its
     fastest, which is the v315.0 lesson. */
  var el = gid('tickIn');
  if (el) {
    var w = 0; try { w = el.scrollWidth / 2; } catch (_w) { w = 0; }
    var secs = w ? Math.min(90, Math.max(14, w / 42))
                 : Math.max(18, Math.min(180, Math.round(joined.replace(/<[^>]*>/g, '').length / 5)));
    el.style.animationDuration = secs + 's';
  }
}

/* ── TRIP FLAVOUR ────────────────────────────────────────────── */
/* The trip door already existed and needed nothing built: the trip
   leaderboard route takes viewer_pin (or the trip code) and its payload was
   measured clean at s243 — points, gross, net, handicaps, nothing else. */
/* v1.27 (s304) — Bruce: "why cant I see their individual scorecards ?" Each round
   breakdown adapts into the SAME card() producer the event board uses (s289 — one
   notation, one producer): hole grid coloured off the round's own tee pars, OUT/IN/
   Gross Total (s268 rules live inside card()), then the tee / playing hcp / gross /
   net / points meta line. A round with nothing posted keeps the standing sentence. */
function tripCards(st) {
  var out = '', n = 0;
  (st.rounds || []).forEach(function (rb) {
    if (!rb || !rb.holes) return;
    var thru = rb.holes >= 18 ? 'Final' : ('Thru ' + rb.holes);
    out += '<div class="cardR' + (n === 0 ? ' first' : '') + '">'
      + '<div class="cardRH"><div>' + esc(rb.course_name || ('Round ' + (rb.round_number || 1))) + '</div><span>' + thru + '</span></div>'
      + card({ data: { scores_by_hole: rb.hole_scores || {}, pars: rb.pars || null, tee: rb.tee_name || null, playing_handicap: rb.playing_handicap },
               gross: rb.gross, net: rb.net, points: rb.pts })
      + '</div>';
    n++;
  });
  if (!n) return '<div class="detMeta">No holes posted yet.</div>';
  return out;
}

/* v1.26 (FR-286, s304) — Bruce, watching the Barnes: "I just want to see gross net and
   Par Point scores - that is it." Gross and Net join Pts — the payload has carried
   total_gross/total_net since v2.65.0, and Pts IS the par-point scale (2 + par − net,
   floored at 0), so this is a render-only change. `cred` rides as BOTH pin and code: a
   viewer PIN matches pinOk, a trip code matches codeOk (v2.35.0) — old ?trip=&pin=
   links are untouched. s268: a player with nothing posted shows dashes, never 0. */
function loadTrip(tripId, cred, lgCtx) {
  return jget(API + '/api/trips/' + tripId + '/leaderboard?pin=' + encodeURIComponent(cred) + '&code=' + encodeURIComponent(cred))
    .then(function (d) {
      S.trip = d.trip || {};
      paintTicker(null);   /* FR-134 — the trip board has no hole detail to read */
      gid('hdr').innerHTML = lgCtx
        ? '<div class="evName">' + esc(lgCtx.league) + '</div>'
          + '<div class="evMeta">' + esc(S.trip.name || lgCtx.week || '') + ' &nbsp;<span class="chip live">Live</span></div>'
        : '<div class="evName">' + esc(S.trip.name || 'Trip') + '</div>'
          + '<div class="evMeta">' + esc(S.trip.destination || '') + '</div>';
      var rows = d.standings || [];
      var h = '<div class="card"><div class="rowsHd lg ch"><div style="text-align:center">#</div><div>Player</div><div style="text-align:right">Thru</div><div style="text-align:right">Gross</div><div style="text-align:right">Net</div><div style="text-align:right">Pts</div><div></div></div>';
      rows.forEach(function (r, i) {
        var holes = (r.rounds || []).reduce(function (a, x) { return a + (x.holes || 0); }, 0);
        var id = 'tl' + (r.trip_player_id != null ? r.trip_player_id : i);   /* v1.27 — keyed to the MAN, so an open card survives a re-rank (FR-188) */
        h += '<div class="row lg ch" onclick="tog(\'' + id + '\')"><div class="pos">' + (i + 1) + '</div>'
          + '<div class="nm">' + esc(r.name) + '</div>'
          + '<div class="thru">' + holes + '</div>'
          + '<div class="sc">' + (holes ? r.total_gross : '&ndash;') + '</div>'
          + '<div class="sc">' + (holes ? r.total_net : '&ndash;') + '</div>'
          + '<div class="sc">' + (holes ? r.total_pts : '&ndash;') + '</div>'
          + chev(id)
          + '</div>'
          + '<div class="det" id="' + id + '">' + tripCards(r) + '</div>';
      });
      if (!rows.length) h += '<div class="note">No scores posted yet.</div>';
      gid('app').innerHTML = h + '</div>';
      Object.keys(S.open).forEach(function (k) { var el = gid(k); if (el && S.open[k]) el.className = 'det on';
        var c = gid('cv' + k); if (c && S.open[k]) c.className = 'chev up'; });   /* v1.27 — the 30s poll must not slam an open card shut (FR-188) */
    });
}

/* v1.26 (FR-286) — THE DOOR CASCADE, the client Watch's own walk (v2.36.0):
   event → trip → league, falling through on 404 ONLY (the v243.1 lesson).
   A league watch code (481027 = Barnes Tuesdays) resolves the season's LATEST
   week and watches that night's trip via the week's own trip_code — so the one
   code works every Tuesday without changing. All three reads are existing
   public worker routes; nothing was widened server-side. */
function _is404(e) { return /404|not found/i.test((e && e.message) || ''); }
function loadByCode(code) {
  S.watchTrip = null;
  return loadEvent(code).catch(function (e0) {
    if (!_is404(e0)) throw e0;
    return jget(API + '/api/trips/watch/' + encodeURIComponent(code)).then(function (tw) {
      S.watchTrip = { id: tw.trip_id, cred: tw.trip_code, ctx: null };
      return loadTrip(tw.trip_id, tw.trip_code, null).then(function () {
        if (S.trip && S.trip.name) recentPut(code, S.trip.name);   /* FR-154 — saved only once it answered */
      });
    }, function (e1) {
      if (!_is404(e1)) throw e1;
      return jget(API + '/api/leagues/watch/' + encodeURIComponent(code)).then(function (lw) {
        return jget(API + '/api/leagues/' + lw.league_id + '/season?code=' + encodeURIComponent(code));
      }, function (e2) { throw _is404(e2) ? e0 : e2; }).then(function (sz) {
        var wks = (sz && sz.weeks) || [];
        var wk = wks[wks.length - 1];
        if (!wk || !wk.trip_id || !wk.trip_code) throw new Error('This league has no game days yet.');
        var ctx = { league: (sz.league && sz.league.name) || 'League', week: wk.trip_name || wk.date || '' };
        S.watchTrip = { id: wk.trip_id, cred: wk.trip_code, ctx: ctx };
        return loadTrip(wk.trip_id, wk.trip_code, ctx).then(function () {
          recentPut(code, ctx.league);   /* FR-154 — the chip re-enters through the same door */
        });
      });
    });
  });
}

/* ── PLUMBING ────────────────────────────────────────────────── */
window.tog = function (id) {
  var el = gid(id); if (!el) return;
  var on = el.className.indexOf('on') < 0;
  el.className = on ? 'det on' : 'det';
  var c = gid('cv' + id); if (c) c.className = on ? 'chev up' : 'chev';   /* v1.14 (s274) */
  S.open[id] = on;
};
window.pickRound = function (id) { S.roundId = id; S.view = 'round'; S.open = {}; refresh(); };
window.pickOverall = function () { S.view = 'overall'; S.open = {}; refresh(); };
window.pickWire = function () { S.view = 'wire'; S.open = {}; refresh(); };   /* FR-330b (v1.28) */
/* FR-188 (v1.23, s288) — repaint off the CACHED board, no fetch: the pick is a
   view of numbers already on the page, and a 30-second poll must not gate a tap.
   ⭐ S.open is deliberately NOT cleared — row ids are the row's ORIGINAL index, so
   an open scorecard stays open and stays on the same man through a re-rank.
   ⛔ Fails open: a cold cache just takes the normal refresh path. */
window.pickScore = function (k) {
  S.sk = k;
  var d = S.lb[S.roundId];
  if (d) { try { paintBoard(d); return; } catch (e) {} }
  refresh();
};   /* FR-158 (v1.13, s274) */

function boot() {
  var q = new URLSearchParams(location.search);
  var code = (q.get('code') || q.get('c') || '').trim();
  var trip = (q.get('trip') || '').trim();
  var pin  = (q.get('pin') || '').trim();
  gid('foot').textContent = 'Pards Live · ' + LIVE_VERSION.replace('live-', '');
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  gid('exitBtn').hidden = !(code || (trip && pin));   /* B-233 (v1.15) */

  if (trip && pin) {
    loadTrip(trip, pin).catch(function (e) {
      gid('app').innerHTML = '<div class="err">' + esc(e.message || 'Could not open that trip') + '</div>';
    });
    S.timer = setInterval(function () { loadTrip(trip, pin).catch(function () {}); }, 30000);
    return;
  }
  if (!code) { askCode(''); return; }
  gid('app').innerHTML = '<div class="note" style="margin-top:30px">Loading&hellip;</div>';
  loadByCode(code).then(function () {   /* v1.26 (FR-286) — the cascade; the poll follows the flavour it landed on */
    S.timer = setInterval(function () {
      if (S.watchTrip) loadTrip(S.watchTrip.id, S.watchTrip.cred, S.watchTrip.ctx).catch(function () {});
      else refresh();
    }, 30000);
  }).catch(function (e) {
    askCode(e && /404|not found/i.test(e.message || '') ? 'No event, trip, or league with that code.' : (e.message || 'Could not load'));
  });
}
/* B-233 (v1.15, s276) — EXIT. Stops the poll, forgets the active code (⛔ the FR-154
   recent list is KEPT, so the event comes back as a chip), strips ?code= / ?trip= from the
   URL so a reload lands on the door, and reopens the door with focus in the input.
   ⛔ No native dialogs. */
/* ⛔⛔⛔ s288 — B-256's "← Pards Tour" button was REMOVED here, by his ruling.
   It gated on _b256CameFromTour(), which fell back to `history.length > 1` and so
   fired for practically every visitor — including spectators who opened the board
   from a text message and have no app behind them. ⛔ DO NOT RE-ADD.
   ⭐ The client still appends `&from=tour` when it opens this page. That parameter is
   now INERT — harmless, read by nothing. It comes out of the client on its next build
   rather than costing a 9.6 MB push on its own. */
gid('exitBtn').onclick = function () {
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  S.ev = null; S.cfg = null; S.code = null; S.trip = null; S.roundId = null; S.rounds = []; S.watchTrip = null;   /* v1.26 */
  S.open = {}; S.overall = null; S.view = 'round'; S.lb = {}; S.sheet = null; S.field = null; S._fr166Kick = 0;
  _tickLast = null; var th = gid('tickHost'); if (th) th.innerHTML = '';
  _mm = { key: null, prev: null, list: [], seen: {}, cycle: 0 };   /* v1.16 */
  try { history.replaceState(null, '', location.pathname); } catch (_) {}
  askCode('');
};
boot();
</script>
