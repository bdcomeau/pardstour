<!DOCTYPE html>
<html lang="en">
<!-- pards-live-v1.4 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pards Live</title>
<style>
:root { --gold:#c9a84c; --bg:#0b0d10; --card:#14181d; --line:rgba(201,168,76,.16); --txt:#e9edf2; --dim:rgba(233,237,242,.45); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
body { padding:0 0 40px; }
.wrap { max-width:820px; margin:0 auto; padding:0 12px; }
.top { position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#0b0d10 72%,rgba(11,13,16,0));
  padding:14px 0 10px; }
.brand { font-size:11px; letter-spacing:2.4px; text-transform:uppercase; color:var(--gold); font-weight:800; }
.evName { font-size:19px; font-weight:800; margin-top:3px; line-height:1.25; }
.evMeta { font-size:12px; color:var(--dim); margin-top:3px; }
.chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800;
  text-transform:uppercase; letter-spacing:.6px; border:1px solid var(--line); color:var(--gold); }
.chip.live { color:#7bd88f; border-color:rgba(123,216,143,.4); background:rgba(123,216,143,.08); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; }
.rowsHd,.row { display:grid; grid-template-columns:30px 1fr 46px 56px; gap:8px; align-items:center; }
.rowsHd { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
  padding:0 2px 7px; border-bottom:1px solid var(--line); font-weight:700; }
.row { padding:9px 2px; border-bottom:1px solid rgba(255,255,255,.05); cursor:pointer; }
.row:last-child { border-bottom:0; }
.pos { font-size:12px; color:var(--dim); font-weight:700; text-align:center; }
.nm { font-size:14px; font-weight:650; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.thru { font-size:11.5px; color:var(--dim); text-align:right; }
.sc { font-size:16px; font-weight:800; text-align:right; color:var(--gold); }
.grid { display:grid; grid-template-columns:repeat(9,1fr); gap:3px; margin-top:8px; }
.cellHd { font-size:9px; color:var(--dim); text-align:center; padding-bottom:2px; }
.cell { text-align:center; font-size:12.5px; font-weight:700; padding:5px 0; border-radius:5px;
  background:rgba(255,255,255,.04); }
.eag { background:rgba(255,205,60,.24); color:#ffd83c; }
.bird { background:rgba(123,216,143,.2); color:#7bd88f; }
.bog { background:rgba(255,255,255,.06); color:rgba(255,255,255,.55); }
.dbl { background:rgba(255,110,110,.16); color:#ff8f8f; }
.det { display:none; padding:4px 2px 12px; border-bottom:1px solid rgba(255,255,255,.05); }
.det.on { display:block; }
.detMeta { font-size:11px; color:var(--dim); margin-top:7px; }
.msg { border-radius:10px; padding:9px 11px; margin-top:8px; font-size:12.5px; line-height:1.45;
  border:1px solid var(--line); background:rgba(201,168,76,.06); }
.msg.danger { border-color:rgba(255,110,110,.35); background:rgba(255,110,110,.08); color:#ffb3b3; }
.msg.sponsor { border-color:rgba(123,216,143,.3); background:rgba(123,216,143,.07); }
.msgHole { font-size:9.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--gold);
  font-weight:800; margin-bottom:3px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.tab { padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:transparent;
  color:var(--dim); font-size:11.5px; font-weight:700; cursor:pointer; }
.tab.on { background:rgba(201,168,76,.14); color:var(--gold); border-color:rgba(201,168,76,.45); }
input { width:100%; padding:13px; font-size:17px; text-align:center; letter-spacing:5px; border-radius:10px;
  border:1px solid var(--line); background:#0f1216; color:var(--txt); font-weight:700; }
button.go { width:100%; margin-top:9px; padding:13px; font-size:14px; font-weight:800; border-radius:10px;
  border:1px solid rgba(201,168,76,.5); background:rgba(201,168,76,.16); color:var(--gold); cursor:pointer; }
.note { font-size:11.5px; color:var(--dim); margin-top:12px; line-height:1.5; text-align:center; }
.err { color:#ff8f8f; font-size:13px; margin-top:10px; text-align:center; }
.foot { text-align:center; font-size:10px; color:rgba(233,237,242,.25); margin-top:22px; letter-spacing:.5px; }

/* ── FR-126 DRAFT BOARD (v1.1, s249) ── */
.dHd { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.dTitle { font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); font-weight:800; }
.dClock { margin-top:9px; padding:10px 12px; border-radius:10px; border:1px solid rgba(123,216,143,.35);
  background:rgba(123,216,143,.07); }
.dClockTop { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); font-weight:700; }
.dClockName { font-size:17px; font-weight:800; margin-top:2px; }
.dClockNeeds { font-size:11.5px; color:var(--dim); margin-top:3px; }
.dProg { font-size:11px; color:var(--dim); margin-top:9px; }
.dBar { height:4px; border-radius:3px; background:rgba(255,255,255,.07); margin-top:5px; overflow:hidden; }
.dBar i { display:block; height:100%; background:var(--gold); }
.teams { display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:9px; margin-top:11px; }
/* ⭐ FR-131 (v1.2, s251) — HIS ASK: on a COMPUTER SCREEN the draft board used a
   820 px column on a 16:9 monitor and ran 30 teams down ten rows of three.
   The page opens up to 1700 px and the team grid auto-fills, so a wide screen
   gets six or seven columns instead of three. ⛔ PHONES ARE UNTOUCHED — the
   whole change lives behind min-width:1200px, and it is scoped to the DRAFT
   BOARD by the .wideDraft class so the leaderboard keeps its reading width. */
@media (min-width:1200px) {
  .wrap.wideDraft { max-width:1700px; }
  .wrap.wideDraft .teams { grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
}
.team { border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:rgba(255,255,255,.02); }
.team.onclock { border-color:rgba(123,216,143,.45); background:rgba(123,216,143,.05); }
.teamNm { font-size:13px; font-weight:800; }
.teamNm .ord { color:var(--dim); font-weight:700; font-size:11px; margin-right:5px; }
.slot { display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:center; padding:5px 0;
  border-top:1px solid rgba(255,255,255,.05); font-size:12.5px; }
.slot:first-of-type { border-top:0; }
.slotK { font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); font-weight:800; }
.slotV { font-weight:650; }
.slotV.empty { color:rgba(233,237,242,.25); font-weight:600; font-style:italic; }
.pool { margin-top:12px; }
.poolHd { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); font-weight:800;
  padding-bottom:6px; border-bottom:1px solid var(--line); }
.poolGrp { margin-top:9px; }
.poolK { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--gold); font-weight:800; }
.poolNames { font-size:12.5px; color:rgba(233,237,242,.78); line-height:1.7; margin-top:2px; }
.card.done { border-color:rgba(201,168,76,.4); }

/* ── FR-134 THE TICKER (v1.4, s255) ──────────────────────────────
   Built for the big screen on Sept 26. Two copies of the same run scroll past
   and the loop wraps at -50%, so there is no visible seam and no JS timer —
   the browser owns the animation. ⭐ The duration is set in JS from the length
   of the text, because a fixed duration reads as a crawl on a short night and
   a blur on a busy one. */
.tick { overflow:hidden; white-space:nowrap; margin-top:10px; padding:7px 0;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  background:rgba(201,168,76,.05); }
.tickIn { display:inline-block; animation:tickmove 40s linear infinite; will-change:transform; }
.tickRun { font-size:14px; font-weight:750; letter-spacing:.4px; color:var(--gold); }
.tickRun b { color:var(--txt); font-weight:800; }
@keyframes tickmove { from { transform:translateX(0); } to { transform:translateX(-50%); } }
@media (min-width:1200px) { .tickRun { font-size:20px; } .tick { padding:10px 0; } }
/* ⛔ Somebody watching on a phone with reduced motion gets the notes, standing
   still, rather than nothing. */
@media (prefers-reduced-motion:reduce) {
  .tickIn { animation:none; }
  .tick { white-space:normal; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Pards Live</div>
    <div id="hdr"></div>
  </div>
  <!-- FR-134 (v1.4) — the ticker lives OUTSIDE #app on purpose: paintBoard
       replaces #app wholesale every 30 seconds, and a crawl that restarts twice
       a minute on a big screen is worse than no crawl at all. -->
  <div id="tickHost"></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

/* Lite's _ptJson lesson (trap 110): read text() and parse, so an HTML error
   page from the edge does not throw a bare SyntaxError with no message. */
function jget(url, opts) {
  return fetch(url, opts || {}).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (_) {}
      if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
      return d;

function askCode(errMsg) {
  gid('hdr').innerHTML = '';
  gid('app').innerHTML =
    '<div class="card" style="margin-top:26px">'
    + '<div style="font-size:13px;color:rgba(233,237,242,.7);text-align:center;margin-bottom:11px">'

    + '<input id="cd" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">'
    + '<button class="go" id="goBtn">Watch</button>'
    + (errMsg ? '<div class="err">' + esc(errMsg) + '</div>' : '')
    + '<div class="note">Live scores only &mdash; nothing here can be edited.</div>'
    + '</div>';
  gid('goBtn').onclick = function () {
    var v = (gid('cd').value || '').trim();
    if (v.length < 4) return;
    history.replaceState(null, '', '?code=' + encodeURIComponent(v));
    boot();

  gid('cd').onkeydown = function (e) { if (e.key === 'Enter') gid('goBtn').click(); };
  gid('cd').focus();
}

/* ── EVENT FLAVOUR ───────────────────────────────────────────── */
function loadEvent(code) {
  return jget(API + '/api/events/watch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    // ⭐⭐⭐ public:true — the whole reason worker v3.36.0 exists. Sending it
    // swaps the full event config for a six-key display whitelist. ⛔ Never
    // drop this flag to "get more data": the extra data is exactly what
    // ruling 1 keeps off this page.
    body: JSON.stringify({ event_code: code, public: true })
  }).then(function (d) {
    S.ev = d.event || null;
    S.cfg = null;
    try { S.cfg = d.event && d.event.config ? JSON.parse(d.event.config) : null; } catch (_) {}
    S.roundId = d.round ? d.round.id : null;
    return jget(API + '/api/events/' + S.ev.id + '/rounds').catch(function () { return { rounds: [] }; });
  }).then(function (r) {
    // Draft rounds have nothing to watch — B-82's viewer rule, same reasoning.
    S.rounds = (r.rounds || []).filter(function (x) { return x.status !== 'draft'; });
    if (!S.roundId && S.rounds.length) S.roundId = S.rounds[S.rounds.length - 1].id;
    paintHeader();
    return refresh();
  });
}

function paintHeader() {
  var e = S.ev || {};
  var live = String(e.status || '').toLowerCase() === 'active';
  var bits = [];
  if (e.course_name) bits.push(esc(e.course_name));
  if (e.date) bits.push(esc(e.date));
  var lg = S.cfg && S.cfg.league ? S.cfg.league.name : null;
  gid('hdr').innerHTML =
    '<div class="evName">' + esc(e.name || 'Live') + '</div>'
    + '<div class="evMeta">' + bits.join(' &middot; ')
    + (lg ? ' &middot; ' + esc(lg) : '')
    + ' &nbsp;<span class="chip' + (live ? ' live' : '') + '">' + (live ? 'Live' : esc(e.status || '')) + '</span></div>';
}

function refresh() {
  if (!S.ev || !S.roundId) {
    /* FR-126: draft night can arrive before any round is scoreable. The board
       is worth watching on its own; the old sentence stays when there is none. */
    var _d0 = draftRec();
    paintTicker(null);                                        /* FR-134 — nothing to say yet */
    gid('app').innerHTML = (_d0 ? draftCard(_d0) : '')
      + '<div class="card"><div class="note">No round is open for scoring yet.</div></div>';
    return Promise.resolve();
  }
  return jget(API + '/api/events/' + S.ev.id + '/rounds/' + S.roundId + '/leaderboard')
    .then(function (d) { paintBoard(d); paintTicker(d); })   /* FR-134 */
    .catch(function (e) { gid('app').innerHTML = '<div class="err">' + esc(e.message || 'Could not load') + '</div>'; });
}

/* Which column IS the score depends on the round's format — the same three
   families the worker sorts by. Stableford ranks on points (high wins), the
   low-net and low-gross families on strokes (low wins). */
function scoreKey(fmt) {
  var f = String(fmt || '');
  if (f.indexOf('stableford') >= 0) return 'points';
  if (f.indexOf('low_net') >= 0 || f.indexOf('_net') >= 0) return 'net';
  return 'gross';
}
function scoreLabel(k) { return k === 'points' ? 'Pts' : k === 'net' ? 'Net' : 'Gross'; }

        + '<div class="det" id="' + id + '">' + card(r) + '</div>';
    });
  }
  h += '</div>';
  h += '<div class="note">Updated ' + (rows.length && rows[0].updated_at ? esc(rows[0].updated_at) + ' UTC' : 'just now') + '</div>';
  /* FR-126 ruling 3 — the Final teams card stays, under the leaderboard. */
  if (_dr && _dDone) h += draftCard(_dr);
  gid('app').innerHTML = h;
  Object.keys(S.open).forEach(function (k) { var el = gid(k); if (el && S.open[k]) el.className = 'det on'; });
}

/* The hole-by-hole card. The row's own `data` blob carries scores_by_hole and
   the course id; par comes from the SAME baked table Lite uses, so a course
   Lite knows, this page knows. Unknown course -> plain numbers, no colour, and
   no guessing. */
function card(r) {
  var d = r.data || {};
  var by = d.scores_by_hole || {};
  var pars = (d.course_id && PARS[d.course_id]) ? PARS[d.course_id] : null;
  if (!Object.keys(by).length) return '<div class="detMeta">No holes posted yet.</div>';
  var out = '';
  [[1, 9], [10, 18]].forEach(function (seg) {
    out += '<div class="grid">';
    for (var i = seg[0]; i <= seg[1]; i++) out += '<div class="cellHd">' + i + '</div>';
    out += '</div><div class="grid">';
    for (var j = seg[0]; j <= seg[1]; j++) {
      var v = by[j] != null ? by[j] : by[String(j)];
      var cls = 'cell';
      if (v != null && pars) {
        var diff = v - pars[j - 1];
        cls = diff <= -2 ? 'cell eag' : diff === -1 ? 'cell bird' : diff === 1 ? 'cell bog' : diff >= 2 ? 'cell dbl' : 'cell';
      }
      out += '<div class="' + cls + '">' + (v == null ? '&middot;' : v) + '</div>';
    }
    out += '</div>';
  });
  var meta = [];
  if (d.tee) meta.push('Tee ' + esc(d.tee));
  if (d.playing_handicap != null) meta.push('Playing hcp ' + d.playing_handicap);
  if (r.gross != null) meta.push('Gross ' + r.gross);
  if (r.net != null) meta.push('Net ' + r.net);
  if (r.points != null) meta.push('Points ' + r.points);
  out += '<div class="detMeta">' + meta.join(' &middot; ') + '</div>';
  return out;
}

/* hole_msgs is one of the six whitelisted config keys — the notices, hazards
   and sponsor lines Bruce writes for the players. Alerts ride the round;
   per-hole notes are labelled with their hole. */
function holeMsgs(round) {
  var hm = S.cfg && S.cfg.hole_msgs && S.cfg.hole_msgs.rounds ? S.cfg.hole_msgs.rounds : null;
  if (!hm) return '';
  var blk = hm[round.round_number] || hm[String(round.round_number)] || null;
  if (!blk) return '';
  var out = '';
  (blk.alerts || []).forEach(function (a) {
    if (!a || !a.text) return;
    out += '<div class="msg ' + esc(a.tone || '') + '">' + esc(a.text) + '</div>';
  });
  var holes = blk.holes || {};
  Object.keys(holes).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (k) {
    var m = holes[k];
    if (!m || !m.text) return;
    out += '<div class="msg ' + esc(m.tone || '') + '"><div class="msgHole">Hole ' + esc(k) + '</div>' + esc(m.text) + '</div>';
  });
  return out;
}

/* ══ FR-126 — THE REMOTE DRAFT BOARD (v1.1, s249) ══════════════

   `draft` is the SEVENTH key on the FR-116 allow-list (worker v3.38.0) and the
   only one this file's existence added. The record is written by the client's
   draft module on EVERY pick, so this page needs no new route and no polling
   of its own — the 30-second refresh already running picks it up.

   ⛔ READ-ONLY, like everything else here. ⛔ No money is in the record and
   none is derived from it: it is four bucket lists, a captain order, the picks
   and a roster_id→name map.

   Bruce's s249 rulings, which this code obeys:
     1. While the draft runs, the board sits ABOVE the leaderboard.
     2. The undrafted men are shown BY NAME — "yes of course".
     3. When it is done the Final teams card stays, below the leaderboard.
   ═════════════════════════════════════════════ */
var DBK = [['captain', 'Captain'], ['second', 'Second'], ['third', 'Third'], ['anchor', 'Anchor']];
var DNEED = { second: 'a Second', third: 'a Third', anchor: 'an Anchor' };

/* WHICH record: the watched round's, by id. A one-record event answers even if
   the round tab has moved (a draft night event usually has one round). An event
   carrying several drafts never guesses — it shows nothing rather than the
   wrong night's teams. */
function draftRec() {
  var all = (S.cfg && S.cfg.draft) || null;
  if (!all || typeof all !== 'object') return null;
  var r = all[String(S.roundId)];
  if (r && typeof r === 'object') return r;
  var ks = Object.keys(all);
  return (ks.length === 1 && all[ks[0]] && typeof all[ks[0]] === 'object') ? all[ks[0]] : null;
}

/* A record written before client v605.0 has no names map. Say "Player 412"
   rather than nothing — the board still tells you the shape of the night. */
function dName(rec, rid) {
  var n = (rec.names || {})[String(rid)];
  return (n == null || n === '') ? ('Player ' + rid) : String(n);
}

/* The snake, the client's ptDraftTurn verbatim: pick n (0-based) among C
   captains → the ORDER INDEX of the captain. Forward on even rounds, reversed
   on odd. Four lines of wire format, not a second engine. */
function dTurn(n, C) {
  var r = Math.floor(n / C), i = n % C;
  return (r % 2 === 0) ? i : (C - 1 - i);
}

function draftCard(rec) {
  var order = rec.order || [];
  var picks = rec.picks || [];
  var C = order.length;
  if (!C) return '';                                  // buckets picked, order not set — nothing to watch yet
  var total = C * 3;                                  // every captain calls a Second, a Third and an Anchor
  var done = !!rec.done || picks.length >= total;

  var seats = {};
  order.forEach(function (c) { seats[String(c)] = { captain: c }; });
  picks.forEach(function (p) { var t = p && seats[String(p.c)]; if (t) t[p.b] = p.rid; });

  var onClock = null, needs = [];
  if (!done) {
    onClock = order[dTurn(picks.length, C)];
    var has = {};
    picks.forEach(function (p) { if (p && String(p.c) === String(onClock)) has[p.b] = 1; });
    needs = ['second', 'third', 'anchor'].filter(function (b) { return !has[b]; });
  }

  /* FR-131 — tell the page it is showing the draft board; the CSS above does
     the rest, and only above 1200 px. Harmless if the element is not there.
     ⭐⭐ B-216 (v1.3, s252) — HIS RULING: "wide only while the draft is
     running, leaderboard back to reading width once it's Final."
     v1.2 called .add() unconditionally, so the Final teams card — which
     renders BELOW the leaderboard for the rest of the event — left the whole
     page at 1700 px on every computer for the whole of scoring day. That
     contradicted FR-131's own comment two screens up. It is now a TOGGLE on
     `done`, so the class comes OFF the moment the draft is Final, on the very
     next 30-second repaint, with nobody touching anything.
     ⛔ Phones are still untouched: the CSS is behind min-width:1200px. */
  try { var _w = document.querySelector('.wrap'); if (_w) _w.classList.toggle('wideDraft', !done); } catch (e) {}

  var h = '<div class="card' + (done ? ' done' : '') + '">'
    + '<div class="dHd"><div class="dTitle">Draft Night</div>'
    + '<span class="chip' + (done ? '' : ' live') + '">' + (done ? 'Final' : 'On the clock') + '</span></div>';

  if (done) {
    h += '<div class="dProg" style="margin-top:8px">' + C + ' team' + (C === 1 ? '' : 's')
      + (rec.at ? ' &middot; drafted ' + esc(String(rec.at).slice(0, 10)) : '') + '</div>';
  } else {
    h += '<div class="dClock">'
      + '<div class="dClockTop">Pick ' + (picks.length + 1) + ' of ' + total
      + ' &middot; Round ' + (Math.floor(picks.length / C) + 1) + ' of 3</div>'
      + '<div class="dClockName">' + esc(dName(rec, onClock)) + ' is on the clock</div>'
      + '<div class="dClockNeeds">Still needs '
      + needs.map(function (b) { return DNEED[b]; }).join(', ').replace(/, ([^,]*)$/, ' or $1')
      + '</div></div>'
      + '<div class="dProg">' + picks.length + ' of ' + total + ' picked</div>'
      + '<div class="dBar"><i style="width:' + Math.round(picks.length / total * 100) + '%"></i></div>';
  }

  h += '<div class="teams">';
  order.forEach(function (c, i) {
    var t = seats[String(c)] || {};
    h += '<div class="team' + (!done && String(c) === String(onClock) ? ' onclock' : '') + '">'
      + '<div class="teamNm"><span class="ord">' + (i + 1) + '</span>Team ' + esc(dName(rec, c)) + '</div>';
    DBK.forEach(function (b) {
      var rid = t[b[0]];
      h += '<div class="slot"><div class="slotK">' + b[1] + '</div>'
        + '<div class="slotV' + (rid == null ? ' empty' : '') + '">'
        + (rid == null ? '&mdash;' : esc(dName(rec, rid))) + '</div></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  /* His ruling 2: the men still on the board, BY NAME. Gone once it is Final —
     there is nobody left to name. */
  if (!done) {
    var taken = {};
    picks.forEach(function (p) { if (p) taken[String(p.rid)] = 1; });
    var bk = rec.buckets || {};
    var left = 0, body = '';
    [['second', 'Seconds'], ['third', 'Thirds'], ['anchor', 'Anchors']].forEach(function (b) {
      var men = (bk[b[0]] || []).filter(function (rid) { return !taken[String(rid)]; });
      if (!men.length) return;
      left += men.length;
      body += '<div class="poolGrp"><div class="poolK">' + b[1] + ' &middot; ' + men.length + ' left</div>'
        + '<div class="poolNames">'
        + men.map(function (rid) { return esc(dName(rec, rid)); }).join(' &middot; ')
        + '</div></div>';
    });
    if (left) h += '<div class="pool"><div class="poolHd">Still on the board &mdash; ' + left + ' left</div>' + body + '</div>';
  }

  return h + '</div>';
}

/* ══ FR-134 — THE TICKER (v1.4, s255) ═══════════════════════════
   Bruce, s255: "yes want a ticker" — leaders, birdies, eagles, blow-ups, the
   same notes the client's TV crawl runs. Wanted for the big screen on Sept 26.

   ⭐⭐ WHY THIS IS NOT B-192's ENGINE, AND WHY THAT IS NOT DRIFT.
   B-192's rule is FOUR CONTEXTS, ONE ENGINE — never a fifth renderer — and it
   governs the LEAGUE ticker inside the 9 MB client, which is built off
   ptBuildMdIndividual's computed state. This file cannot reach that state: it is
   a standalone page by Bruce's own s225 ruling 2, sharing nothing with the app,
   and it already derives its own board (paintBoard) and its own hole card
   (card()) the same way. So this reads the leaderboard payload THIS PAGE HAS
   ALREADY FETCHED. ⛔ No new route, no new poll, no new permission.

   ⛔⛔ NO MONEY, EVER. Ruling 1 stands: this page must never carry a prize
   fund, and a ticker is exactly where one would sneak in. Nothing below reads
   or derives a dollar.
   ⭐ NO PAR TABLE ⇒ NO CLAIM. A course this file does not know produces
   leaders only — a guessed birdie on a guessed par is worse than silence. */
function tickerNotes(d) {
  var rows = (d && d.standings) || [];
  if (!rows.length) return [];
  var key = scoreKey((d.round || {}).format);
  var notes = [];

  var lead = rows.slice(0, 3).filter(function (r) { return r[key] != null; });
  if (lead.length) {
    notes.push('LEADING &middot; ' + lead.map(function (r, i) {
      return (i + 1) + '. <b>' + esc(r.name) + '</b> ' + esc(String(r[key]));
    }).join('&nbsp; &nbsp;'));
  }

  var eagles = [], birds = {}, blows = [];
  rows.forEach(function (r) {
    var dd = r.data || {};
    var by = dd.scores_by_hole || {};
    var pars = (dd.course_id && PARS[dd.course_id]) ? PARS[dd.course_id] : null;
    if (!pars) return;
    for (var hl = 1; hl <= 18; hl++) {
      var v = by[hl] != null ? by[hl] : by[String(hl)];
      if (v == null) continue;
      var diff = Number(v) - pars[hl - 1];
      if (diff <= -3) { eagles.push('ALBATROSS &middot; <b>' + esc(r.name) + '</b> on ' + hl); }
      else if (diff === -2) { eagles.push('EAGLE &middot; <b>' + esc(r.name) + '</b> on ' + hl); }
      else if (diff === -1) { birds[r.name] = (birds[r.name] || 0) + 1; }
      else if (diff >= 3) { blows.push('<b>' + esc(r.name) + '</b> took a ' + esc(String(v)) + ' on ' + hl); }
    }
  });

  eagles.forEach(function (tx) { notes.push(tx); });

  var bn = Object.keys(birds).sort(function (a, b) { return birds[b] - birds[a]; }).slice(0, 5);
  if (bn.length) {
    notes.push('BIRDIES &middot; ' + bn.map(function (n) {
      return '<b>' + esc(n) + '</b> ' + birds[n];
    }).join('&nbsp; &nbsp;'));
  }

  /* Triple or worse. A double is a Tuesday; this is the one people shout about. */
  blows.slice(0, 4).forEach(function (tx) { notes.push('BLOW-UP &middot; ' + tx); });

  return notes;
}

var _tickLast = null;
function paintTicker(d) {
  var host = gid('tickHost');
  if (!host) return;
  var notes = tickerNotes(d);
  var joined = notes.join('&nbsp; &nbsp;&bull;&nbsp; &nbsp;');
  /* ⭐⭐ A 30-second repaint must NOT restart the crawl. Only rebuild when the
     text actually changed — otherwise the big screen jumps back to the start
     twice a minute all afternoon. */
  if (joined === _tickLast) return;
  _tickLast = joined;
  if (!notes.length) { host.innerHTML = ''; return; }
  var run = '<span class="tickRun">' + joined + '&nbsp; &nbsp;&bull;&nbsp; &nbsp;</span>';
  host.innerHTML = '<div class="tick"><div class="tickIn" id="tickIn">' + run + run + '</div></div>';
  /* Duration from length: roughly a readable pace at any size of night. */
  var el = gid('tickIn');
  if (el) {
    var chars = joined.replace(/<[^>]*>/g, '').length;
    el.style.animationDuration = Math.max(18, Math.min(180, Math.round(chars / 5))) + 's';
  }
}

/* ── TRIP FLAVOUR ────────────────────────────────────────────── */
/* The trip door already existed and needed nothing built: the trip
   leaderboard route takes viewer_pin (or the trip code) and its payload was
   measured clean at s243 — points, gross, net, handicaps, nothing else. */
function loadTrip(tripId, pin) {
  return jget(API + '/api/trips/' + tripId + '/leaderboard?pin=' + encodeURIComponent(pin))
    .then(function (d) {
      S.trip = d.trip || {};
      paintTicker(null);   /* FR-134 — the trip board has no hole detail to read */
      gid('hdr').innerHTML = '<div class="evName">' + esc(S.trip.name || 'Trip') + '</div>'
        + '<div class="evMeta">' + esc(S.trip.destination || '') + '</div>';
      var rows = d.standings || [];
      var h = '<div class="card"><div class="rowsHd"><div style="text-align:center">#</div><div>Player</div><div style="text-align:right">Thru</div><div style="text-align:right">Pts</div></div>';
      rows.forEach(function (r, i) {
        var holes = (r.rounds || []).reduce(function (a, x) { return a + (x.holes || 0); }, 0);
        h += '<div class="row"><div class="pos">' + (i + 1) + '</div>'
          + '<div class="nm">' + esc(r.name) + '</div>'
          + '<div class="thru">' + holes + '</div>'
          + '<div class="sc">' + (r.total_pts == null ? '&ndash;' : r.total_pts) + '</div></div>';
      });
      if (!rows.length) h += '<div class="note">No scores posted yet.</div>';
      gid('app').innerHTML = h + '</div>';
    });
}

/* ── PLUMBING ────────────────────────────────────────────────── */
window.tog = function (id) {
  var el = gid(id); if (!el) return;
  var on = el.className.indexOf('on') < 0;
  el.className = on ? 'det on' : 'det';
  S.open[id] = on;
};
window.pickRound = function (id) { S.roundId = id; S.open = {}; refresh(); };

function boot() {
  var q = new URLSearchParams(location.search);
  var code = (q.get('code') || q.get('c') || '').trim();
  var trip = (q.get('trip') || '').trim();
  var pin  = (q.get('pin') || '').trim();
  gid('foot').textContent = 'Pards Live · ' + LIVE_VERSION.replace('live-', '');
  if (S.timer) { clearInterval(S.timer); S.timer = null; }

  if (trip && pin) {
    loadTrip(trip, pin).catch(function (e) {
      gid('app').innerHTML = '<div class="err">' + esc(e.message || 'Could not open that trip') + '</div>';
    });
    S.timer = setInterval(function () { loadTrip(trip, pin).catch(function () {}); }, 30000);
    return;
  }
  if (!code) { askCode(''); return; }
  gid('app').innerHTML = '<div class="note" style="margin-top:30px">Loading&hellip;</div>';
  loadEvent(code).then(function () {
    S.timer = setInterval(function () { refresh(); }, 30000);
  }).catch(function (e) {
    askCode(e && /404|not found/i.test(e.message || '') ? 'No event with that code.' : (e.message || 'Could not load'));
  });
}
boot();
</script>
