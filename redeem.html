<!DOCTYPE html>
<!-- pards-redeem-v1.0 — FR-142 s260. One-time invite redemption.
     Standalone page ON PURPOSE: the 9.3 MB client is not touched by FR-142. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pards Tour — Accept your invite</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#2a323d; --ink:#e6edf3; --dim:#8b949e;
    --acc:#2ea043; --acc2:#3fb950; --bad:#f85149; --fld:#0d1117;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 60px;min-height:100vh}
  .wrap{width:100%;max-width:440px}
  .logo{text-align:center;margin-bottom:22px}
  .logo b{font-size:26px;letter-spacing:.5px}
  .logo span{display:block;color:var(--dim);font-size:13px;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:14px;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 5px}
  input{width:100%;padding:11px 12px;background:var(--fld);color:var(--ink);
        border:1px solid var(--line);border-radius:9px;font-size:16px}
  input:focus{outline:none;border-color:var(--acc)}
  #code{text-transform:uppercase;letter-spacing:3px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  button{width:100%;margin-top:20px;padding:13px;background:var(--acc);color:#fff;border:0;
         border-radius:9px;font-size:16px;font-weight:600}
  button:disabled{opacity:.55}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
  .msg{margin-top:16px;padding:11px 13px;border-radius:9px;font-size:14px;display:none}
  .msg.err{display:block;background:rgba(248,81,73,.12);border:1px solid var(--bad);color:#ffb3ae}
  .msg.ok{display:block;background:rgba(46,160,67,.12);border:1px solid var(--acc2);color:#7ee787}
  .done{display:none;text-align:center}
  .done a{display:inline-block;margin-top:16px;color:var(--acc2)}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><b>Pards Tour</b><span>League admin invitation</span></div>

  <div class="card" id="form">
    <h1>Accept your invite</h1>
    <p class="sub">Enter the code you were given, then pick your own name and password. The code works once.</p>

    <label for="code">Invite code</label>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">

    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <div class="hint">Must be the address the invite was issued to.</div>

    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="How your name should appear">

    <label for="pw">Choose a password</label>
    <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">

    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again">

    <button id="go">Create my account</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card done" id="done">
    <h1>You're in.</h1>
    <p class="sub" id="doneMsg"></p>
    <a href="/">Open Pards Tour and sign in →</a>
  </div>

  <div class="foot">Trouble? Ask Bruce for a fresh code.</div>
</div>

<script>
(function(){
  var API = 'https://pards-tour-api.bdapple.workers.dev';
  var $ = function(id){ return document.getElementById(id); };
  var msg = $('msg'), go = $('go');

  // Prefill from ?code= / ?email= so a texted link can carry them.
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('code'))  $('code').value  = q.get('code').toUpperCase();
    if (q.get('email')) $('email').value = q.get('email');
  } catch (e) {}

  function show(kind, text){ msg.className = 'msg ' + kind; msg.textContent = text; }

  $('code').addEventListener('input', function(){ this.value = this.value.toUpperCase(); });

  go.addEventListener('click', async function(){
    var code  = $('code').value.trim().toUpperCase();
    var email = $('email').value.trim();
    var name  = $('name').value.trim();
    var pw    = $('pw').value;
    var pw2   = $('pw2').value;

    if (!code)  return show('err', 'Enter your invite code.');
    if (!email) return show('err', 'Enter your email address.');
    if (!name)  return show('err', 'Enter the name you want to use.');
    if (pw.length < 8) return show('err', 'Your password needs at least 8 characters.');
    if (pw !== pw2)    return show('err', 'The two passwords do not match.');

    go.disabled = true; show('ok', 'Creating your account…');
    try {
      var r = await fetch(API + '/api/auth/redeem-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, email: email, name: name, password: pw })
      });
      var d = await r.json().catch(function(){ return {}; });
      if (!r.ok) { go.disabled = false; return show('err', d.error || 'That did not work. Check the code and email.'); }
      $('form').style.display = 'none';
      $('done').style.display = 'block';
      $('doneMsg').textContent = 'Account created for ' + (d.email || email) + '. Sign in with that address and the password you just chose.';
    } catch (e) {
      go.disabled = false;
      show('err', 'Could not reach the server. Check your connection and try again.');
    }
  });
})();
</script>
</body>
</html>
