/* v1.7 — course weather, Open-Meteo (free, no key; same source as the full
   app's non-Edmonton courses). One fetch on card open + every 30 min.
   Fail-soft: no coords / no network -> the line simply stays hidden. */
var _wxTimer = null;
var WX_EMO = function(c){
  if (c === 0) return '\u2600\uFE0F';
  if (c <= 2) return '\uD83C\uDF24\uFE0F';
  if (c === 3) return '\u2601\uFE0F';
  if (c === 45 || c === 48) return '\uD83C\uDF2B\uFE0F';
  if (c >= 71 && c <= 77) return '\uD83C\uDF28\uFE0F';
  if (c >= 95) return '\u26C8\uFE0F';
  if (c >= 51) return '\uD83C\uDF27\uFE0F';
  return '\uD83C\uDF24\uFE0F';
};
var WX_COMPASS = ['N','NE','E','SE','S','SW','W','NW'];
function wxArm(){
  if (_wxTimer || !S.courseId || !COORDS[S.courseId]) return;
  wxFetch(); _wxTimer = setInterval(wxFetch, 1800000);
}
function wxFetch(){
  var ll = COORDS[S.courseId]; if (!ll) return;
  jfetch('https://api.open-meteo.com/v1/forecast?latitude=' + ll[0] + '&longitude=' + ll[1] +
    '&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code' +
    '&wind_speed_unit=kmh&temperature_unit=celsius&forecast_days=1&timezone=auto')
    .then(function(r){
      var c = r.ok && r.data && r.data.current; if (!c) return;
      var t = c.temperature_2m, w = c.wind_speed_10m, d = c.wind_direction_10m;
      var h = WX_EMO(c.weather_code) + ' <b>' + Math.round(t) + '\u00B0C</b>';
      if (w != null) h += ' &nbsp;\uD83D\uDCA8 ' + Math.round(w) + ' km/h' +
        (d != null ? ' ' + WX_COMPASS[Math.round(d/45)%8] : '');
      var el = $('wx'); el.innerHTML = h; el.style.display = 'block';
    })
    .catch(function(){});
}

/* ---------- par maths (mirrors the client's shotgun-safe _toPar) -------- */
function parArr(cid){ return (cid && PARS[cid]) || null; }
function parOf(h){ var p = parArr(S.courseId); return p ? p[h-1] : null; }
function toPar(entry){
  var p = parArr(entry.course_id || S.courseId);
  if (!p || !entry.scores_by_hole) return null;
  var hs = Object.keys(entry.scores_by_hole); if (!hs.length) return null;
  var sum = 0;
  for (var i=0;i<hs.length;i++){ var h = Number(hs[i]); if (!(h>=1&&h<=18)) return null; sum += p[h-1]; }
  return entry.total - sum;
}
function fmtToPar(n){ return n===null ? '—' : (n===0 ? 'E' : (n<0 ? '−'+Math.abs(n) : '+'+n)); }
/* v1.7 — coloured to-par (green under, red over — the app's convention) */
function fmtToParC(n){ return n===null ? '—' : '<span class="' + (n<0?'tpu':n>0?'tpo':'tpe') + '">' + fmtToPar(n) + '</span>'; }
/* v1.8 — Bruce's palette (s81): every scored cell wears a mark. Gross-
   relative, ace by gross 1. ace=green alb=purple eagle=orange birdie=red
   par=blue circles; bogey=gray square (black text); double+=black square. */
function mkScore(v, h, pars){
  if (!v) return '\u00B7';
  var p = pars ? pars[h-1] : null; if (!p) return v;
  var d = v - p;
  var c = (v === 1) ? 'ace' : (d <= -3) ? 'alb' : (d === -2) ? 'eg' : (d === -1) ? 'bd'
        : (d === 0) ? 'pr' : (d === 1) ? 'bg' : 'db';
  return '<span class="mk ' + c + '">' + v + '</span>';
}

/* ---------- resolve ----------------------------------------------------- */
function jfetch(url, opt){
  return fetch(url, opt).then(function(r){
    return r.text().then(function(t){
      var d = null; try { d = JSON.parse(t); } catch(e){}
      return { status: r.status, ok: r.ok, data: d };
    });
  });
}

/* ⭐ s87 (Bruce) — every card entry shows the COURSE. The join-round payload
   carries course_id but NOT a display name (verified live against the worker),
   so tee-time cards had no course on them at all. One public
   GET /api/courses/:id, fail-soft: the sub-line renders instantly WITHOUT the
   name and the name is patched in when it lands — the card never waits on a
   network read. A failed/empty read is NEVER cached, so it self-heals on the
   next card. Same shape as the client's ptRoundsFor / ptTvParsFor. */
var _cName = {};
function ltCourseTag(cid, base){
  var put = function(nm){ $('evSub').textContent = (nm ? [nm].concat(base) : base).filter(Boolean).join(' \u00b7 '); };
  put(cid && _cName[cid]);
  if (!cid || _cName[cid]) return;
  jfetch(API + '/api/courses/' + encodeURIComponent(cid)).then(function(r){
    var nm = r.ok && r.data && r.data.course && r.data.course.name;
    if (nm){ _cName[cid] = nm; put(nm); }
  }).catch(function(){});
}

function resolve(code, rid){
  var q = rid ? ('?rid=' + encodeURIComponent(rid)) : '';
  return jfetch(API + '/api/join/' + encodeURIComponent(code) + q).then(function(r){
    if (r.ok && r.data && r.data.group) return startGroup(r.data, code, rid);
    if (r.status === 404) {
      return jfetch(API + '/api/join-round/' + encodeURIComponent(code)).then(function(r2){
        if (r2.ok && r2.data && r2.data.foursome) return startRound(r2.data, code);
        throw new Error((r2.data && r2.data.error) || 'That code didn’t match a card.');
      });
    }
    throw new Error((r.data && r.data.error) || ('Could not open that card (HTTP ' + r.status + ').'));
  });
}

/* --- team / group card: POST /api/scores ------------------------------- */
function startGroup(d, code, rid){
  var g = d.group;
  if (g.event_status && g.event_status !== 'active') throw new Error('This event isn’t open for scoring right now.');
  if (g.round_status === 'locked') throw new Error('Scoring is locked for this round — see the organizer.');
  S.mode = 'group'; S.code = code; S.rid = rid;
  S.evName = g.event_name || 'Pards Tour';
  S.evCode = g.event_code || null;
  S.courseId = g.course_id || null;
  S.startHole = Number(g.start_hole) || 1;
  S.rndNo = g.round_number || null;             // ⭐⭐ B-82 (s99) · course messages are keyed by ROUND NUMBER

  // The worker already applied the Card Swap policy (B-45 / w2.81.0) — we
  // simply score whatever it handed us. paired_group present = cross-scoring.
  var paired = d.paired_group;
  var scope = paired ? paired : { id: g.id, name: g.name, code: g.code };
  var roster = paired ? (d.paired_players || []) : (d.players || []);
  var label  = (roster[0] && roster[0].name) || scope.name || 'Team';

  S.cols = [{
    key: 'g' + scope.id,
    label: scope.name || 'Team',
    sub: '',                                   // the banner above already lists the names
    names: roster.map(function(p){ return p.name; }).join(' · '),
    post: { url: API + '/api/scores',
            body: { group_code: scope.code, player_name: label, handicap: 0, tee: g.tee || 'white' } }
  }];
  S.holes = holeOrder(S.startHole);
  $('forWho').innerHTML = (paired ? 'You’re keeping score for: ' : 'Your card: ') + esc(scope.name || 'Team') +
    (S.cols[0].names ? '<small>' + esc(S.cols[0].names) + '</small>' : '');
  if (g.course_name && S.courseId) _cName[S.courseId] = g.course_name;   // ⭐ s87 · group payload already names it — no fetch needed
  ltCourseTag(S.courseId, [g.date || '', paired ? 'cross-scoring' : '']);
}

/* --- tee-time foursome card: POST /api/scores/round -------------------- */
function startRound(d, code){
  var f = d.foursome;
  if (f.round_status === 'locked') throw new Error('Scoring is locked for this round — see the organizer.');
  S.mode = 'round'; S.code = code;

  S.evCode = f.event_code || null;              // v1.4 \u00b7 worker v2.82.0+ names it; older workers omit \u2192 null, ticker stays off on roster cards (teams still borrow below)
  S.courseId = f.course_id || null;
  S.startHole = Number(f.hole) || 1;
  S.fmt = f.format || null;                     // ⭐ B-69 · gates the individual board path
  S.evId = f.event_id || null; S.rndId = f.round_id || null;   // ⭐ B-69 · round-board endpoint ids
  S.rndNo = f.round_number || null;             // ⭐⭐ B-82 (s99) · course messages are keyed by ROUND NUMBER

  // TEAM rows (scramble / shotgun: roster_id null, group_id + group_code set).
  // Team rows MUST post to /api/scores on their own groups.code — the client's
  // _isTeam branch. Sending them to /api/scores/round writes
  // scores.group_id = tee_times.id, which the scramble board never reads.
  var all   = d.players || [];
  var teams = all.filter(function(p){ return !p.roster_id && p.group_code; });
  if (teams.length) return startRoundTeams(d, teams);
  var players = all.filter(function(p){ return p.roster_id; });

  // slot back (wraps). Same rule the full client applies.

     ONE shared tee-time code, so a TYPED code can't know whose card you hold.
     No mp -> ask. The pick re-enters startRound with mp set (and pushes mp
     into the URL so a reload keeps the scope). QR path (?mp=) never sees this. */

    var ov = document.createElement('div');

      + players.map(function(p){ return '<button data-mp="' + p.roster_id + '" style="width:100%;max-width:340px;padding:14px;background:rgba(201,168,76,.14);border:1.5px solid rgba(201,168,76,.5);border-radius:11px;color:#f5e6b8;font-size:15px;font-weight:900">' + esc(p.name) + '</button>'; }).join('');

      S.mp = b.getAttribute('data-mp');
      try { var u = new URL(location.href); u.searchParams.set('code', code); u.searchParams.set('mp', S.mp); history.replaceState(null, '', u); } catch (e2) {}
      ov.remove();
      startRound(d, code); renderCard(); flush();
    });
    document.body.appendChild(ov);
  }
  var mkName = null;
  if (f.card_swap === 'marker' && S.mp) {
    var oi = -1;
    for (var i=0;i<players.length;i++) if (String(players[i].roster_id) === String(S.mp)) oi = i;
    if (oi >= 0 && players.length > 1) {
      /* v1.3 \u00b7 B-54 (Bruce s80, repro 135478): the marker column was a REAL
         entry column posting real rows \u2014 Cal's 18 landed off Joel's card while
         Cal's own card was blank. The worker has no marker-score concept, so
         digital entry is the OFFICIAL ONLY; the marker stays a named identity
         (paper Marker Scores strip is the attest), never a submit column. */
      mkName = players[(oi - 1 + players.length) % players.length].name;
      scope = [players[oi]];
    }

    return {
      key: 'r' + p.roster_id,
      label: p.name,

      post: { url: API + '/api/scores/round',
              body: { group_code: f.code, player_name: p.name, handicap: p.handicap || 0,

      + teams.map(function(t){ return '<button data-g="' + t.group_id + '" style="width:100%;max-width:340px;padding:14px;background:rgba(201,168,76,.14);border:1.5px solid rgba(201,168,76,.5);border-radius:11px;color:#f5e6b8;font-size:15px;font-weight:900">' + esc(t.name || 'Team') + '</button>'; }).join('');
    ov.addEventListener('click', function(e){
      var b = e.target.closest('button[data-g]'); if (!b) return;
      S.tg = b.getAttribute('data-g');
      try { var u = new URL(location.href); u.searchParams.set('code', S.code); u.searchParams.set('tg', S.tg); history.replaceState(null, '', u); } catch (e2) {}
      ov.remove();
      startRoundTeams(d, teams); renderCard(); flush();
    });
    document.body.appendChild(ov);
  }
  if (S.tg) {
    var picked = teams.filter(function(t){ return String(t.group_id) === String(S.tg); });
    if (picked.length) teams = picked;
  }
  S.holes = holeOrder(S.startHole);
  S.cols = teams.map(function(t){
    var roster = t.team_players || [];
    var label  = (roster[0] && roster[0].name) || t.name || 'Team';
    return {
      key: 'g' + t.group_id,
      label: t.name || 'Team',
      sub: roster.map(function(p){ return p.name; }).join(' · '),
      post: { url: API + '/api/scores',
              body: { group_code: t.group_code, player_name: label,
                      handicap: 0, tee: f.tee || 'white' } }
    };
  });
  S.ci = 0;                        // D66 · new card — back to the first chip
  $('forWho').innerHTML = (S.cols.length > 1
      ? 'This card holds ' + S.cols.length + ' teams — enter both.'
      : 'Your card: ' + esc(S.cols[0].label)) +
    '<small>' + esc(S.cols.map(function(c){ return c.label; }).join('  ·  ')) + '</small>';
  ltCourseTag(S.courseId, ['Round ' + (f.round_number || 1),   // ⭐ s87 · course name
    (f.hole ? 'Start hole ' + f.hole : ''), f.start_time || '', f.date || '']);
  // handleJoinRound carries no event_code, so borrow it from a team's own
  // group join — one extra GET, fail-soft, ticker simply stays off on error.
  if (f.event_code){ S.evCode = f.event_code; tickArm(); }   // v1.4 \u00b7 worker v2.82.0+ carries it \u2014 no borrow needed
  else jfetch(API + '/api/join/' + encodeURIComponent(teams[0].group_code))
    .then(function(r){
      var ec = r.ok && r.data && r.data.group && r.data.group.event_code;
      if (ec){ S.evCode = ec; tickArm(); }
    })
    .catch(function(){});
}

function holeOrder(start){
  var o = [], s = (start>=1 && start<=18) ? start : 1;
  for (var i=0;i<18;i++) o.push(((s - 1 + i) % 18) + 1);
  return o;
}

function renderCard(){
  $('vCode').classList.add('hide');
  $('vCard').classList.remove('hide');
  $('evName').textContent = S.evName;
  /* v1.10 \u00b7 Bruce s82: 'Open full app' pill removed for now. */
  // resume where they left off: first hole with nothing entered
  var seen = 0;
  for (var i=0;i<S.holes.length;i++){
    var h = S.holes[i], any = false;
    for (var c=0;c<S.cols.length;c++) if (val(S.cols[c].key,h)) any = true;
    if (any) seen = i + 1;
  }
  S.hi = Math.min(seen, 17);
  renderHole();
  if (S.evCode) tickArm();
  wxArm();                                     // v1.7 \u00b7 course weather
}

function val(key,h){ return (S.sc[key] && S.sc[key][h]) || 0; }
function setVal(key,h,v){ if(!S.sc[key]) S.sc[key] = {}; if (v) S.sc[key][h] = v; else delete S.sc[key][h]; persist(); }

/* v1.2 — recorded-scores grid. `get(h)` returns the gross for hole h.
   Standard 1–18 card layout (what a golfer reads) even on a shotgun, with
   OUT / IN / TOT. `clickable` wires each cell to jump the entry pad there. */
function scoreGrid(get, clickable, curHole, pars){
  function nine(from){
    var lab = '', val = '', sum = 0, any = false;
    for (var i=from;i<from+9;i++){
      var h = i + 1, v = get(h) || 0;
      if (v){ sum += v; any = true; }
      lab += '<td>' + h + '</td>';
      val += '<td class="' + (v ? '' : 'e') + (h === curHole ? ' cur' : '') + '"' +
             (clickable ? ' data-h="' + h + '"' : '') + '>' + mkScore(v, h, pars) + '</td>';
    }
    lab += '<td class="sum">' + (from === 0 ? 'OUT' : 'IN') + '</td>';
    val += '<td class="sum">' + (any ? sum : '–') + '</td>';
    return { lab: lab, val: val, sum: any ? sum : null };
  }
  var o = nine(0), n = nine(9);
  var tot = (o.sum || 0) + (n.sum || 0);
  return '<div class="scg"><table>' +
    '<tr class="h">' + o.lab + '<td class="sum"></td></tr>' +
    '<tr class="v">' + o.val + '<td class="sum"></td></tr>' +
    '<tr class="h">' + n.lab + '<td class="sum">TOT</td></tr>' +
    '<tr class="v">' + n.val + '<td class="sum">' + (tot || '–') + '</td></tr>' +
    '</table></div>';
}

/* ⭐ D66 · v1.12 — v1.11's per-column block, extracted VERBATIM so the
   single-pad path and the N=1 path emit the same markup. The N=1 render must
   stay byte-identical to v1.11 (Bruce, s83) — do not "improve" this. */
function padBlock(c, h){
  var out = '';
    var col = S.cols[c], cur = val(col.key,h);
    var tot = 0, thru = 0;
    for (var k=1;k<=18;k++){ var v = val(col.key,k); if (v){ tot += v; thru++; } }
    out += '<div class="pl"><div class="plname"><span>' + esc(col.label) + '</span>' +
           (col.sub ? '<i>' + esc(col.sub) + '</i>' : '') + '</div><div class="pad">';
    for (var n=1;n<=9;n++){
      out += '<button data-c="' + c + '" data-v="' + n + '" class="' + (cur===n?'on':'') + '">' + n + '</button>';
    }
    out += '<button data-c="' + c + '" data-v="0" class="clr">clear</button>';
    var tp = null, pa = parArr(S.courseId);
    if (pa && thru){ tp = 0; for (var k2=1;k2<=18;k2++){ var v2 = val(col.key,k2); if (v2) tp += v2 - pa[k2-1]; } }
    out += '</div><div class="tot"><span>Thru ' + thru + (tp===null?'':' &nbsp;' + fmtToParC(tp)) + '</span><span>Total <b>' + (tot||'–') + '</b></span></div>';
    out += scoreGrid((function(k){ return function(hh){ return val(k, hh); }; })(col.key), true, h, parArr(S.courseId))
             .replace('<div class="scg">', '<div class="scg" data-col="' + c + '">');
    out += '</div>';
  return out;
}

/* ⭐ B-68 (s86, live) — the chip-name shortener USED to cut a two-token name to
   first + last initial, so "Mark Comeau" and "Mark Curley" BOTH rendered
   "Mark C" — two players, one label, on the exact widget whose job is to tell
   them apart. DELETED in v1.13: the chip renders the FULL label, nowrap +
   CSS ellipsis. Do NOT re-introduce a shortener. */

/* ⭐ D68 (s86) — first column with no score on hole h, or null. Used ONLY to
   block a FORWARD hole change at N>=2. */
function firstMissing(h){
  var miss = [];
  for (var i=0;i<S.cols.length;i++) if (!val(S.cols[i].key, h)) miss.push(S.cols[i].label);
  return miss.length ? { name: miss[0], more: miss.length - 1 } : null;
}

/* ⭐⭐ D68 (s86) — EVERY hole change goes through here and S.ci ALWAYS returns
   to chip 1, so a new hole opens in the same place every single time. Bruce
   asked for this AFTER scoring a live fivesome on v1.12; it deliberately
   SUPERSEDES D66 Q3 ("the active chip never moves on its own"). Do not
   "restore" the never-moves rule in a later session.
   fwd=true applies the D68 missing-score guard — hPrev is NEVER guarded, and
   N=1 is NEVER guarded (v1.11 single-player behaviour is still frozen). */
function goHole(i, fwd){
  if (i < 0 || i > 17) return;
  if (fwd && S.cols.length > 1){
    var m = firstMissing(S.holes[S.hi]);
    if (m){ sync('missing score for ' + m.name + (m.more ? ' (+' + m.more + ' more)' : ''), 'bad'); return; }
  }
  S.hi = i;
  S.ci = 0;
  renderHole();
}

function renderHole(){
  try { doneCheck(); } catch (eD) {}   /* v1.23 · B-80 — a RESUMED finished card never flushes, so the flush-path doneCheck never ran and "Score another card" was unreachable. Every paint re-evaluates now. */
  var h = S.holes[S.hi], p = parOf(h);
  $('hNum').textContent = h;
  $('hPar').textContent = p ? ('PAR ' + p) : ('HOLE ' + (S.hi+1) + ' OF 18');
  $('hPrev').disabled = S.hi === 0;
  $('hNext').disabled = S.hi === 17;
  /* ⭐⭐ D66 · N>=2: ONE pad, and the player moves to the pad.
     ⭐ D68 (s86) SUPERSEDES D66 Q1/Q3: the active chip DOES move on its own —
     it cycles clockwise when a score lands, and resets to chip 1 on every hole
     change. Predictable position beats a chip that stays where you left it.
     The pad header still carries the ACTIVE player's full name — now cheap
     insurance rather than the load-bearing cue. */
  if (S.cols.length > 1){
    if (S.ci >= S.cols.length || S.ci < 0) S.ci = 0;
    var allIn = true, cw = '<div class="chips">';
    for (var i=0;i<S.cols.length;i++){
      var cv = val(S.cols[i].key,h);
      if (!cv) allIn = false;
      cw += '<button class="chip' + (i===S.ci?' cact':'') + (cv?'':' cun') + '" data-ci="' + i + '">' +
            '<span>' + esc(S.cols[i].label) + '</span><b>' + (cv || '\u2013') + '</b></button>';
    }
    $('hPar').className = allIn ? 'done' : '';   // quiet gold hairline, no motion
    $('entry').innerHTML = cw + '</div>' + padBlock(S.ci, h);
    return;
  }
  var out = '';
  for (var c=0;c<S.cols.length;c++) out += padBlock(c, h);
  $('entry').innerHTML = out;
}

$('entry').addEventListener('click', function(e){
  // v1.2 — tap any hole in the recorded-scores grid to jump the pad there
  var cell = e.target.closest && e.target.closest('.scg td[data-h]');
  if (cell) {
    var want = Number(cell.getAttribute('data-h'));
    /* ⭐ D68 — a grid jump is a hole change: chip 1 reset, and a FORWARD jump
       takes the same missing-score guard as hNext. */
    for (var i=0;i<S.holes.length;i++) if (S.holes[i] === want) { goHole(i, i > S.hi); return; }
    return;
  }
  // ⭐ D66/D68 · a chip tap moves the active column explicitly (D68 also moves
  // it on a landed score and on a hole change)
  var chip = e.target.closest && e.target.closest('button[data-ci]');
  if (chip) { S.ci = Number(chip.getAttribute('data-ci')); renderHole(); return; }
  var b = e.target.closest && e.target.closest('button[data-c]');
  if (!b) return;
  var c = Number(b.getAttribute('data-c')), v = Number(b.getAttribute('data-v'));
  var col = S.cols[c], h = S.holes[S.hi];
  // ⭐ v1.2 — tapping the SAME number again toggles the hole off. Guard on the
  // NEW value, not the button: `if (v)` used to queue a gross_score of 0.
  var nv = (val(col.key,h) === v) ? 0 : v;
  setVal(col.key, h, nv);
  /* ⭐⭐ D68 (s86) — a LANDED score cycles the active chip endlessly clockwise,
     PLAIN modulo: it does NOT skip players who already have this hole. A CLEAR
     does NOT advance — you are fixing that player, so stay on them. N=1 never
     cycles. Supersedes D66 decision 1. */
  if (nv && S.cols.length > 1) S.ci = (S.ci + 1) % S.cols.length;
  renderHole();
  if (nv) queueSend(col, h, nv);
  else    sync('Cleared — hole ' + h + ' keeps its last saved value on the server.', 'bad');
});
$('hPrev').addEventListener('click', function(){ goHole(S.hi - 1, false); });  // ⭐ D68 · back is NEVER guarded
$('hNext').addEventListener('click', function(){ goHole(S.hi + 1, true);  });  // ⭐ D68 · forward checks every chip has this hole

/* ---------- submit + retry queue ---------------------------------------- */
function persist(){ if (QKEY) lsSet(QKEY, { sc: S.sc, hi: S.hi }); }
function qLoad(){ return lsGet(QKEY + ':q') || []; }
function qSave(q){ lsSet(QKEY + ':q', q); }

function sync(msg, cls){ var e = $('syncMsg'); e.textContent = msg || ''; e.className = 'sync' + (cls ? ' ' + cls : ''); }

function queueSend(col, hole, gross){
  var q = qLoad();
  q = q.filter(function(it){ return !(it.key === col.key && it.hole === hole); });
  q.push({ key: col.key, hole: hole, gross: gross, t: Date.now() });
  qSave(q);
  flush();
}

var _flushing = false;
function flush(){
  var q = qLoad();
  if (!q.length){ sync('All scores saved.', 'ok'); return Promise.resolve(); }
  if (_flushing) return Promise.resolve();
  _flushing = true;
  sync('Saving ' + q.length + ' hole' + (q.length>1?'s':'') + '…');
  // one POST per column, carrying every queued hole for that column
  var byCol = {};
  q.forEach(function(it){ (byCol[it.key] = byCol[it.key] || []).push(it); });
  var jobs = Object.keys(byCol).map(function(key){
    var col = null; for (var i=0;i<S.cols.length;i++) if (S.cols[i].key === key) col = S.cols[i];
    if (!col) return Promise.resolve({ key: key, ok: true });
    var body = {}; for (var k in col.post.body) body[k] = col.post.body[k];
    body.scores = byCol[key].map(function(it){ return { hole: it.hole, gross_score: it.gross }; });
    return jfetch(col.post.url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function(r){
        if (r.ok && r.data && r.data.ok) return { key: key, ok: true, sent: byCol[key] };
        if (r.status === 409) return { key: key, ok: false, fatal: (r.data && r.data.error) || 'Scoring is closed for this round.' };
        return { key: key, ok: false };
      })
      .catch(function(){ return { key: key, ok: false }; });
  });
  return Promise.all(jobs).then(function(res){
    _flushing = false;
    var left = qLoad(), fatal = null;
    res.forEach(function(r){
      if (r.fatal) fatal = r.fatal;
      /* v1.3 \u00b7 B-55 (Bruce s80, Blair Oko 554033: holes 3/12/14/16/18 lost):
         clearing by COLUMN KEY wiped holes queued WHILE a flush was in flight
         \u2014 they were never sent, but 'All scores saved' still showed. Remove
         only the exact items in the sent snapshot (key+hole+t identity); a
         hole entered or re-entered mid-flight keeps its queue slot and goes
         out on the next flush/tick. */
      if (r.ok) left = left.filter(function(it){
        return !(it.key === r.key && (r.sent || []).some(function(sn){ return sn.hole === it.hole && sn.t === it.t; }));
      });
    });
    qSave(left);
    if (fatal){ sync(fatal, 'bad'); return; }
    if (left.length) {
      /* v1.5 \u00b7 B-59 (Bruce s80): B-55 keeps mid-flight holes queued \u2014 correct \u2014
         but they then sat until the 15 s tick, spamming 'waiting' while play
         continued. If THIS flush landed anything, go again immediately; the
         tick + online listener still cover the true-failure case. */
      if (res.some(function(r){ return r.ok; })) { sync('Saving\u2026'); setTimeout(flush, 300); }
      else sync(left.length + ' hole' + (left.length>1?'s':'') + ' waiting — will retry (keep this page open).', 'bad');
    }
    else { sync('All scores saved.', 'ok'); doneCheck(); if (S.evCode) setTimeout(tickPoll, 8000); }
  });
}
/* v1.10 \u00b7 D63 \u2014 every hole on every column scored AND queue empty = the card
   is fully with the tournament. Say so explicitly, then offer a clean start. */
function doneCheck(){
  var bar = $('doneBar');
  if (!bar) return;
  if (!S.cols.length || !S.holes.length || qLoad().length){ bar.style.display = 'none'; return; }
  for (var c = 0; c < S.cols.length; c++){
    for (var i = 0; i < S.holes.length; i++){
      var k = S.cols[c].key, hh = S.holes[i];
      if (!(S.sc[k] && S.sc[k][hh])){ bar.style.display = 'none'; return; }
    }
  }
  sync('\u2713 All scores submitted to the tournament successfully.', 'ok');
  bar.style.display = 'block';
}
setInterval(function(){ if (qLoad().length) flush(); }, 15000);
window.addEventListener('online', flush);

function ltHash(s){ var h=0,t=String(s||''); for (var i=0;i<t.length;i++){ h=((h<<5)-h+t.charCodeAt(i))|0; } return Math.abs(h); }
function ltFunKey(gross, par){

/* v1.21 · FR-09 — organizer course messages. Rides d.event.config from the

var _cmA = [], _cmI = [], _cmH = [];   /* v1.23 · B-78 — _cmA EMERGENCY (takeover) · _cmI INFORMATION (rides) */
function ltCMsgRead(cf, rn){

function tickArm(){ if (_tickTimer || !S.evCode) return; tickPoll(); _tickTimer = setInterval(tickPoll, 60000); }
function tickPoll(){

            _funOn = !(_cf && _cf.scorecard_ticker && _cf.scorecard_ticker.fun === false);

      _st = d.standings || []; _at = d.computed_at || null;

/* v1.2 — a fresh phone joining a card mid-round has no local scores, but the
   worker's standings already carry this group's scores_by_hole. Fill the gaps
   ONLY: anything entered locally wins (it may not have synced yet), and
   nothing here is ever re-queued for submit. */
function seedFromStandings(){
  if (!_st || !_st.length || !S.cols.length) return;
  var changed = false;
  for (var i=0;i<_st.length;i++){
    var e = _st[i];
    if (e.group_id == null || !e.scores_by_hole) continue;
    var key = 'g' + e.group_id, own = false;
    for (var c=0;c<S.cols.length;c++) if (S.cols[c].key === key) own = true;
    if (!own) continue;
    S.sc[key] = S.sc[key] || {};
    var hs = Object.keys(e.scores_by_hole);
    for (var j=0;j<hs.length;j++){
      var h = Number(hs[j]);
      if (!(h>=1 && h<=18)) continue;
      if (!S.sc[key][h]) { S.sc[key][h] = e.scores_by_hole[hs[j]]; changed = true; }
    }
  }
  if (changed) { persist(); renderHole(); }
}

function sorted(rows){
  var w = rows.map(function(r){ return { r:r, tp: toPar(r) }; });
  w.sort(function(a,b){
    if (b.r.holes_played !== a.r.holes_played) return b.r.holes_played - a.r.holes_played;
    if (a.tp !== null && b.tp !== null && a.tp !== b.tp) return a.tp - b.tp;
    return a.r.total - b.r.total;
  });
  return w;
}
/* ⭐⭐ s89 · ONE ticker, TWO sources — the B-69 lbOpen precedent. Teams win
   whenever the watch cache has live rows; an individual round falls through to
   _si, the round board's rows ALREADY net-sorted by ltRoundLb. Normalising here
   keeps the render loop, the fun prompts and the marquee single-copy.
   ⭐ The figure follows the BOARD (Bruce, s87): teams show to-par, individuals
   show NET — the column their order is sorted on. Never a bare number. */
function tickEntries(){
  var live = function(a){ return !!(a && a.length && a.some(function(e){ return e.holes_played > 0; })); };
  if (live(_st)) return sorted(_st).map(function(w){ var e = w.r; return {
    name: e.group_name || 'Team', fig: fmtToParC(w.tp), thru: e.holes_played,
    sbh: e.scores_by_hole, cid: e.course_id }; });
  if (live(_si)) return _si.map(function(p){ var dd = p.data || {}; return {
    name: p.name || 'Player',
    /* v1.23 · B-81 (Bruce, event 896643): ONE honest TOTAL — points on a
       stableford round, else gross until FINAL; net only on a finished card.
       The payload net is gross minus the FULL handicap, so mid-round it reads
       "net −6 after 1 hole" — bad information, never again. */
    fig: (/stableford/.test(String(S.fmt || '')) && p.points != null) ? (p.points + ' pts')
       : (p.holes_played >= 18 && p.net != null) ? (p.net + ' net')
       : (p.gross == null ? '\u2014' : p.gross + ' gr'),
    thru: p.holes_played, sbh: dd.scores_by_hole, cid: dd.course_id }; });

}
function tickRender(){

  var _ch = (S.holes && S.holes.length) ? S.holes[S.hi] : 0;   /* v1.23 · B-78 — a HOLE note shows only while the scorer is ON that hole */
  for (var b=0;b<_cmH.length;b++) if (_cmH[b].h === _ch) cm += '<span style="color:'+(_cmH[b].s?'#e0cd8f':_cmH[b].d?'#ff9d90':'#8fd0ff')+'">'+(_cmH[b].s?'🤝 ':_cmH[b].d?'⚠️ ':'📍 ')+'H'+_cmH[b].h+' '+_cmH[b].t+'</span>';
  if (!rows.length && !cm && !_cmA.length){ t.style.display = 'none'; return; }
  /* v1.22 (Bruce, s97) · refined v1.23 (s98, B-78) — the takeover is EMERGENCY-only:
     it is the ONLY thing on the strip, until it is cleared. Reverses the s96
     danger-tone alerts hold the whole strip until cleared; INFORMATION (notice)
     rides the crawl; HOLE notes show only on the hole being scored. */
  var _cmTake = _cmA.length > 0;
  var html = _cmTake ? '' : cm;
  for (var a2=0;_cmTake && a2<_cmA.length;a2++) html += '<span style="color:#ff8878;font-weight:800">\u26a0\ufe0f '+_cmA[a2]+'</span>';
  for (var i=0;!_cmTake && i<rows.length && i<12;i++){
    html += '<span><em>' + (i+1) + '.</em> ' + esc(rows[i].name) + ' ' +
            rows[i].fig + ' <i style="font-style:normal;color:rgba(255,255,255,.45)">' + thruLabel(rows[i].thru) + '</i></span>';
  }
  /* v1.10 \u00b7 fun prompts \u2014 at most 6, most-recent notable hole per entry */
  var _fn = 0;
  for (var f = 0; !_cmTake && f < rows.length && _fn < 6; f++){
    var note = ltFunNote(rows[f].name, rows[f].sbh, parArr(rows[f].cid || S.courseId));
    if (!note) continue;

  }

/* ⭐ B-69 — ONE board renderer, two sources (the D66 padBlock precedent).

/* ⭐⭐ B-69 (found live s86 · board built s87, v1.16 · LIVE-CONFIRMED s88) —

function ltIndivFmt(){ return /^individual/.test(String(S.fmt || '')); }

function ltBoardTap(){

/* ⭐⭐ B-69 · the individual round board. GET /api/events/:eid/rounds/:rid/
   leaderboard is public (handleRoundLeaderboard, worker v2.76.0) — one row per
   player with gross, net and scores_by_hole. Team/scramble cards do NOT use

   any miss falls back to the v1.14 message and the card never hangs. */
function ltRoundLb(quiet){
  var nb = function(){
    if (quiet) return;                            /* ⭐ s89 · a ticker poll NEVER speaks to the card */
    if (_si && _si.length){ lbOpen(_si); return; } /* ⭐ s89 · the strip is showing rows — "no board" would contradict it */
    sync('No live board for an individual round yet — your scores ARE saving. Full standings at pardstour.com'); };
  jfetch(API + '/api/events/' + S.evId + '/rounds/' + S.rndId + '/leaderboard')
    .then(function(r){

      if (!st){ nb(); return; }
      st.sort(function(a,b){
        if (a.net == null && b.net == null) return (a.gross || 0) - (b.gross || 0);

function boot(code, rid, mp, tg){
  S.mp = mp || null;
  S.tg = tg || null;                             // v1.5 \u00b7 B-58 \u2014 picked team card on a pair slot code
  QKEY = 'ptlite:' + code + (rid ? ':' + rid : '');

  return resolve(code, rid).then(function(){
    var saved = lsGet(QKEY);
    if (saved && saved.sc) {                       // local wins for un-synced holes
      Object.keys(saved.sc).forEach(function(k){
        S.sc[k] = S.sc[k] || {};
        Object.keys(saved.sc[k]).forEach(function(h){ S.sc[k][Number(h)] = saved.sc[k][h]; });
      });
    }
    renderCard();
    flush();
  });
}
