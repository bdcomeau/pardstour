<title>Pards Tour — Quick Score</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0f1512;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100dvh;padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;padding:14px calc(14px + env(safe-area-inset-right,0px)) 8px calc(14px + env(safe-area-inset-left,0px))}
.hdr{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 4px calc(14px + env(safe-area-inset-left,0px));max-width:520px;margin:0 auto}
.brand{font-size:13px;font-weight:900;letter-spacing:.14em;color:#c9a84c}
.lite{font-size:10px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.32)}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin-bottom:12px}
.ev{font-size:17px;font-weight:900;line-height:1.25}
.sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px}
.for{margin-top:9px;font-size:13px;font-weight:800;color:#a8d5b5}
.for small{display:block;font-weight:600;font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.hole{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.hbtn{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:800;cursor:pointer}
.hbtn:disabled{opacity:.25}
.hnum{text-align:center;flex:1}
.hnum b{display:block;font-size:34px;font-weight:900;line-height:1}
.hnum span{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.08em}
.pl{margin-bottom:12px}
.plname{font-size:14px;font-weight:800;margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plname i{font-style:normal;font-size:11px;font-weight:700;color:rgba(255,255,255,.45)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{height:50px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#fff;font-size:19px;font-weight:800;cursor:pointer}
.pad button.on{background:rgba(201,168,76,.9);border-color:#c9a84c;color:#1a1a12}
.pad button.clr{font-size:13px;font-weight:700;color:rgba(255,255,255,.5)}
/* ⭐ FR-13 (s99) — the stacked row: arrow · name+score · arrow. Replaces the
   chip strip, which had no user left once the pad went away on every N>=2 card.
   .cact / .cun keep the meanings they carried on the chip (active / no score). */
button{touch-action:manipulation} /* B-91 (v1.26, s118) — double-tap on a scoring arrow zoomed the page; iOS ignores maximum-scale for double-tap */
.rws{display:grid;gap:6px;margin-bottom:11px}
.rw{display:grid;grid-template-columns:58px 1fr 58px;gap:7px}   /* v1.28 · 46->58: bigger thumb target, the row had the room */
.rw .ar{border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.20);color:#fff;font-size:20px;font-weight:900;cursor:pointer}
.rw .ar:disabled{opacity:.28}
.rwc{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.20);color:#fff;cursor:pointer;overflow:hidden}
.rwc span{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v1.28 (Bruce, s133) — the score is its own bordered chip so it reads as a
   VALUE, not the tail of the name. min-width keeps 1- and 2-digit scores on the
   same left edge, so the column does not jitter as scores land. All four pill
   states carry their own chip treatment — on the gold ACTIVE pill the chip goes
   dark-on-gold rather than keeping a light border that would disappear. */
.rwc b{font-size:20px;font-weight:900;margin-left:10px;min-width:34px;text-align:center;
       padding:2px 9px;border-radius:9px;flex:none;
       background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.30)}
.rwc.cun{border-style:dashed;border-color:rgba(255,255,255,.32)}
.rwc.cun b{color:rgba(255,255,255,.42);background:rgba(255,255,255,.04);border-style:dashed;border-color:rgba(255,255,255,.24)}
.rwc.cact{background:rgba(201,168,76,.9);border-color:#c9a84c;color:#1a1a12}
.rwc.cact.cun{border-color:rgba(26,26,18,.5)}
.rwc.cact b{background:rgba(26,26,18,.12);border-color:rgba(26,26,18,.40)}
.rwc.cact.cun b{color:rgba(26,26,18,.55);background:rgba(26,26,18,.05);border-color:rgba(26,26,18,.26);border-style:dashed}
#hPar.done{display:inline-block;border-bottom:2px solid rgba(201,168,76,.75);padding-bottom:3px}
.tot{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);padding:2px 2px 0}
.tot b{color:#fff;font-size:14px}
.act{display:flex;gap:8px;margin:10px 0 12px}   /* FR-207 (v1.51) — top slot */
.act a,.act button{flex:1;text-align:center;text-decoration:none;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:800;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
.act a.pri{background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.45);color:#e6c96f}
.sync{font-size:11px;text-align:center;color:rgba(255,255,255,.4);padding:4px 0 2px;min-height:16px}
.sync.bad{color:#ffb4a0}
.sync.ok{color:#a8d5b5}
input.code{width:100%;padding:16px;font-size:30px;font-weight:900;letter-spacing:.22em;text-align:center;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);border-radius:14px;color:#fff}
button.go{width:100%;margin-top:10px;padding:15px;border-radius:14px;border:1px solid rgba(201,168,76,.5);background:rgba(201,168,76,.16);color:#e6c96f;font-size:16px;font-weight:900;cursor:pointer}
.err{color:#ffb4a0;font-size:13px;text-align:center;margin-top:10px;min-height:18px;line-height:1.4}
#tick{position:fixed;left:0;right:0;bottom:0;height:34px;background:#141a17;border-top:1px solid rgba(201,168,76,.28);display:none;overflow:hidden;z-index:250;cursor:pointer}
#tick .tr{display:flex;align-items:center;height:34px;white-space:nowrap;padding:0;font-size:12px;font-weight:700;color:rgba(255,255,255,.85);overflow:hidden}
/* v1.8 — the strip scrolls itself like the app's ticker: track holds the row
   TWICE and slides half its width per loop (seamless). Tap still opens the
   full board. Duration scales with row count (set inline by tickRender). */
#tick .trk{display:flex;align-items:center;animation:ticksc var(--tickdur,30s) linear infinite}
@keyframes ticksc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#tick .tr span{margin-right:20px}
#tick .tr em{font-style:normal;color:#c9a84c;font-weight:900}
#lb{position:fixed;inset:0;background:#0f1512;z-index:9500;display:none;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 60px calc(14px + env(safe-area-inset-left,0px))}
#lb h3{margin:4px 0 2px;font-size:17px;font-weight:900;padding-right:58px}
/* ⭐⭐⭐ B-259 (v1.49, s288, Bruce): "on pards lite - you need to make the close are
   more visible after they finish the round - it sits below the card off the screen -
   maybe a popup saying 'all scores entered' close etc".
   He is right and it is a B-239 breach. #doneBar and the .act row that holds
   "Close card" BOTH sit under the scoring pad, and a four-man pad is taller than a
   phone — so the way out of a finished card was off the bottom of the screen and
   you had to already know to scroll for it. EVERY SCREEN NEEDS A WAY OUT, and a way
   out you cannot see is not one.
   ⛔ IT FAILS OPEN — an announcement, never a gate. Three ways past it: the button,
   the scrim, or Back to the card. #doneBar stays exactly where it has always been
   as the permanent affordance, and now re-opens this sheet when tapped.
   ⛔ B-247 cap the width · B-244/B-258 flex column, its height is its BODY ·
   B-256 every inset through env(safe-area-inset-*), viewport-fit=cover is already on. */
#b259{position:fixed;inset:0;z-index:9700;display:none;background:rgba(6,10,8,.78);overflow:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
#b259.on{display:flex;align-items:center;justify-content:center}
#b259 .b259c{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;height:auto;
  background:#131a16;border:1px solid rgba(120,220,150,.38);border-radius:16px;padding:18px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.55)}
#b259 .b259h{font-size:20px;font-weight:900;color:#a8d5b5;line-height:1.25}
#b259 .b259s{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.74);line-height:1.5}
#b259 .b259n{font-size:12px;font-weight:800;color:rgba(255,255,255,.45);margin-bottom:2px}
#b259 button{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff}
#b259 button.pri{background:rgba(201,168,76,.16);border-color:rgba(201,168,76,.5);color:#e6c96f}
#lb .cl{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:12px;padding-right:58px}
table.lbt{width:100%;border-collapse:collapse;font-size:13px}
table.lbt th{text-align:left;font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.4);padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
table.lbt td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
table.lbt td.n{text-align:right;font-weight:800;white-space:nowrap}
.hide{display:none!important}
/* v1.7 — weather line (main-app parity) */
.wxl{margin-top:8px;font-size:12px;font-weight:700;color:rgba(255,255,255,.6);display:none}
.wxl b{color:#fff;font-weight:800}
/* v1.8 — Bruce's score-mark palette: ace green / albatross purple / eagle
   orange / birdie red / par blue circles (white text); bogey light-gray
   square (black text); double+ black square (white text). */
.mk{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:50%;color:#fff;font-weight:800}
.mk.ace{background:#27ae60}
.mk.alb{background:#8e44ad}
.mk.eg{background:#e67e22}
.mk.bd{background:#c0392b}
.mk.pr{background:#2f6fb5}
.mk.bg{background:#cfcfcf;color:#111;border-radius:4px}
.mk.db{background:#0a0a0a;border:1px solid rgba(255,255,255,.35);border-radius:4px;line-height:16px}
/* v1.7 — to-par colours (ticker + leaderboard + totals) */
.tpu{color:#8fd9a0;font-weight:900}
.tpo{color:#ff9a8a;font-weight:900}
.tpe{color:rgba(255,255,255,.85);font-weight:900}
/* v1.2 — recorded-scores strip */
.scg{margin:6px 0 2px}
.scg table{width:100%;border-collapse:collapse;table-layout:fixed}
.scg td{padding:3px 0;text-align:center;font-size:11px;border:1px solid rgba(255,255,255,.07)}
.scg tr.h td{font-size:9px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:.02em}
.scg tr.v td{font-size:13px;font-weight:800;color:#fff;cursor:pointer}
.scg tr.v td.e{color:rgba(255,255,255,.22)}
.scg tr.v td.cur{background:rgba(201,168,76,.22);border-color:rgba(201,168,76,.55)}
.scg td.sum{background:rgba(255,255,255,.05);font-weight:900;color:#c9a84c}
.lbt tr.row{cursor:pointer}
.lbt tr.exp td{padding:0 0 10px;border-bottom:1px solid rgba(255,255,255,.06)}
</style>
</head>
<body>
<div class="hdr"><span class="brand">PARDS TOUR</span><span class="lite">QUICK SCORE</span></div>

<div class="wrap" id="vCode">
  <div class="card">
    <div class="ev">Enter your card code</div>
    <div class="sub">The 6&#8209;digit code printed on your scorecard.</div>
    <input class="code" id="codeIn" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <button class="go" id="codeGo">Start scoring</button>
    <div class="err" id="codeErr"></div>
    <div id="liteVer" style="margin-top:18px;text-align:center;font-size:11px;color:rgba(255,255,255,.28);font-weight:700"></div>
  </div>
</div>

<div class="wrap hide" id="vCard">
  <div class="card">
    <div class="ev" id="evName">&nbsp;</div>
    <div class="sub" id="evSub">&nbsp;</div>
    <div class="for" id="forWho"></div>

    <div class="wxl" id="wx"></div>
  </div>
  <!-- ⭐ FR-207 (v1.51, s290) — HIS ARROW ON THE LIVE SCREEN: the three pills
       moved from below the pad to directly under the event card. The way out
       is above the fold on EVERY card now, not only via the B-259 finished
       sheet. Same ids, same handlers — a DOM move, nothing rewired. -->
  <div class="act">
    <button id="btnLb">Leaderboard</button>
    <button id="btnMg" style="display:none">Manage Players on this Card</button>
    <button id="btnExit">Close card</button>
  </div>
  <div class="hole">
    <button class="hbtn" id="hPrev">&#8249;</button>
    <div class="hnum"><b id="hNum">1</b><span id="hPar">PAR 4</span></div>
    <button class="hbtn" id="hNext">&#8250;</button>
  </div>
  <div id="entry"></div>
  <div class="sync" id="syncMsg"></div>
  <div id="doneBar" style="display:none;margin:10px 0"><div style="padding:12px 14px;background:rgba(120,220,150,.12);border:1px solid rgba(120,220,150,.35);border-radius:12px;font-size:13px;font-weight:800;color:#a8d5b5">✓ All scores submitted to the tournament successfully.</div><button id="newCard" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:800;cursor:pointer">Score another card</button></div>
</div>

<div id="tick"><div class="tr" id="tickTr"></div></div>
<div id="lb"><button id="lbBack" class="hbtn" aria-label="Back" style="position:fixed;z-index:9600;background:#1b201e;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))">←</button><h3 id="lbTitle">Leaderboard</h3><div class="cl" id="lbClock"></div><div id="lbBody"></div>
  <div class="act"><button id="lbClose">Close</button></div></div>

<!-- B-259 (v1.49, s288) — the finished-card sheet. Lives OUTSIDE #lb so a
     leaderboard open underneath it cannot swallow it. -->
<div id="b259"><div class="b259c">
  <div class="b259h">&#10003; All scores entered</div>
  <div class="b259s">Every hole on this card has reached the tournament. Nothing is left on this phone.</div>
  <div class="b259n" id="b259n"></div>
  <button class="pri" id="b259Close">Done &mdash; close this card</button>
  <button id="b259Back">Back to the card</button>
</div></div>

<script>
/* ============================================================
   Pards Tour — LITE scoring page (D54, spec s77, built s79)
   Standalone. Speaks only public no-auth worker endpoints:

     GET  /api/join-round/:code     (tee-time foursome card)

     POST /api/scores/round         (tee-time card submit)
     GET  /api/round-field/:code    (the round's whole field — v1.32, FR-101)

     POST /api/round-team/:code     (claim your own team — v1.32, FR-101)
     POST /api/round-team-manage/:code  (fix a claimed card — v1.34, FR-112)

/* v1.7 — course weather, Open-Meteo (free, no key; same source as the full
   app's non-Edmonton courses). One fetch on card open + every 30 min.
   Fail-soft: no coords / no network -> the line simply stays hidden. */
var _wxTimer = null;
var WX_EMO = function(c){
  if (c === 0) return '\u2600\uFE0F';
  if (c <= 2) return '\uD83C\uDF24\uFE0F';
  if (c === 3) return '\u2601\uFE0F';
  if (c === 45 || c === 48) return '\uD83C\uDF2B\uFE0F';
  if (c >= 71 && c <= 77) return '\uD83C\uDF28\uFE0F';
  if (c >= 95) return '\u26C8\uFE0F';
  if (c >= 51) return '\uD83C\uDF27\uFE0F';
  return '\uD83C\uDF24\uFE0F';
};
var WX_COMPASS = ['N','NE','E','SE','S','SW','W','NW'];
function wxArm(){
  if (_wxTimer || !S.courseId || !COORDS[S.courseId]) return;
  wxFetch(); _wxTimer = setInterval(wxFetch, 1800000);
}
function wxFetch(){
  var ll = COORDS[S.courseId]; if (!ll) return;
  jfetch('https://api.open-meteo.com/v1/forecast?latitude=' + ll[0] + '&longitude=' + ll[1] +
    '&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code' +
    '&wind_speed_unit=kmh&temperature_unit=celsius&forecast_days=1&timezone=auto')
    .then(function(r){
      var c = r.ok && r.data && r.data.current; if (!c) return;
      var t = c.temperature_2m, w = c.wind_speed_10m, d = c.wind_direction_10m;
      var h = WX_EMO(c.weather_code) + ' <b>' + Math.round(t) + '\u00B0C</b>';
      if (w != null) h += ' &nbsp;\uD83D\uDCA8 ' + Math.round(w) + ' km/h' +
        (d != null ? ' ' + WX_COMPASS[Math.round(d/45)%8] : '');
      var el = $('wx'); el.innerHTML = h; el.style.display = 'block';
    })

}

function mkScore(v, h, pars){
  if (!v) return '\u00B7';
  var p = pars ? pars[h-1] : null; if (!p) return v;
  var d = v - p;
  var c = (v === 1) ? 'ace' : (d <= -3) ? 'alb' : (d === -2) ? 'eg' : (d === -1) ? 'bd'

function ltDev(){

    if (t && /^[A-Za-z0-9_-]{8,64}$/.test(t)) return t;
    t = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

/* ⭐⭐ FR-171 (v1.45, s281) — GIVE THE CLAIM BACK ON THE WAY OUT.
   B-239 gave every screen a way out; it did not give the CARD one. handleJoinRound

   tee_time_groups.holder), so every exit hands it back.
   ⛔ keepalive:true — the caller navigates on the very next line and a plain fetch
   would be cancelled. ⛔ Fire-and-forget by design: this is a courtesy, never a
   gate. If it fails, the 20-minute lapse still frees the card exactly as before. */
function ltRelease(code){
  try {
    if (!code) return;
    fetch(API + '/api/round-card-release/' + encodeURIComponent(code)
          + '?device=' + encodeURIComponent(ltDev()),
          { method: 'POST', keepalive: true }).catch(function(){});

function jfetch(url, opt){
  return fetch(url, opt).then(function(r){

      return { status: r.status, ok: r.ok, data: d };
    });

var _cName = {};
function ltCourseTag(cid, base){

  put(cid && _cName[cid]);

  jfetch(API + '/api/courses/' + encodeURIComponent(cid)).then(function(r){

function resolve(code, rid){
  var q = rid ? ('?rid=' + encodeURIComponent(rid)) : '';
  return jfetch(API + '/api/join/' + encodeURIComponent(code) + q).then(function(r){
    if (r.ok && r.data && r.data.group) return startGroup(r.data, code, rid);
    if (r.status === 404) {
      return jfetch(API + '/api/join-round/' + encodeURIComponent(code) + '?device=' + encodeURIComponent(ltDev())).then(function(r2){
        if (r2.ok && r2.data && r2.data.foursome) return startRound(r2.data, code);
        /* ⭐ v1.29 · FR-28 — the THIRD rail. A trip foursome code lives in
           trip_tee_times, not tee_times, so /api/join-round 404s on it and Lite
           used to stop here. handleJoinTrip (worker v2.99.0) has been live and
           unread ever since. Order matters: events first, trips last, so no
           existing code path changes shape. */
        if (r2.status === 404) {
          return jfetch(API + '/api/join-trip/' + encodeURIComponent(code)).then(function(r3){
            if (r3.ok && r3.data && r3.data.foursome) return startTrip(r3.data, code);
            /* ⭐⭐⭐ v1.32 · FR-101 — the FOURTH rail: not a group card, not a
               tee-time card, not a trip card — try the EVENT's own round-level
               code and open the field. Same ordering rule as v1.29: existing
               rails first, the new one last, so no existing code path changes
               shape. */
            if (r3.status === 404) {
              return jfetch(API + '/api/round-field/' + encodeURIComponent(code) + (rid ? ('?round_id=' + encodeURIComponent(rid)) : '')).then(function(r4){
                if (r4.ok && r4.data && r4.data.field) {
                  /* ⭐⭐ v1.41 · B-234 (Bruce s276): "a unique code for LIVE VIEW that
                     can NEVER keep score." Worker v3.48.0's round-field still answers
                     on the Live View code (Pards Live and the swap-in sheet read it)
                     but tags it view_only, and the claim route refuses it. Stop HERE,
                     at the door, with the worker's own sentence — never draw a
                     pick-players sheet whose only button is guaranteed to fail.
                     ⛔ A payload without the flag (older worker) opens exactly as
                     v1.40 did. */
                  if (r4.data.view_only) {
                    var eV = new Error("That\u2019s a Live View code \u2014 it can\u2019t keep score. Ask your organizer for the scoring code.");
                    eV.viewOnly = true;
                    throw eV;
                  }
                  return startField(r4.data, code, null);
                }
                throw new Error((r4.data && r4.data.error) || 'That code didn’t match a card.');
              });
            }
            throw new Error((r3.data && r3.data.error) || 'That code didn’t match a card.');
          });
        }
        throw new Error((r2.data && r2.data.error) || 'That code didn’t match a card.');
      });
    }
    throw new Error((r.data && r.data.error) || ('Could not open that card (HTTP ' + r.status + ').'));
  });
}

/* ⭐⭐⭐ B-159 (v1.31, s190) — A TEAM CODE IS ONE BALL. IT IS NOT ALWAYS ONE BALL.
   Bruce, entering the printed team code 117272 on "Vegas Baby" (event 139) and
   being handed a single-column card for a FOUR-MAN team. startGroup has always
   built exactly ONE column keyed on the group — correct for a scramble, where the
   team plays one ball and posts one score a hole. Measured s190 on live data:
   that round's format is team_3of4_net. Three of four NET scores means every one
   of the four men posts his OWN gross, hole by hole. One column cannot hold that
   round, and the card silently offered to score it anyway.
   ⭐⭐⭐ THE ANSWER WAS ALREADY ON THE WIRE. group.round_format has ridden this
   payload since worker v2.79.0 and Lite read it in zero places — the bug was a
   field nobody asked. No worker change; the fix is to READ what arrives.
   ⛔ IT REFUSES, IT DOES NOT GUESS. The right card for a per-player round is the
   TEE-SHEET code, and this payload does not carry it: those four men sit in an
   EIGHT-man tee time (measured), so redirecting on a hunch would hand a scorer
   eight players on a four-man card — exactly the failure B-155 was filed for. The
   full client refuses this code by design; Lite now refuses it for the same
   reason, and says which code to use instead.
   ⭐ A round with NO format resolved (round_format null, or a groups-only event
   with no rounds at all) keeps the old behaviour exactly: absent is not
   "per-player", and a scramble that never carried a round must still open. */
function ltIsOneBall(fmt){
  var f = String(fmt == null ? '' : fmt);
  if (!f) return true;                      // ⛔ unknown = unchanged behaviour
  if (f.indexOf('individual') === 0) return false;
  /* team_XofN_* counts X of the team's own N scores — per player. Its cousins
     (the CCC family) are per player too. A scramble/best-ball is one ball. */
  if (/^team_\d+of\d+/.test(f)) return false;
  if (f.indexOf('team_ccc') === 0) return false;
  if (f === 'team_1net1gross') return false;   /* FR-184 (v1.48, s286) -- 1 net + 1 gross is per player, never one ball */
  return true;
}
/* --- team / group card: POST /api/scores ------------------------------- */
function startGroup(d, code, rid){ S.held = false; /* \u2b50 FR-161 \u2014 group cards are never claimed */
  var g = d.group;
  if (g.event_status && g.event_status !== 'active') throw new Error('This event isn’t open for scoring right now.');
  if (g.round_status === 'locked') throw new Error('Scoring is locked for this round — see the organizer.');
  if (!ltIsOneBall(g.round_format)) {
    throw new Error('This round is scored player by player, so a team code can’t open a card for it — use the code printed on your tee-sheet card instead. (Team: ' + (g.name || 'this team') + ')');
  }
  S.mode = 'group'; S.code = code; S.rid = rid;
  S.evName = g.event_name || 'Pards Tour';
  S.evCode = g.event_code || null;
  S.courseId = g.course_id || null;
  S.startHole = Number(g.start_hole) || 1;
  S.rndNo = g.round_number || null;             // ⭐⭐ B-82 (s99) · course messages are keyed by ROUND NUMBER

  // The worker already applied the Card Swap policy (B-45 / w2.81.0) — we
  // simply score whatever it handed us. paired_group present = cross-scoring.
  var paired = d.paired_group;
  var scope = paired ? paired : { id: g.id, name: g.name, code: g.code };
  var roster = paired ? (d.paired_players || []) : (d.players || []);
  var label  = (roster[0] && roster[0].name) || scope.name || 'Team';

  S.cols = [{
    key: 'g' + scope.id,
    label: scope.name || 'Team',
    sub: '',                                   // the banner above already lists the names
    names: roster.map(function(p){ return p.name; }).join(' · '),
    post: { url: API + '/api/scores',
            body: { group_code: scope.code, player_name: label, handicap: 0, tee: g.tee || 'white' } }
  }];
  /* FR-182 (v1.47, s286) -- "this tee shot tracker needs to be in Pards Lite".
     Facts off the join payload (worker v3.52.0 carries g.drives); an RBC event
     without config keeps its implicit on/3 (B-249: the FACT, not the format).
     Names + restore follow the card being SCORED (scope), so cross-scoring
     records the right team's drives. */
  S.drv = {}; S.drvOn = false; S.drvMin = 0; S.drvCode = null; S.drvNames = [];
  var _drv = g.drives || null;
  S.drvOn = !!((_drv && _drv.on) || g.format === 'rbc_scramble');
  if (S.drvOn) {
    S.drvMin = (_drv && Number(_drv.min) > 0) ? Math.min(4, Math.round(Number(_drv.min))) : ((_drv && _drv.on) ? 0 : 3);
    S.drvCode = scope.code;
    S.drvNames = roster.map(function(p){ return p.name; });
    ((paired ? d.paired_tee_shots : d.tee_shots) || []).forEach(function(ts){ if (ts && ts.hole) S.drv[Number(ts.hole)] = ts.player_name; });
  }
  S.holes = holeOrder(S.startHole);
  $('forWho').innerHTML = (paired ? 'You’re keeping score for: ' : 'Your card: ') + esc(scope.name || 'Team') +
    (S.cols[0].names ? '<small>' + esc(S.cols[0].names) + '</small>' : '');
  if (g.course_name && S.courseId) _cName[S.courseId] = g.course_name;   // ⭐ s87 · group payload already names it — no fetch needed
  ltCourseTag(S.courseId, [g.date || '', paired ? 'cross-scoring' : '']);
}

/* v1.40 \u00b7 FR-162b (Bruce s275) \u2014 THE FIRST-TEE CONFLICT WARNING.

   join, no owner check on submit, and the upsert is last-save-wins per hole.
   \u26d4 Nothing in the database records WHO is holding the card, so this can
   NEVER name the other scorer \u2014 only the men who already have holes on it,
   which is what handleJoinRound's existing_scores (keyed by roster_id) says.
   Read-only by design: it warns, it never blocks. The lock is FR-161.
   \u26d4 It must NOT cry wolf on a RESUME. existing_scores is also how a man's
   own card comes back after a reload, so we subtract the holes THIS phone
   already has in localStorage (persist() writes { sc } under QKEY, keyed
   'r'+roster_id). Only holes this phone never entered are foreign. */
function ltDupWarn(players, ex){
  var el = $('ltDup'); if (!el) return;
  var mine = (lsGet(QKEY) || {}).sc || {};
  var parts = [];
  Object.keys(ex || {}).forEach(function(rid){
    var holes = Object.keys(ex[rid] || {});
    if (!holes.length) return;
    var seen = mine['r' + rid] || {};
    var foreign = holes.filter(function(h){ return seen[h] == null && seen[Number(h)] == null; });
    if (!foreign.length) return;
    var who = null;
    for (var i = 0; i < players.length; i++) if (String(players[i].roster_id) === String(rid)) who = players[i].name;
    parts.push((who || 'Player ' + rid) + ' \u00b7 ' + foreign.length + ' hole' + (foreign.length > 1 ? 's' : ''));
  });
  if (!parts.length) { el.style.display = 'none'; el.innerHTML = ''; _fr191Sig = null; return; }
  /* ⭐⭐⭐ FR-191 (v1.50, s288, Bruce): "the warning message about 'scores are
     already on this card - another phone , etc' can you enable ability to clear
     that message". It is READ-ONLY by design (FR-162b) and never blocked anything
     — but it sat on the card all round with no way to put it down.
     ⛔ THE DISMISSAL IS PER WARNING, NOT PER CARD. The signature is the card code
     plus the exact men-and-holes being reported, so putting THIS warning away is
     honoured for good — and a NEW conflict (another phone posts more holes) has a
     different signature and speaks up again. Clearing it can never blind him to
     something he has not already read. */
  _fr191Sig = String(S.code || '') + '|' + parts.join('|');
  if ((lsGet(FR191_KEY) || {})[_fr191Sig]) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = '<button type="button" onclick="ltDupClear()" aria-label="Clear this warning"'
    + ' style="float:right;margin:-2px -2px 0 8px;padding:2px 8px;border-radius:8px;border:1px solid rgba(242,189,168,.45);'
    + 'background:rgba(0,0,0,.18);color:#f2bda8;font-size:15px;font-weight:900;line-height:1.3;cursor:pointer">&#10005;</button>'
    + '\u26a0\ufe0f Scores are already on this card \u2014 ' + esc(parts.join('  \u00b7  '))
    + '<div style="font-weight:700;color:rgba(255,255,255,.62);margin-top:4px">Another phone may be scoring this group. On every hole the LAST save wins \u2014 agree who is keeping the card before you carry on.</div>'
    + '<div style="font-weight:700;color:rgba(255,255,255,.38);margin-top:5px;font-size:11px">Tap \u2715 to clear this \u2014 it stays cleared unless something new lands on the card.</div>';
  el.style.display = '';
}
/* FR-191 (v1.50) — the dismissal. ⛔ Nothing about the CARD changes: this hides a
   sentence, it does not release a claim, silence a later warning, or touch a score. */
var FR191_KEY = 'ptlite:dupdismiss';
var _fr191Sig = null;
window.ltDupClear = function () {
  var el = $('ltDup'); if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  if (!_fr191Sig) return;
  var m = lsGet(FR191_KEY) || {};
  /* keep the store small — 20 signatures is many seasons of cards */
  var ks = Object.keys(m);
  if (ks.length > 20) { var trimmed = {}; ks.slice(-10).forEach(function (k) { trimmed[k] = 1; }); m = trimmed; }
  m[_fr191Sig] = 1;
  lsSet(FR191_KEY, m);
};

/* --- tee-time foursome card: POST /api/scores/round -------------------- */
function startRound(d, code){
  var f = d.foursome;
  if (f.round_status === 'locked') throw new Error('Scoring is locked for this round — see the organizer.');
  /* \u2b50 FR-161 (v1.42) \u2014 worker v3.49.0 says whether another phone holds this
     card. Read-only here means: the pad refuses input and says the worker's own
     sentence; the server 409s a non-holder save regardless \u2014 this flag is the
     screen half, never the guard. Older workers omit held \u2192 false, exactly v1.41. */
  S.held = !!d.held;
  S.mode = 'round'; S.code = code;
  S.evName = f.event_name || 'Pards Tour';
  S.evCode = f.event_code || null;              // v1.4 \u00b7 worker v2.82.0+ names it; older workers omit \u2192 null, ticker stays off on roster cards (teams still borrow below)
  S.courseId = f.course_id || null;

  S.rndNo = f.round_number || null;             // ⭐⭐ B-82 (s99) · course messages are keyed by ROUND NUMBER

  // ⭐ v1.1 — a tee time carries EITHER roster players (individual round) or
  // TEAM rows (scramble / shotgun: roster_id null, group_id + group_code set).
  // Team rows MUST post to /api/scores on their own groups.code — the client's
  // _isTeam branch. Sending them to /api/scores/round writes
  // scores.group_id = tee_times.id, which the scramble board never reads.
  var all   = d.players || [];
  var teams = all.filter(function(p){ return !p.roster_id && p.group_code; });
  if (teams.length) return startRoundTeams(d, teams);
  var players = all.filter(function(p){ return p.roster_id; });
  var scope = players;
  // D49 / B-51 marker rotation: ?mp= names the official; the marker is one
  // slot back (wraps). Same rule the full client applies.
  /* v1.3 \u00b7 B-53 (Bruce s80): marker rotation prints one card per player but
     ONE shared tee-time code, so a TYPED code can't know whose card you hold.
     No mp -> ask. The pick re-enters startRound with mp set (and pushes mp
     into the URL so a reload keeps the scope). QR path (?mp=) never sees this. */
  if (f.card_swap === 'marker' && !S.mp && players.length > 1) {
    var ov = document.createElement('div');
    ov.id = 'mkPick';
    ov.style.cssText = 'position:fixed;inset:0;z-index:90;background:#0d1f0b;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px';
    ov.innerHTML = '<div style="font-size:17px;font-weight:900;color:#f5e6b8;margin-bottom:2px">Whose card are you holding?</div>'
      + '<div style="font-size:12.5px;color:rgba(255,255,255,.55);margin-bottom:8px;text-align:center">Cards share one code \u2014 pick the name printed on the card in your hand. You\u2019ll enter that player\u2019s scores.</div>'
      + players.map(function(p){ return '<button data-mp="' + p.roster_id + '" style="width:100%;max-width:340px;padding:14px;background:rgba(201,168,76,.14);border:1.5px solid rgba(201,168,76,.5);border-radius:11px;color:#f5e6b8;font-size:15px;font-weight:900">' + esc(p.name) + '</button>'; }).join('')
      /* v1.40 \u00b7 FR-162 (Bruce s274 \u2192 s275): one phone may hold EVERY card in
         the group. \u26d4 This is NOT B-54 coming back \u2014 B-54 was one man's card
         posting silently under ANOTHER man's name. Here every man is entered
         under his OWN name and his OWN roster_id, and the marker column stays
         gone either way. When a NAME is picked, nothing below changes. */
      + '<div style="font-size:11.5px;font-weight:800;color:rgba(255,255,255,.32);margin:8px 0 2px;letter-spacing:.08em">\u2014 OR \u2014</div>'
      + '<button data-mp="all" style="width:100%;max-width:340px;padding:14px;background:rgba(120,190,110,.16);border:1.5px solid rgba(120,190,110,.55);border-radius:11px;color:#dff3d8;font-size:15px;font-weight:900">Score for all players</button>'
      /* ⛔⛔⛔ B-240 (v1.44, s280) — DO NOT PUT A SEMICOLON ON THE LINE ABOVE.
         v1.43 shipped this button AFTER the innerHTML statement's terminator, so
         it became `+ 'string';` — a legal no-op expression. It parsed clean,
         node --check passed, and the button never rendered. The line above must
         END WITHOUT A SEMICOLON so this stays part of the concatenation.
         ⭐⭐⭐ B-239 (v1.43, s280) — EVERY SCREEN NEEDS A WAY OUT (his standing rule).
         Bruce, off the live app: "there is no escape hatch - should have an exit
         button or something like 'not Now' pill that sends you back". mkPick is
         position:fixed;inset:0 — a full-screen takeover with, until now, no
         dismiss of any kind. A golfer who mistypes one digit lands on three
         strangers' names and is stuck: the only Cancel in this flow is on the
         mkAllCf confirm sheet and it drops him straight back HERE. Browser back
         leaves the page, and a standalone PWA has no back button at all.
         ⛔ This is the OPEN HOUSE surface — the hands-on round runs on Lite.
         The destination is Lite's OWN idiom, not a new path: v1.10 · D63's
         newCard button already means "clean reload, back to the code prompt".
         ⚠⚠ STATED, NOT HIDDEN: backing out does NOT release the FR-161 claim.
         handleJoinRound (worker 7048) claims the card on the LOOKUP, and
         handleFr161Release (6990) is session + organizer gated, so a golfer
         cannot release his own. The claim therefore sits until it lapses on 20
         minutes of silence. That is NOT a regression this pill introduces — a
         reload or a closed tab already strands it exactly the same way (event
         98 this morning: one device holds BOTH 115608 and 977570). It is a
         known consequence, filed as FR-171. Trapped beats stranded. */
      + '<button data-mkout="1" style="width:100%;max-width:340px;margin-top:12px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:11px;color:rgba(255,255,255,.72);font-size:14px;font-weight:800">\u21b6 Not now</button>';
    /* v1.40 \u00b7 FR-162 \u2014 take the card(s) and open them. 'all' leaves S.mp at
       the sentinel so the narrowing below is skipped and scope stays players. */
    var mkTake = function(pick){
      S.mp = pick;
      try { var u = new URL(location.href); u.searchParams.set('code', code); u.searchParams.set('mp', S.mp); history.replaceState(null, '', u); } catch (e2) {}
      var old = document.getElementById('mkAllCf'); if (old) old.remove();
      ov.remove();
      startRound(d, code); renderCard(); flush();
    };
    /* v1.40 \u00b7 FR-162 \u2014 Bruce's words: "you will be scoring officially for {N}
       - please confirm". Taking every card in the group is a deliberate act,
       never a mis-tap, so it costs one more press and names the men first. */
    var mkAllConfirm = function(){
      if (document.getElementById('mkAllCf')) return;
      var cf = document.createElement('div');
      cf.id = 'mkAllCf';
      cf.style.cssText = 'position:fixed;inset:0;z-index:91;background:rgba(4,14,4,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px';
      cf.innerHTML = '<div style="font-size:16.5px;font-weight:900;color:#f5e6b8;text-align:center;line-height:1.5;max-width:340px">You will be scoring officially for all ' + players.length + ' players \u2014 please confirm.</div>'
        + '<div style="font-size:12.5px;color:rgba(255,255,255,.62);text-align:center;max-width:340px;line-height:1.65;margin-bottom:4px">' + esc(players.map(function(p){ return p.name; }).join(' \u00b7 ')) + '</div>'
        + '<button data-cf="go" style="width:100%;max-width:340px;padding:14px;background:rgba(120,190,110,.18);border:1.5px solid rgba(120,190,110,.6);border-radius:11px;color:#dff3d8;font-size:15px;font-weight:900">Confirm</button>'
        + '<button data-cf="no" style="width:100%;max-width:340px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:11px;color:rgba(255,255,255,.72);font-size:14px;font-weight:800">Cancel</button>';
      cf.addEventListener('click', function(e){
        var b = e.target.closest('button[data-cf]'); if (!b) return;
        if (b.getAttribute('data-cf') === 'no') { cf.remove(); return; }
        mkTake('all');
      });
      document.body.appendChild(cf);
    };
    ov.addEventListener('click', function(e){
      /* ⭐⭐ B-239 (v1.43, s280) — tested FIRST, above the pick branch, so the way
         out can never be read as a card choice. ⛔ Posts no score and writes no
         ?mp into the URL. ⚠ It does NOT release the FR-161 claim the LOOKUP
         already took — no golfer-reachable release exists (FR-171). */
      if (e.target.closest('button[data-mkout]')) { ltRelease(code); location.href = location.pathname; return; }   /* FR-171 (v1.45) — hand the claim back */
      var b = e.target.closest('button[data-mp]'); if (!b) return;
      var pick = b.getAttribute('data-mp');
      if (pick === 'all') { mkAllConfirm(); return; }
      mkTake(pick);
    });
    document.body.appendChild(ov);
  }
  var mkName = null;
  /* v1.40 \u00b7 FR-162 \u2014 'all' is the WHOLE-GROUP sentinel, never a roster_id.
     Skipping the block explicitly keeps scope = players; do NOT lean on the
     old accident that oi stayed -1 and fell through. */
  if (f.card_swap === 'marker' && S.mp && String(S.mp) !== 'all') {
    var oi = -1;
    for (var i=0;i<players.length;i++) if (String(players[i].roster_id) === String(S.mp)) oi = i;
    if (oi >= 0 && players.length > 1) {
      /* v1.3 \u00b7 B-54 (Bruce s80, repro 135478): the marker column was a REAL
         entry column posting real rows \u2014 Cal's 18 landed off Joel's card while
         Cal's own card was blank. The worker has no marker-score concept, so
         digital entry is the OFFICIAL ONLY; the marker stays a named identity
         (paper Marker Scores strip is the attest), never a submit column. */
      mkName = players[(oi - 1 + players.length) % players.length].name;
      scope = [players[oi]];
    }
  }
  S.cols = scope.map(function(p){
    return {
      key: 'r' + p.roster_id,
      label: p.name,
      sub: (p.handicap != null ? 'Hcp ' + p.handicap : ''),
      post: { url: API + '/api/scores/round',
              body: { group_code: f.code, player_name: p.name, handicap: p.handicap || 0,
                      /* ⭐ v1.32 · FR-101 — p.tee is the join payload's EFFECTIVE deck
                         (fr52EffectiveTee: his own chosen/overridden deck when he has
                         one, the round tee otherwise). Sending f.tee here would let
                         the FR-52 COALESCE write the round default OVER a deck chosen
                         at claim time — the clobber Bruce's s211 tee question is about. */

                      group_id: p.group_id || null, roster_id: p.roster_id,
                      device: ltDev()   /* \u2b50 FR-161 (v1.42) \u2014 claim + heartbeat; a non-holder save is 409 and flush() surfaces the sentence */ } }
    };
  });

  // seed from the worker's existing scores so a resumed card isn't blank
  var ex = d.existing_scores || {};
  S.cols.forEach(function(c, i){
    var rid = scope[i].roster_id, have = ex[rid];

  });

      : 'Your card<small>' + esc(scope.map(function(p){return p.name;}).join(' \u00b7 ')) + '</small>');
  ltDupWarn(players, ex);
  if (S.held) { var _fw = $('forWho'); if (_fw) _fw.innerHTML += '<small style="color:#e8a9a9;font-weight:800">\ud83d\udc40 Another phone is already scoring this card.</small>'; }   /* \u2b50 FR-161 (v1.42) */          /* v1.40 · FR-162b — warn if this card already has holes on it */
  $('btnMg').style.display = '';   /* v1.34 · FR-112 — the phone that holds this card can fix it */
  if (f.mode) _rndMode = f.mode;   /* v1.10 \u00b7 B-64 */
  ltCourseTag(S.courseId, ['Round ' + (f.round_number || 1), f.start_time || '', f.date || '']);   // ⭐ s87 · course name
  if (S.evCode) tickArm();                      // v1.4 \u00b7 ticker on individual cards

/* --- v1.29 · FR-28 — TRIP foursome card: POST /api/trips/:id/rounds/:rid/scores

    };

  // seed from the worker's existing scores so a resumed card isn't blank
  var ex = d.existing_scores || {};
  S.cols.forEach(function(c, i){
    var have = ex[players[i].trip_player_id];
    if (have) { S.sc[c.key] = {}; Object.keys(have).forEach(function(h){ S.sc[c.key][Number(h)] = have[h]; }); }

/* --- v1.32 · FR-101 · pick your team off a round-level code ------------ */
/* Bruce, s209: "the tee group for lauber is the team - so if I use LITE and I
   select 5 players - those 5 players become a team." The scorer types the
   EVENT's own code, sees tonight's whole field, and picks his men. The claim
   hands back a REAL card code (worker v3.22.0 mints the same rows the
   tee-sheet builder writes), and this phone re-enters through the front door
   on that code — startRound, resume, locks and boards all untouched. One
   engine, every caller.

   same id, never a second kind of door (trap 42).

   s210) and names his team. The worker re-checks server-side — a greyed
   button on a stale phone is only half a guard (trap 36).
   ⭐ A 409 on the claim is a NORMAL outcome, not an error screen: another
   phone took a man while this one was looking. Re-fetch, re-render, pick
   again.

function startField(d, code, errMsg){

    + (rd.round_number ? ' · Round ' + rd.round_number : '') + (rd.date ? ' · ' + esc(rd.date) : '')
    + '<br>Tap up to ' + maxPick + ' players — this phone keeps their card.</div>';
  if (errMsg) h += '<div style="font-size:12.5px;color:#e8a9a9;text-align:center;max-width:340px;font-weight:700">' + esc(errMsg) + '</div>';
  if (savedCode) h += '<button id="fpResume" style="width:100%;max-width:340px;padding:12px;background:rgba(120,190,120,.16);border:1.5px solid rgba(120,190,120,.55);border-radius:11px;color:#d7f5d7;font-size:14px;font-weight:900">Resume this phone’s card</button>';
  h += field.map(function(p){
    var c = claimed[String(p.roster_id)];

      return '<button disabled style="width:100%;max-width:340px;padding:12px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:11px;color:rgba(255,255,255,.35);font-size:14px;font-weight:700;cursor:default">'
        + esc(p.name) + ' <span style="font-weight:400;font-size:12px">— on ' + esc(c.team_name) + '</span></button>';
    }
    return '<button data-fp="' + p.roster_id + '" style="width:100%;max-width:340px;padding:12px;background:rgba(201,168,76,.14);border:1.5px solid rgba(201,168,76,.5);border-radius:11px;color:#f5e6b8;font-size:14px;font-weight:900">'
      + esc(p.name) + (p.handicap != null ? ' <span style="font-weight:400;font-size:12px">Hcp ' + p.handicap + '</span>' : '') + '</button>';

     phone must score ONE card, or the event gets a second surface per team
     (the MIN caveat). A slot code can't say which card you hold, so ask.
     ?tg= (set by the pick, kept on reload) or a single team skips the ask.
     Non-pair events keep the one-paper-card-two-teams behaviour. */
  if (f.card_swap === 'pair' && teams.length > 1 && !S.tg) {
    var ov = document.createElement('div');
    ov.id = 'tgPick';
    ov.style.cssText = 'position:fixed;inset:0;z-index:90;background:#0d1f0b;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px';
    ov.innerHTML = '<div style="font-size:17px;font-weight:900;color:#f5e6b8;margin-bottom:2px">Whose card are you holding?</div>'
      + '<div style="font-size:12.5px;color:rgba(255,255,255,.55);margin-bottom:8px;text-align:center">This is a card-swap round \u2014 each team\u2019s card is scored by the other team. Pick the team named on the card in your hand.</div>'
      + teams.map(function(t){ return '<button data-g="' + t.group_id + '" style="width:100%;max-width:340px;padding:14px;background:rgba(201,168,76,.14);border:1.5px solid rgba(201,168,76,.5);border-radius:11px;color:#f5e6b8;font-size:15px;font-weight:900">' + esc(t.name || 'Team') + '</button>'; }).join('')
      /* v1.40 \u00b7 FR-162 \u2014 the team half of the same door. */
      + '<div style="font-size:11.5px;font-weight:800;color:rgba(255,255,255,.32);margin:8px 0 2px;letter-spacing:.08em">\u2014 OR \u2014</div>'
      + '<button data-g="all" style="width:100%;max-width:340px;padding:14px;background:rgba(120,190,110,.16);border:1.5px solid rgba(120,190,110,.55);border-radius:11px;color:#dff3d8;font-size:15px;font-weight:900">Score for all teams</button>';
    var tgTake = function(pick){
      S.tg = pick;
      try { var u = new URL(location.href); u.searchParams.set('code', S.code); u.searchParams.set('tg', S.tg); history.replaceState(null, '', u); } catch (e2) {}
      var old = document.getElementById('tgAllCf'); if (old) old.remove();
      ov.remove();
      startRoundTeams(d, teams); renderCard(); flush();
    };
    /* v1.40 \u00b7 FR-162 \u2014 same confirm as the roster picker. */
    var tgAllConfirm = function(){
      if (document.getElementById('tgAllCf')) return;
      var cf = document.createElement('div');
      cf.id = 'tgAllCf';
      cf.style.cssText = 'position:fixed;inset:0;z-index:91;background:rgba(4,14,4,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px';
      cf.innerHTML = '<div style="font-size:16.5px;font-weight:900;color:#f5e6b8;text-align:center;line-height:1.5;max-width:340px">You will be scoring officially for all ' + teams.length + ' teams \u2014 please confirm.</div>'
        + '<div style="font-size:12.5px;color:rgba(255,255,255,.62);text-align:center;max-width:340px;line-height:1.65;margin-bottom:4px">' + esc(teams.map(function(t){ return t.name || 'Team'; }).join(' \u00b7 ')) + '</div>'
        + '<button data-cf="go" style="width:100%;max-width:340px;padding:14px;background:rgba(120,190,110,.18);border:1.5px solid rgba(120,190,110,.6);border-radius:11px;color:#dff3d8;font-size:15px;font-weight:900">Confirm</button>'
        + '<button data-cf="no" style="width:100%;max-width:340px;padding:12px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:11px;color:rgba(255,255,255,.72);font-size:14px;font-weight:800">Cancel</button>';
      cf.addEventListener('click', function(e){
        var b = e.target.closest('button[data-cf]'); if (!b) return;
        if (b.getAttribute('data-cf') === 'no') { cf.remove(); return; }
        tgTake('all');
      });
      document.body.appendChild(cf);
    };
    ov.addEventListener('click', function(e){
      var b = e.target.closest('button[data-g]'); if (!b) return;
      var pick = b.getAttribute('data-g');
      if (pick === 'all') { tgAllConfirm(); return; }
      tgTake(pick);
    });
    document.body.appendChild(ov);
  }
  /* v1.40 \u00b7 FR-162 \u2014 'all' is the whole-card sentinel, never a group_id. */
  if (S.tg && String(S.tg) !== 'all') {
    var picked = teams.filter(function(t){ return String(t.group_id) === String(S.tg); });
    if (picked.length) teams = picked;
  }
  S.holes = holeOrder(S.startHole);
  S.cols = teams.map(function(t){
    var roster = t.team_players || [];
    var label  = (roster[0] && roster[0].name) || t.name || 'Team';
    return {
      key: 'g' + t.group_id,
      label: t.name || 'Team',
      sub: roster.map(function(p){ return p.name; }).join(' · '),
      post: { url: API + '/api/scores',
              body: { group_code: t.group_code, player_name: label,
                      handicap: 0, tee: f.tee || 'white' } }
    };
  });
  S.ci = 0;                        // D66 · new card — back to the first chip
  $('forWho').innerHTML = (S.cols.length > 1
      ? 'This card holds ' + S.cols.length + ' teams — enter both.'
      : 'Your card: ' + esc(S.cols[0].label)) +
    '<small>' + esc(S.cols.map(function(c){ return c.label; }).join('  ·  ')) + '</small>';
  ltCourseTag(S.courseId, ['Round ' + (f.round_number || 1),   // ⭐ s87 · course name
    (f.hole ? 'Start hole ' + f.hole : ''), f.start_time || '', f.date || '']);
  // handleJoinRound carries no event_code, so borrow it from a team's own
  // group join — one extra GET, fail-soft, ticker simply stays off on error.
  if (f.event_code){ S.evCode = f.event_code; tickArm(); }   // v1.4 \u00b7 worker v2.82.0+ carries it \u2014 no borrow needed
  else jfetch(API + '/api/join/' + encodeURIComponent(teams[0].group_code))
    .then(function(r){
      var ec = r.ok && r.data && r.data.group && r.data.group.event_code;
      if (ec){ S.evCode = ec; tickArm(); }
    })
    .catch(function(){});
}

function holeOrder(start){
  var o = [], s = (start>=1 && start<=18) ? start : 1;
  for (var i=0;i<18;i++) o.push(((s - 1 + i) % 18) + 1);
  return o;
}

/* ---------- entry UI ---------------------------------------------------- */
function renderCard(){
  $('vCode').classList.add('hide');
  $('vCard').classList.remove('hide');
  $('evName').textContent = S.evName;
  /* v1.10 \u00b7 Bruce s82: 'Open full app' pill removed for now. */
  // resume where they left off: first hole with nothing entered
  var seen = 0;
  for (var i=0;i<S.holes.length;i++){
    var h = S.holes[i], any = false;
    for (var c=0;c<S.cols.length;c++) if (val(S.cols[c].key,h)) any = true;
    if (any) seen = i + 1;
  }
  S.hi = Math.min(seen, 17);
  renderHole();
  if (S.evCode) tickArm();
  wxArm();                                     // v1.7 \u00b7 course weather
}

function val(key,h){ return (S.sc[key] && S.sc[key][h]) || 0; }
function setVal(key,h,v){ if(!S.sc[key]) S.sc[key] = {}; if (v) S.sc[key][h] = v; else delete S.sc[key][h]; persist(); }

/* v1.2 — recorded-scores grid. `get(h)` returns the gross for hole h.
   Standard 1–18 card layout (what a golfer reads) even on a shotgun, with
   OUT / IN / TOT. `clickable` wires each cell to jump the entry pad there. */
function scoreGrid(get, clickable, curHole, pars){
  function nine(from){
    var lab = '', val = '', sum = 0, any = false;
    for (var i=from;i<from+9;i++){
      var h = i + 1, v = get(h) || 0;
      if (v){ sum += v; any = true; }
      lab += '<td>' + h + '</td>';
      val += '<td class="' + (v ? '' : 'e') + (h === curHole ? ' cur' : '') + '"' +
             (clickable ? ' data-h="' + h + '"' : '') + '>' + mkScore(v, h, pars) + '</td>';
    }
    lab += '<td class="sum">' + (from === 0 ? 'OUT' : 'IN') + '</td>';
    val += '<td class="sum">' + (any ? sum : '–') + '</td>';
    return { lab: lab, val: val, sum: any ? sum : null };
  }
  var o = nine(0), n = nine(9);
  var tot = (o.sum || 0) + (n.sum || 0);
  return '<div class="scg"><table>' +
    '<tr class="h">' + o.lab + '<td class="sum"></td></tr>' +
    '<tr class="v">' + o.val + '<td class="sum"></td></tr>' +
    '<tr class="h">' + n.lab + '<td class="sum">TOT</td></tr>' +
    '<tr class="v">' + n.val + '<td class="sum">' + (tot || '–') + '</td></tr>' +
    '</table></div>';
}

/* ⭐ D66 · v1.12 — v1.11's per-column block, extracted VERBATIM so the
   single-pad path and the N=1 path emit the same markup. The N=1 render must
   stay byte-identical to v1.11 (Bruce, s83) — do not "improve" this. */
function padBlock(c, h){
  var out = '';
    var col = S.cols[c], cur = val(col.key,h);
    out += '<div class="pl"><div class="plname"><span>' + esc(col.label) + '</span>' +
           (col.sub ? '<i>' + esc(col.sub) + '</i>' : '') + '</div><div class="pad">';
    for (var n=1;n<=9;n++){
      out += '<button data-c="' + c + '" data-v="' + n + '" class="' + (cur===n?'on':'') + '">' + n + '</button>';
    }
    out += '<button data-c="' + c + '" data-v="0" class="clr">clear</button>';
    out += '</div>' + tailBlock(c, h) + '</div>';   /* ⭐ FR-13 — thru/total + grid moved to tailBlock, shared with the row surface */
  return out;
}

/* ⭐ B-68 (s86, live) — the chip-name shortener USED to cut a two-token name to
   first + last initial, so "Mark Comeau" and "Mark Curley" BOTH rendered
   "Mark C" — two players, one label, on the exact widget whose job is to tell
   them apart. DELETED in v1.13: the chip renders the FULL label, nowrap +
   CSS ellipsis. Do NOT re-introduce a shortener. */

/* ⭐ D68 (s86) — first column with no score on hole h, or null. Used ONLY to
   block a FORWARD hole change at N>=2. */
function firstMissing(h){
  var miss = [];
  for (var i=0;i<S.cols.length;i++) if (!val(S.cols[i].key, h)) miss.push(S.cols[i].label);
  return miss.length ? { name: miss[0], more: miss.length - 1 } : null;
}

/* ⭐⭐ D68 (s86) — EVERY hole change goes through here and S.ci ALWAYS returns
   to chip 1, so a new hole opens in the same place every single time. Bruce
   asked for this AFTER scoring a live fivesome on v1.12; it deliberately
   SUPERSEDES D66 Q3 ("the active chip never moves on its own"). Do not
   "restore" the never-moves rule in a later session.
   fwd=true applies the D68 missing-score guard — hPrev is NEVER guarded, and
   N=1 is NEVER guarded (v1.11 single-player behaviour is still frozen). */
function goHole(i, fwd){
  if (i < 0 || i > 17) return;
  if (fwd && S.cols.length > 1){
    var m = firstMissing(S.holes[S.hi]);
    if (m){ sync('missing score for ' + m.name + (m.more ? ' (+' + m.more + ' more)' : ''), 'bad'); return; }
  }
  S.hi = i;
  S.ci = 0;
  renderHole();
}

/* ⭐ FR-13 (s99) — one row per player: left/right arrows change THAT player's
   score for the hole in play, the centre is the active-player tap target
   (mustard = active, dashed = no score yet, exactly as the chip read). */
function rowBlock(h){
  var out = '<div class="rws">';
  for (var i=0;i<S.cols.length;i++){
    var cv = val(S.cols[i].key,h);
    out += '<div class="rw">' +
      '<button class="ar" data-ci="' + i + '" data-d="-1"' + (cv===1?' disabled':'') + '>&lsaquo;</button>' +
      '<button class="rwc' + (i===S.ci?' cact':'') + (cv?'':' cun') + '" data-ci="' + i + '">' +
      '<span>' + esc(S.cols[i].label) + '</span><b>' + (cv || '\u2013') + '</b></button>' +
      '<button class="ar" data-ci="' + i + '" data-d="1"' + (cv>=15?' disabled':'') + '>&rsaquo;</button></div>';
  }
  return out + '</div>';
}

/* ⭐ FR-13 — the thru/total line + recorded-scores grid, lifted VERBATIM out of
   padBlock so the row surface and the frozen N=1 pad emit identical markup. */
function tailBlock(c, h){
  var col = S.cols[c], tot = 0, thru = 0;
  for (var k=1;k<=18;k++){ var v = val(col.key,k); if (v){ tot += v; thru++; } }
  var tp = null, pa = parArr(S.courseId);
  if (pa && thru){ tp = 0; for (var k2=1;k2<=18;k2++){ var v2 = val(col.key,k2); if (v2) tp += v2 - pa[k2-1]; } }
  return '<div class="tot"><span>Thru ' + thru + (tp===null?'':' &nbsp;' + fmtToParC(tp)) + '</span><span>Total <b>' + (tot||'\u2013') + '</b></span></div>' +
    scoreGrid((function(k){ return function(hh){ return val(k, hh); }; })(col.key), true, h, parArr(S.courseId))
      .replace('<div class="scg">', '<div class="scg" data-col="' + c + '">');
}

/* FR-182 (v1.47, s286) -- the tee-shot picker on a Lite team card. Same rules
   as the client: gate on the FACT, amber when a man can no longer reach the
   minimum in the unassigned holes, NEVER block a score (s275). POSTs are
   fire-and-forget; local S.drv is the card's truth and /api/join restores it
   on any phone (worker v3.52.0 clears on toggle-off). */
function ltDrvBlock(h){
  if (!S.drvOn || !S.drvNames.length) return '';
  var cur = S.drv[h] || null, used = {}, total = 0;
  Object.keys(S.drv).forEach(function(k){ var nm = S.drv[k]; if (nm){ used[nm] = (used[nm]||0)+1; total++; } });
  var left = 18 - total;
  var out = '<div style="margin:10px 2px 4px;padding:9px 11px;background:rgba(100,180,255,.07);border:1px solid rgba(100,180,255,.25);border-radius:12px">';
  out += '<div style="font-size:10px;font-weight:800;color:rgba(100,180,255,.75);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">\ud83c\udfcc\ufe0f Tee shot' + (S.drvMin > 0 ? ' \u00b7 min ' + S.drvMin + ' each' : '') + '</div>';
  out += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  S.drvNames.forEach(function(nm){
    var sel = cur === nm;
    out += '<button data-drv="' + esc(nm) + '" style="padding:7px 12px;border-radius:8px;border:' + (sel ? '1.5px solid rgba(100,180,255,.85)' : '1px solid rgba(255,255,255,.15)') + ';background:' + (sel ? 'rgba(100,180,255,.3)' : 'rgba(255,255,255,.05)') + ';color:' + (sel ? '#aad4ff' : 'rgba(255,255,255,.55)') + ';font-size:12px;font-weight:700;-webkit-tap-highlight-color:transparent">' + esc(nm) + '</button>';
  });
  out += '</div>';
  if (total > 0 || S.drvMin > 0) {
    out += '<div style="margin-top:6px;font-size:10px;color:rgba(100,180,255,.55)">';
    S.drvNames.forEach(function(nm){
      var c = used[nm] || 0;
      var short = S.drvMin > 0 && c < S.drvMin && (S.drvMin - c) > left;
      out += '<span style="' + (short ? 'color:#ffb08a;font-weight:800' : (S.drvMin > 0 && c >= S.drvMin ? 'color:#7fbf7f' : '')) + '">' + esc(nm) + ':' + c + (short ? ' \u26a0' : '') + '</span> ';
    });
    out += '</div>';
  }
  return out + '</div>';
}
function ltDrvPick(h, nm){
  if (!S.drvOn) return;
  if (S.drv[h] === nm) delete S.drv[h]; else S.drv[h] = nm;
  persist();
  try {
    if (S.drvCode) jfetch(API + '/api/tee-shots', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_code: S.drvCode, hole: h, player_name: (S.drv[h] || ''), recorded_by: 'Pards Lite', clear: !S.drv[h] }) }).catch(function(){});
  } catch (e) {}
  renderHole();
}

function renderHole(){
  try { doneCheck(); } catch (eD) {}   /* v1.23 · B-80 — a RESUMED finished card never flushes, so the flush-path doneCheck never ran and "Score another card" was unreachable. Every paint re-evaluates now. */
  var h = S.holes[S.hi], p = parOf(h);
  $('hNum').textContent = h;
  $('hPar').textContent = p ? ('PAR ' + p) : ('HOLE ' + (S.hi+1) + ' OF 18');
  $('hPrev').disabled = S.hi === 0;
  $('hNext').disabled = S.hi === 17;
  /* ⭐⭐ FR-13 (s99) — N>=2 is the STACKED ROW surface: one row per player,
     arrows score that row directly, the row itself is the active-player tap
     target, and the recorded-scores grid below follows the active row.
     SUPERSEDES D66 (one pad, the player moves to the pad) and D68's clockwise
     cycle — an arrow tap selects its OWN row, so nothing auto-advances under
     your thumb. D68's forward missing-score guard on hNext is UNCHANGED.
     N=1 falls through to the frozen v1.11 single-pad path below. */
  if (S.cols.length > 1){
    if (S.ci >= S.cols.length || S.ci < 0) S.ci = 0;
    var allIn = true;
    for (var i=0;i<S.cols.length;i++) if (!val(S.cols[i].key,h)) allIn = false;
    $('hPar').className = allIn ? 'done' : '';   // quiet gold hairline, no motion
    var ac = S.cols[S.ci];
    $('entry').innerHTML = rowBlock(h) +
      '<div class="pl"><div class="plname"><span>' + esc(ac.label) + '</span>' +
      (ac.sub ? '<i>' + esc(ac.sub) + '</i>' : '') + '</div>' + tailBlock(S.ci, h) + '</div>';
    return;
  }
  var out = '';
  for (var c=0;c<S.cols.length;c++) out += padBlock(c, h);
  /* FR-182 (v1.47) -- the tee-shot picker rides the team card's hole view */
  if (S.mode === 'group' && S.drvOn) { try { out += ltDrvBlock(h); } catch (eDrv) {} }
  $('entry').innerHTML = out;
}

$('entry').addEventListener('click', function(e){
  if (S.held) { sync('Another phone is already scoring this card.', 'bad'); return; }
  /* FR-182 (v1.47) -- a tee-shot pill toggles that hole's drive */
  var drvBtn = e.target.closest && e.target.closest('button[data-drv]');
  if (drvBtn) { ltDrvPick(S.holes[S.hi], drvBtn.getAttribute('data-drv')); return; }   /* \u2b50 FR-161 (v1.42) \u2014 read-only; exits/board/manage all still work */
  // v1.2 — tap any hole in the recorded-scores grid to jump the pad there
  var cell = e.target.closest && e.target.closest('.scg td[data-h]');
  if (cell) {
    var want = Number(cell.getAttribute('data-h'));
    /* ⭐ D68 — a grid jump is a hole change: chip 1 reset, and a FORWARD jump
       takes the same missing-score guard as hNext. */
    for (var i=0;i<S.holes.length;i++) if (S.holes[i] === want) { goHole(i, i > S.hi); return; }
    return;
  }
  /* ⭐⭐ FR-13 (s99) — an arrow steps THAT row's score for the hole in play and
     makes the row active. A blank row steps from PAR (Bruce, s99), so the first
     tap lands on a plausible number instead of 1. Clamped 1..15 — which also
     lifts the old pad's hard 9 ceiling. Must be tested BEFORE data-ci: every
     arrow carries data-ci too, so the row-tap branch would swallow it. */
  var ar = e.target.closest && e.target.closest('button[data-d]');
  if (ar) {
    var ai = Number(ar.getAttribute('data-ci')), ad = Number(ar.getAttribute('data-d'));
    var acol = S.cols[ai], ah = S.holes[S.hi], av = val(acol.key, ah);
    var anv = Math.max(1, Math.min(15, (av || (parOf(ah) || 4) - ad) + ad));
    S.ci = ai;
    setVal(acol.key, ah, anv);
    renderHole();
    queueSend(acol, ah, anv, true);   /* deferred flush — a run of taps is ONE POST */
    return;
  }
  // ⭐ D66/D68/FR-13 · tapping a row moves the active column explicitly; the
  // recorded-scores grid below follows it
  var chip = e.target.closest && e.target.closest('button[data-ci]');
  if (chip) { S.ci = Number(chip.getAttribute('data-ci')); renderHole(); return; }
  var b = e.target.closest && e.target.closest('button[data-c]');
  if (!b) return;
  var c = Number(b.getAttribute('data-c')), v = Number(b.getAttribute('data-v'));
  var col = S.cols[c], h = S.holes[S.hi];
  // ⭐ v1.2 — tapping the SAME number again toggles the hole off. Guard on the
  // NEW value, not the button: `if (v)` used to queue a gross_score of 0.
  var nv = (val(col.key,h) === v) ? 0 : v;
  setVal(col.key, h, nv);
  /* ⭐ FR-13 (s99) — D68's clockwise cycle is GONE: the pad is now the N=1
     surface only, and N=1 never cycled. Every N>=2 card uses the row arrows. */
  renderHole();
  if (nv) queueSend(col, h, nv);
  else    sync('Cleared — hole ' + h + ' keeps its last saved value on the server.', 'bad');
});
$('hPrev').addEventListener('click', function(){ goHole(S.hi - 1, false); });  // ⭐ D68 · back is NEVER guarded
$('hNext').addEventListener('click', function(){ goHole(S.hi + 1, true);  });  // ⭐ D68 · forward checks every chip has this hole

/* ---------- submit + retry queue ---------------------------------------- */
function persist(){ if (QKEY) lsSet(QKEY, { sc: S.sc, hi: S.hi, drv: S.drv }); }   /* FR-182 -- drives ride the same blob */
function qLoad(){ return lsGet(QKEY + ':q') || []; }
function qSave(q){ lsSet(QKEY + ':q', q); }

function sync(msg, cls){ var e = $('syncMsg'); e.textContent = msg || ''; e.className = 'sync' + (cls ? ' ' + cls : ''); }

/* ⭐ FR-13 (s99) — `defer` batches a RUN of arrow taps into one POST. The
   queue write is never deferred, only the flush: a phone closed mid-run still
   has the score in localStorage AND in the queue, so the tick sends it. */
var _qfT = null;
function queueSend(col, hole, gross, defer){
  var q = qLoad();
  q = q.filter(function(it){ return !(it.key === col.key && it.hole === hole); });
  q.push({ key: col.key, hole: hole, gross: gross, t: Date.now() });
  qSave(q);
  if (defer){ clearTimeout(_qfT); _qfT = setTimeout(flush, 700); return; }
  clearTimeout(_qfT);
  flush();
}

var _flushing = false;
function flush(){
  var q = qLoad();
  if (!q.length){ sync('All scores saved.', 'ok'); return Promise.resolve(); }
  if (_flushing) return Promise.resolve();
  _flushing = true;
  sync('Saving ' + q.length + ' hole' + (q.length>1?'s':'') + '…');
  // one POST per column, carrying every queued hole for that column
  var byCol = {};
  q.forEach(function(it){ (byCol[it.key] = byCol[it.key] || []).push(it); });
  var jobs = Object.keys(byCol).map(function(key){
    var col = null; for (var i=0;i<S.cols.length;i++) if (S.cols[i].key === key) col = S.cols[i];
    if (!col) return Promise.resolve({ key: key, ok: true });

/* ⭐ s89 · ONE tap path for the strip and the button. The strip can now be

   two handlers would be two things to keep in step. */
function ltBoardTap(){
  /* ⭐ B-117 — same widening as the ticker: a cache full of zero-rows must not
     count as a board. ltRoundLb fails soft, and its nb() still reaches the team
     list below, so a scramble's pre-round roster stays tappable. */
  if (ltLive(_st)){ lbOpen(); return; }
  if (S.evId && S.rndId){ ltRoundLb(); return; }
  if (S.mode === 'trip' && S.tripId && S.pin){ ltTripLb(); return; }
  if (_st && _st.length){ lbOpen(); return; }
  sync('No standings yet — your scores ARE saving. Full standings at pardstour.com');
}
$('btnLb').addEventListener('click', function(){ ltBoardTap(); });

/* ⭐⭐ B-69 · the individual round board. GET /api/events/:eid/rounds/:rid/
   leaderboard is public (handleRoundLeaderboard, worker v2.76.0) — one row per
   player with gross, net and scores_by_hole. Team/scramble cards do NOT use
   this path; event 93's board works off _st and stays there. ⭐ v1.33 (B-188):
   the worker's ORDER is printed as-is — format-aware, decided there, never
   re-sorted here; NO client-side stableford, and now no client-side ranking. Fail-soft:
   any miss falls back to the v1.14 message and the card never hangs. */
function ltRoundLb(quiet){
  var nb = function(){
    if (quiet) return;                            /* ⭐ s89 · a ticker poll NEVER speaks to the card */
    if (_si && _si.length){ lbOpen(_si); return; } /* ⭐ s89 · the strip is showing rows — "no board" would contradict it */
    if (_st && _st.length){ lbOpen(); return; }    /* ⭐ B-117 · no round board (pre-round, or DDL absent) — the team list is still the honest answer */
    sync('No standings yet — your scores ARE saving. Full standings at pardstour.com'); };
  jfetch(API + '/api/events/' + S.evId + '/rounds/' + S.rndId + '/leaderboard')
    .then(function(r){
      var d = r.ok ? r.data : null;
      var st = (d && !d.unavailable && d.standings && d.standings.length) ? d.standings.slice() : null;
      if (!st){ nb(); return; }
      /* ⭐⭐⭐ B-188 (v1.33, s216) — THE RE-SORT IS GONE. THE WORKER'S ORDER IS PRINTED AS-IS.
         Bruce, mid-round, on a stableford night: "why is this not sorted properly - most points
         first". It was sorted — by NET ASCENDING (his own s87 ruling, hard-coded here) — while the
         strip PRINTED the pts column. A net-ordered list wearing a points label.
         ⛔ The worker already orders this payload correctly and has all along:
              holes_played DESC, then points DESC, gross ASC
            — except individual_low_gross (gross ASC) and individual_low_net (net ASC), chosen from
            the ROUND'S FORMAT by RLB_STROKE_RANK. Re-sorting here threw that away and replaced a
            format-aware order with one hard-coded key.
         ⭐ Deleting the sort is the whole fix, and it is the rule the TRIP board in this same file
         already states in its own words: "the worker's standings are printed as-is... Slicing one
         round out of it here would be a second engine, and that is the mistake this project keeps
         paying for." Same file, two doors — this one was the wrong one (trap 42).
         ⭐ s87's ruling is not overturned, it is DELEGATED: a low-net round still comes back
         net-ascending, because the worker decides that from the format instead of this line
         assuming it. Both of his sentences are now true at once.
         ⚠ Men are grouped by HOLES PLAYED first, so a man thru 4 sits above a man thru 2 whatever
         the points — comparing men on unequal holes is the thing the worker deliberately refuses to
         do. Choosing another basis is FR-109 (the selectable ticker sort), not this line. */
      _si = st;                                   /* ⭐ s89 · only a NON-EMPTY read is ever cached */
      _at = st.reduce(function(m, x){ return (x.updated_at && x.updated_at > m) ? x.updated_at : m; }, '') || _at;
      if (quiet) tickRender(); else lbOpen(st);
    })
    .catch(nb);
}
/* FR-60 (v1.30) - the TRIP board. startTrip nulls evCode, evId and rndId on
   purpose, so ALL THREE of ltBoardTap's rails were off and a trip card's
   Leaderboard button could only ever produce the fallback line. Measured s152:
   GET /api/trips/:id/leaderboard takes ?pin= (viewer_pin) with NO org token,
   and handleJoinTrip has carried viewer_pin in the foursome payload all along -
   Lite simply threw it away. No worker change.
   NO client-side scoring: the worker's standings are printed as-is. This is the
   WHOLE-TRIP board by points, which is what that endpoint serves. Slicing one
   round out of it here would be a second engine, and that is the mistake this
   project keeps paying for. Fail-soft: any miss falls back to the same honest
   line, and the card never hangs. */
function ltTripLb(){
  var nb = function(){ sync('No standings yet - your scores ARE saving. Full standings at pardstour.com'); };
  if (!S.tripId || !S.pin){ nb(); return; }
  jfetch(API + '/api/trips/' + S.tripId + '/leaderboard?pin=' + encodeURIComponent(S.pin))
    .then(function(r){
      var d = r.ok ? r.data : null;
      var st = (d && d.standings && d.standings.length) ? d.standings : null;
      if (!st){ nb(); return; }
      var h = '<table class="lbt"><tr><th>#</th><th>Player</th><th style="text-align:right">Pts</th><th style="text-align:right">Gross</th><th style="text-align:right">Net</th></tr>';
      for (var j=0;j<st.length;j++){
        var p = st[j];
        h += '<tr><td>' + (j+1) + '</td><td>' + esc(p.name || 'Player') + '</td><td class="n">' +
             (p.total_pts == null ? '\u2013' : p.total_pts) + '</td><td class="n">' +
             (p.total_gross || '\u2013') + '</td><td class="n">' + (p.total_net || '\u2013') + '</td></tr>';
      }
      h += '</table><div style="font-size:11px;color:rgba(255,255,255,.35);margin-top:8px">Trip standings \u00b7 every round, by points.</div>';
      $('lbTitle').textContent = S.evName;
      $('lbClock').textContent = '';
      $('lbBody').innerHTML = h;
      $('lb').style.display = 'block';
    })
    .catch(nb);
}

/* B-135 (v1.30) - THE CARD HAD NO EXIT. The only way out was #newCard, which
   lives inside #doneBar, and doneCheck() reveals that bar ONLY when every
   column has every hole scored AND the queue is empty. Mid-round there was no
   way back to the code prompt on ANY card type - team, tee-time or trip - since
   v1.10/D63. Bruce found it on the FR-28 walk, s152.
   Same clean-reload mechanism as #newCard: scores live in localStorage under
   QKEY and re-entering the code restores them, so nothing is lost.
   The queue guard is the whole point of the confirm - unsent holes have NOT
   reached the tournament and a reload does not send them. */
$('btnExit').addEventListener('click', function(){
  var q = qLoad().length;
  if (q && !confirm(q + ' hole' + (q > 1 ? 's have' : ' has') + ' not reached the tournament yet. They stay saved on this phone, but leaving will not send them. Leave the card?')) return;
  ltRelease(S.mode === 'round' ? S.code : null);   /* FR-171 (v1.45) — only a tee-time card carries a claim */
  location.href = location.pathname;
});

$('btnMg').addEventListener('click', function(){ ltManage(null); });   /* v1.34 · FR-112 */
['lbClose','lbBack'].forEach(function(i){ $(i).addEventListener('click', function(){ $('lb').style.display = 'none'; }); });
$('newCard').addEventListener('click', function(){ ltRelease(S.mode === 'round' ? S.code : null); location.href = location.pathname; });

/* ⭐⭐⭐ B-259 (v1.49, s288) — THE FINISHED-CARD SHEET.
   ⛔ ONCE per finished card. A resumed finished card re-runs doneCheck() on EVERY
   paint (that is B-80's fix, v1.23) — without this key the sheet would reopen all
   afternoon on a man who is just looking at his scores.
   ⭐ The key is the card AND its shape, so genuinely finishing a different card
   announces itself again. */
var _b259Key = null;
function b259Show(){
  var el = $('b259'); if (!el) return;
  var k = String(S.code || S.tripId || '') + '|' + S.cols.length + 'x' + S.holes.length;
  if (_b259Key === k) return;
  _b259Key = k;
  var n = $('b259n');
  if (n) n.textContent = S.cols.length + (S.cols.length === 1 ? ' player' : ' players')
    + ' \u00d7 ' + S.holes.length + ' holes \u2014 '
    + (S.cols.length * S.holes.length) + ' scores in.';
  el.className = 'on';
}
function b259Hide(){ var el = $('b259'); if (el) el.className = ''; }
$('b259Back').addEventListener('click', b259Hide);
/* The scrim is a way out too (B-239). Only the scrim itself — never a tap that
   landed on the card. */
$('b259').addEventListener('click', function(e){ if (e.target === $('b259')) b259Hide(); });
/* ⛔ EVERY EXIT HANDS THE CARD BACK (FR-171). No confirm: this sheet only ever
   appears when doneCheck() has already proved the queue is empty. */
$('b259Close').addEventListener('click', function(){
  ltRelease(S.mode === 'round' ? S.code : null);
  location.href = location.pathname;
});
/* The green bar keeps its old job and gains one: it is the way BACK to the sheet. */
try {
  $('doneBar').style.cursor = 'pointer';
  $('doneBar').addEventListener('click', function(e){
    if (e.target && e.target.id === 'newCard') return;   /* its own button still wins */
    _b259Key = null; b259Show();
  });
} catch (e259b) {}   /* v1.10 \u00b7 D63 + FR-171 (v1.45) */   /* v1.10 \u00b7 D63 \u2014 clean reload, back to the code prompt */

/* ---------- boot -------------------------------------------------------- */
function boot(code, rid, mp, tg){
  S.mp = mp || null;
  S.tg = tg || null;                             // v1.5 \u00b7 B-58 \u2014 picked team card on a pair slot code
  QKEY = 'ptlite:' + code + (rid ? ':' + rid : '');
  $('codeErr').textContent = '';
  return resolve(code, rid).then(function(){
    if (S.mode === 'field') return;            /* v1.32 · FR-101 — pick screen is up; there is no card yet */
    var saved = lsGet(QKEY);
    if (saved && saved.sc) {                       // local wins for un-synced holes
      Object.keys(saved.sc).forEach(function(k){
        S.sc[k] = S.sc[k] || {};
        Object.keys(saved.sc[k]).forEach(function(h){ S.sc[k][Number(h)] = saved.sc[k][h]; });
      });
    }
    /* FR-182 (v1.47) -- un-synced local drives overlay the server restore */
    if (saved && saved.drv && S.drvOn) {
      Object.keys(saved.drv).forEach(function(h){ if (!S.drv[Number(h)]) S.drv[Number(h)] = saved.drv[h]; });
    }
    renderCard();
    flush();
  });
}

/* v1.41 · B-234 — the door's error line. Plain text for every failure, exactly
   as before; ONLY a view-only refusal (e.viewOnly, set in resolve() rail four)
   adds a Watch link to Pards Live on that same code — the code IS the Live
   View code, so the link is the honest next step. textContent first, so a
   worker sentence can never render as markup. */
function ltDoorErr(e, code){
  var el = $('codeErr');
  el.textContent = (e && e.message) || 'Could not open that card.';
  if (e && e.viewOnly && code) {
    var a = document.createElement('a');
    a.href = location.pathname.replace(/[^/]*$/, 'pards-live.html') + '?code=' + encodeURIComponent(code);
    a.textContent = 'Watch it on Pards Live \u2192';
    a.style.cssText = 'display:block;margin-top:8px;color:#c9a84c;font-weight:800;text-decoration:none';
    el.appendChild(a);
  }
}
$('codeGo').addEventListener('click', function(){
  var c = String($('codeIn').value || '').replace(/[^0-9A-Za-z]/g,'');
  if (c.length < 6){ $('codeErr').textContent = 'Enter the 6-digit code from your card.'; return; }
  $('codeGo').disabled = true; $('codeGo').textContent = 'Opening…';
  boot(c, null, null).catch(function(e){
    ltDoorErr(e, c);                             /* v1.41 · B-234 — a Live View code gets a Watch link */
    $('codeGo').disabled = false; $('codeGo').textContent = 'Start scoring';
  });
});
$('codeIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('codeGo').click(); });

(function(){
  var q = new URLSearchParams(location.search);
  var c = q.get('code'), rid = q.get('rid'), mp = q.get('mp'), tg = q.get('tg');
  if (c && /^[0-9A-Za-z]{6}$/.test(c)) {
    boot(c, rid, mp, tg).catch(function(e){
      ltDoorErr(e, c);                           /* v1.41 · B-234 */
      $('codeIn').value = c;
    });
  }
  try { document.getElementById('liteVer').textContent = 'Pards Lite \u00b7 ' + LITE_VERSION.replace('lite-',''); } catch (e) {}   // v1.6 \u00b7 Bruce s80: version visible on the code screen
  log(LITE_VERSION, 'ready');
})();
</script>
