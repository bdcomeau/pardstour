<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Pay · Pards Golf</title>
<link rel="icon" type="image/png" href="https://pardstour.com/icon-512.png"><link rel="apple-touch-icon" href="https://pardstour.com/apple-touch-icon.png">
<meta property="og:title" content="Pards Golf — pay up"><meta property="og:image" content="https://pardstour.com/icon-512.png"><meta property="og:image:width" content="512"><meta property="og:image:height" content="512">
<!-- FR-368 (s321) — THE PAY PAGE. A winner's QR / shared link lands here: the amount and his e-transfer address, nothing else.
     Static, no API, no storage. Pards Golf never moves money — the bank app does. -->
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1f14;color:#e9ede2;padding:22px 16px 30px;max-width:460px;margin:0 auto;text-align:center}
.k{font-size:11px;font-weight:800;color:rgba(201,168,76,.9);text-transform:uppercase;letter-spacing:.6px}.who{font-size:13px;color:rgba(233,237,226,.6);margin:8px 0 2px}.amt{font-size:56px;font-weight:900;color:#f5e6b8;line-height:1.1}.g{font-size:12px;color:rgba(233,237,226,.5);margin:4px 0 16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.35);border-radius:16px;padding:18px 14px}
.addr{background:#14260f;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left}.addr .l{font-size:10.5px;color:rgba(255,255,255,.45)}.addr .v{font-size:15px;font-weight:800;word-break:break-all;-webkit-user-select:all;user-select:all}.addr .b{padding:7px 11px;border-radius:8px;background:rgba(245,230,184,.12);border:1px solid rgba(245,230,184,.45);color:#f5e6b8;font-size:12px;font-weight:800;white-space:nowrap}
.how{font-size:12.5px;color:rgba(233,237,226,.6);margin-top:12px;line-height:1.55}.note{font-size:10.5px;color:rgba(233,237,226,.35);margin-top:16px;line-height:1.5}.warn{background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.4);border-radius:10px;padding:12px;font-size:13px;color:#e8a33d;line-height:1.5}
.badge{width:64px;height:64px;border-radius:14px;margin-bottom:6px}</style></head><body>
<img class="badge" src="https://pardstour.com/icon-192.png" alt="">
<div class="k">Pards Golf · pay up</div>
<div class="card" id="c"><div class="who">Loading…</div></div>
<div class="note">Pards Golf never moves money. This page shows the amount and where to send it — your bank app does the rest.</div>
<script>
(function(){
  var q={}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){ if(!kv) return; var i=kv.indexOf('='); var k=decodeURIComponent(i<0?kv:kv.slice(0,i)), v=decodeURIComponent(i<0?'':kv.slice(i+1).replace(/\+/g,' ')); q[k]=v; });
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var to=q.to||'', e=q.e||'', amt=Number(q.amt)||0, g=q.g||'', d=q.d||'';
  var c=document.getElementById('c');
  if(!to||!(amt>0)){ c.innerHTML='<div class="warn">This link is missing the name or the amount — ask the winner to share it again from Pards Golf.</div>'; return; }
  var when=''; try{ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d); if(m) when=new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}); }catch(_){}
  var h='<div class="who">Pay '+esc(to)+'</div><div class="amt">$'+(amt%1?amt.toFixed(2):String(amt))+'</div><div class="g">'+esc([g,when].filter(Boolean).join(' · '))+'</div>';
  if(e){ h+='<div class="addr" id="a"><div style="flex:1"><div class="l">e-transfer to</div><div class="v">'+esc(e)+'</div></div><div class="b" id="b">Copy</div></div>'
         +'<div class="how">Open your bank app → Interac e-Transfer → send <b>$'+(amt%1?amt.toFixed(2):String(amt))+'</b> to the address above. Hold the address to select it, or tap Copy.</div>'; }
  else { h+='<div class="warn">'+esc(to)+' hasn’t added an e-transfer address yet — ask them for it, or hand over cash.</div>'; }
  c.innerHTML=h;
  var a=document.getElementById('a'); if(a){ a.onclick=function(){ var done=function(){ var b=document.getElementById('b'); if(b){ b.textContent='Copied ✓'; setTimeout(function(){ b.textContent='Copy'; },1800); } };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(e).then(done).catch(function(){}); } else { try{ var t=document.createElement('textarea'); t.value=e; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); done(); }catch(_){} } }; }
  document.title='Pay '+to+' $'+amt+' · Pards Golf';
})();
</script></body></html>
